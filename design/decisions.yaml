# Determinism ledger: one line per design decision. Rules: docs/design-standard-proposal.md.
#   kind   standard | formula | closed | judgment
#   check  test:<path> | e2e:<path> | tool:<path> | eslint:<rule>. Leave empty until a check exists.
#          A test or e2e file names the decision it proves with `decision:<id>`. A tool must be run by make.
#          Keep this file in block style: tools/design_check.py reads it without PyYAML.
version: 1
decisions:
