      check: "tool:tools/boundaries.py",
    }
  - {
      id: display-kind,
      layer: semantics,
      kind: closed,
      source: ontology display key,
      check: "tool:tools/design_codegen.py",
    }
  - {
      id: labels,
      layer: content,
      kind: closed,
      source: ontology/labels.yaml,
      check: "test:tests/language.test.ts",
    }
  - {
      id: label-lookup,
      layer: content,
      kind: formula,
      source: company label else preferred,
      check: "test:tests/label.test.ts",
    }
  - {
      id: tone-position,
