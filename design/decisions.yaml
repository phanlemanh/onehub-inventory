# Determinism ledger: one line per design decision. Rules: docs/design-standard-proposal.md.
#   kind   standard | formula | closed | judgment
#   check  test:<path> | e2e:<path> | tool:<path> | eslint:<rule>. Leave empty until a check exists.
version: 1
decisions:
  - {
      id: color-role,
      layer: foundations,
      kind: standard,
      source: shadcn variables,
      check: "eslint:onehub-ui/no-hardcoded-color",
    }
  - {
      id: color-palette,
      layer: foundations,
      kind: standard,
      source: Tailwind neutral and status,
      check: "eslint:onehub-ui/no-raw-palette",
    }
  - {
      id: type-scale,
      layer: foundations,
      kind: standard,
      source: Tailwind 4 defaults,
      check: "eslint:onehub-ui/no-arbitrary-text-size",
    }
  - {
      id: motion,
      layer: foundations,
      kind: standard,
      source: Tailwind 4 defaults,
      check: "eslint:onehub-ui/no-banned-motion",
    }
  - { id: spacing, layer: foundations, kind: standard, source: Tailwind 4 defaults }
  - { id: radius, layer: foundations, kind: standard, source: shadcn radius variable }
  - { id: brand-exceptions, layer: foundations, kind: closed, source: src/styles/onehub.css }
  - {
      id: raw-controls,
      layer: core,
      kind: standard,
      source: shadcn on Base UI,
      check: "eslint:onehub-ui/no-raw-controls",
    }
