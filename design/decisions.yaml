  - { id: format-number-date, layer: content, kind: standard, source: Intl vi-VN }
  - { id: column-align, layer: core, kind: formula, source: display kind }
  - { id: column-width, layer: core, kind: formula, source: label and sample length }
  - { id: table-density, layer: core, kind: formula, source: total minimum width }
