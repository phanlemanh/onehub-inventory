    }
  - {
      id: icons,
      layer: core,
      kind: standard,
      source: Lucide defaults,
      check: "eslint:onehub-ui/no-emoji-icons",
    }
  - {
      id: lint-exceptions,
      layer: governance,
      kind: closed,
      source: reason required,
      check: "eslint:onehub-ui/require-disable-reason",
    }
  - {
      id: component-level,
