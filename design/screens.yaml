# Screen register: every page under src/app is declared here (roadmap row 1d, decision 0017).
# tools/coverage_matrix/check.py fails `make check` when a page is missing or an entry is wrong.
#
#   id        stable key; contracts list it under `screens:` and in their Vai × Màn block
#   route     the page's path under src/app, without route groups "(x)" and slots "@x"
#   title     label key in ontology/labels.yaml (null only for audience dev)
#   family    a key of `families`, or null when not assigned yet (row 1c assigns)
#   audience  staff (signed-in staff) | public (customer page) | dev (development build only)
#   status    built (the page exists) | planned (declared ahead, no page yet)
#   vao       (staff/public) the action a role must hold to open the screen, a name in ontology/actions.yaml, or null when
#             every member of the company may open it; a built screen never names a planned action (row 9b)
#   nut       (staff/public) the actions the screen has buttons for, names in ontology/actions.yaml; a declared action not
#             found in the code yet shows as «dự kiến» in design/vai-man-nut.md (row 9b)
#   mo_san    (optional) the actions of `nut` whose buttons show as soon as the screen opens; the role × screen browser
#             suite expects exactly these for every role that holds them (row 9b)
#   nut_chung (staff/public) buttons that do not depend on a permission, as people read them
#
# `khung` declares the same for the App Shell around every staff screen: the top bar and the second column (row 9b).
families:
  grid: Lưới
audiences: [staff, public, dev]
statuses: [built, planned]
khung:
  nut: [editView, removeView]
  nut_chung: [Tìm (⌘K), Đổi sàn, Đăng xuất]
screens:
  - id: today
    route: /
    title: Today
    family: null
    audience: staff
    status: built
    vao: null
    nut: []
    nut_chung: []
  - id: inventory
    route: /inventory
    title: Inventory
    family: grid
    audience: staff
    status: built
    vao: null
    nut:
      - saveView
      - editView
      - createListing
      - updateListing
      - activateListing
      - removeListing
      - viewOwnerPhone
    mo_san: [saveView]
    nut_chung: [Chép đường dẫn, Lọc, Cột, Toàn màn hình, Trước, Sau, Đóng]
  - id: sent
    route: /sent
    title: Sent
    family: grid
    audience: staff
    status: built
    vao: null
    nut: []
    nut_chung: [Lọc, Cột, Toàn màn hình]
  - id: contacts
    route: /contacts
    title: Contact
    family: grid
    audience: staff
    status: planned
    vao: viewContacts
    nut: [createContact, updateContact, removeContact, mergeContacts, eraseContactPersonalData]
    nut_chung: []
  - id: tuy-chinh-san
    route: /tuy-chinh-san
    title: CompanyLayer
    family: grid
    audience: staff
    status: planned
    vao: readCompanyLayer
    nut: [addCompanyLayer, editCompanyLayer, retireCompanyLayer, matchPendingUnits]
    nut_chung: []
  - id: proto
    route: /proto/[slug]
    title: null
    family: null
    audience: dev
    status: built
  - id: proto-bo-nut
    route: /proto/bo-nut-theo-quyen
    title: null
    family: null
    audience: dev
    status: built
  - id: sign-in
    route: /login
    title: SignIn
    family: null
    audience: staff
    status: built
    vao: null
    nut: []
    nut_chung: []
  - id: members
    route: /members
    title: Member
    family: null
    audience: staff
    status: built
    vao: listMembers
    nut: [inviteMember, changeMemberRoles]
    mo_san: [inviteMember, changeMemberRoles]
    nut_chung: []
