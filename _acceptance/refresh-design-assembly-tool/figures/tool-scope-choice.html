<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phạm vi chép công cụ · Cây quyết định</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-soft); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây quyết định · Cổng Phạm vi</p>
    <h1>Chép cả thư mục công cụ, hay chỉ tệp sửa ghi trùng</h1>
    <p class="sub">Một hiện trạng, hai cách làm. Mỗi nhánh kéo theo hai điều; cả hai nhánh cùng tới một kết quả.</p>

    <svg viewBox="0 0 1240 472" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first (behind nodes) -->
      <!-- Start → branch A (done, recommended) -->
      <path d="M 240 200 H 260 Q 268 200 268 192 V 124 Q 268 116 276 116 H 296" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Start → branch B -->
      <path d="M 240 216 H 260 Q 268 216 268 224 V 292 Q 268 300 276 300 H 296" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Branch A → its two consequences -->
      <path d="M 536 108 H 556 Q 564 108 564 100 V 84 Q 564 76 572 76 H 592" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 536 124 H 556 Q 564 124 564 132 V 148 Q 564 156 572 156 H 592" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Branch B → its two consequences -->
      <path d="M 536 292 H 556 Q 564 292 564 284 V 268 Q 564 260 572 260 H 592" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 536 308 H 556 Q 564 308 564 316 V 332 Q 564 340 572 340 H 592" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Both branches → shared end (four nested elbows, own attach point each) -->
      <path d="M 872 76 H 912 Q 920 76 920 84 V 176 Q 920 184 928 184 H 960" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 872 156 H 888 Q 896 156 896 164 V 192 Q 896 200 904 200 H 960" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 872 260 H 888 Q 896 260 896 252 V 224 Q 896 216 904 216 H 960" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 872 340 H 912 Q 920 340 920 332 V 240 Q 920 232 928 232 H 960" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Start: the situation -->
      <rect x="40" y="172" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="172" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="180" width="80" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="88" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HIỆN TRẠNG</text>
      <text x="140" y="216" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Công cụ ở Inventory</text>
      <text x="140" y="232" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">lệch plugin ở năm tệp</text>

      <!-- Branch A (done, machine recommends — focal) -->
      <rect x="296" y="80" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="80" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="304" y="88" width="60" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="334" y="100" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH A</text>
      <text x="372" y="100" fill="#ba4513" font-size="9" font-weight="500">nhánh đã làm · máy khuyên</text>
      <text x="416" y="132" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Chép cả thư mục</text>

      <!-- Branch B -->
      <rect x="296" y="264" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="264" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="304" y="272" width="60" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="334" y="284" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH B</text>
      <text x="416" y="316" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Chỉ chép tệp sửa ghi trùng</text>

      <!-- Consequences of A -->
      <rect x="592" y="48" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="48" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="72" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Một phiên bản công cụ,</text>
      <text x="732" y="88" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">khớp plugin từng byte (AC-3)</text>

      <rect x="592" y="128" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="128" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Phần đọc sổ màn đi kèm,</text>
      <text x="732" y="168" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">chưa chạy ở kho này (AC-4)</text>

      <!-- Consequences of B -->
      <rect x="592" y="232" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="232" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="264" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ít mã chưa dùng hơn</text>

      <rect x="592" y="312" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="312" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Công cụ thành bản trộn hai phiên bản;</text>
      <text x="732" y="352" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">AC-3 phải viết lại cho một tệp</text>

      <!-- Shared end -->
      <rect x="960" y="160" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="160" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="968" y="168" width="148" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1042" y="180" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CẢ HAI NHÁNH CÙNG TỚI</text>
      <text x="1080" y="216" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Sổ linh kiện hết ghi trùng</text>
      <text x="1080" y="232" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">chín linh kiện bộ lọc (AC-2)</text>

      <!-- Legend strip -->
      <line x1="40" y1="404" x2="1200" y2="404" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="436" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="64" y="446" fill="#4f5d75" font-size="9">Nhánh đã làm · máy khuyên</text>

      <rect x="232" y="436" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="446" fill="#4f5d75" font-size="9">Hiện trạng · lựa chọn</text>

      <rect x="400" y="436" width="16" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="424" y="446" fill="#4f5d75" font-size="9">Điều mỗi nhánh kéo theo</text>

      <rect x="580" y="436" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="604" y="446" fill="#4f5d75" font-size="9">Kết quả chung của cả hai nhánh</text>
    </svg>
  </div>
</body>
</html>
