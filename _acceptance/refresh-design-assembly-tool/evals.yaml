schema_version: 1
feature_slug: refresh-design-assembly-tool
# Ma trận viết trước (dữ liệu ở rang/matrix.mjs, mọi phép đo đọc nó).
#   Commit nhánh được cắt ra, công cụ trước khi chép: 0861fdcb6906a3d86d6c88df830c9ac40447d263.
#   Chín linh kiện công cụ cũ ghi hai lần, và tệp định nghĩa từng cái (AC-2):
#     FilterAdvancedRow, FiltersAdvancedPanel, FiltersAdvanced → src/components/reui/filters/filters-advanced.tsx
#     FilterFieldPicker, FiltersBuilder → src/components/reui/filters/filters-builder.tsx
#     FilterValuePopover, FilterOperatorPopover, FilterRuleMenuItems, FilterChip → src/components/reui/filters/filters-chip.tsx
#     Dòng in: «names once: <n> entries for <n> names; the old tool gave <m> entries for the same names», m > n;
#     lệch → «names once: listed more than once: <tên …>» · «names once: <tên> is at <tệp>, not at <tệp>» ·
#     «names once: the old tool listed, the new one does not: <tên …>» · «names once: the new tool lists, the old one
#     did not: <tên …>» · «names once: the old tool did not list twice: <tên …>».
#   Thư mục công cụ của plugin (AC-3): commit feea58d của design-assembly; mã cây git của thư mục ở kho plugin
#     (git rev-parse feea58d:plugins/design-assembly/templates/tools/design-assembly) là
#     357987f790b1a0b52630f683780290933800fc3f, 27 tệp.
#     Dòng in: «tool: tools/design-assembly is the plugin's at feea58d, 27 files, tree 357987f790b1»;
#     lệch → «tool: tools/design-assembly differs from the plugin's at feea58d: <k> files, tree <…>».
#   Sổ thiết kế nhánh được đổi (AC-4): chỉ design/component-registry.json.
#     Dòng in: «design ledgers: this branch changed design/component-registry.json; no screen-actions check declared»
#     (sau khi nhánh đã gộp: «… changed none; …»); lệch → «design ledgers: changed by this branch: <tệp …>» ·
#     «design ledgers: the check data declares screen-actions for <id …>».
#   Cặp hai chiều (measures-two-way.mjs), bốn bài, chín ca phá cho chín thông điệp:
#     names once — năm ca, mỗi thông điệp lệch ở trên một ca;
#     lệnh kiểm sổ của công cụ mới — một ca: sổ thiếu mục FilterChip → «design/component-registry.json is not what
#       src/components gives»;
#     tool — hai ca: thêm một byte → «…: 27 files», thêm một tệp → «…: 28 files»;
#     design ledgers — hai ca, mỗi thông điệp lệch ở trên một ca.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: [tools/**, design/**, tests/**, src/components/**, mk/**]
    expected: "exit 0; đầu ra có dòng 'design-assembly: 17 decisions held by 20 checks, each seen failing on a changed copy' và dòng 'component manifest: design/component-registry.json is up to date (<k> components)'. Chiều đỏ: E10 (bản dựng tạm thêm một linh kiện không ghi sổ làm chính lệnh kiểm ấy, với công cụ mới, đỏ và gọi tên linh kiện) và E7 (sổ thiếu một mục làm lệnh kiểm sổ của công cụ mới đỏ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.register_names_once
    layer: backend-effect
    paths: [design/component-registry.json, tools/design-assembly/**, src/components/**, _acceptance/refresh-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'names once: <n> entries for <n> names; the old tool gave <m> entries for the same names' với m lớn hơn n. Chiều đỏ: E7 (sổ của commit 0861fdc → 'names once: listed more than once: FilterAdvancedRow FilterChip'; FilterChip đặt ở tệp gom → 'names once: FilterChip is at src/components/reui/filters/filters.tsx, not at src/components/reui/filters/filters-chip.tsx'; sổ bỏ một mục → 'names once: the old tool listed, the new one does not: <tên>')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.tool_matches_plugin
    layer: backend-effect
    paths: [tools/design-assembly/**, _acceptance/refresh-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'tool: tools/design-assembly is the plugin's at feea58d, 27 files, tree 357987f790b1', trong đó mã cây ghim là mã chính kho plugin cho thư mục công cụ của nó ở commit feea58d. Chiều đỏ: E8 (bản dựng tạm thêm một byte vào check.mjs → 'differs from the plugin's at feea58d: 27 files'; thêm một tệp → 'differs from the plugin's at feea58d: 28 files')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.only_register_changed
    layer: backend-effect
    paths: [design/**, _acceptance/refresh-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'design ledgers: this branch changed design/component-registry.json; no screen-actions check declared'. Chiều đỏ: E9 (danh sách tệp đổi có design/theme.json → 'design ledgers: changed by this branch: design/theme.json'; dữ liệu lệnh kiểm khai screen-actions → 'design ledgers: the check data declares screen-actions for screen-actions')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.component_register
    layer: backend-effect
    paths: [design/component-registry.json, tests/design-registry.test.ts, tools/design-assembly/**]
    expected: "exit 0; mọi bài của tests/design-registry.test.ts đạt, 0 bài hỏng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.proof_gate_real
    layer: backend-effect
    paths: [tools/proof_gate/**, design/component-registry.json, design/so-khoi.yaml]
    expected: "exit 0; dòng 'proof-gate: mọi màn đang mở đã chứng minh đúng lối', chạy trên kho ở HEAD, đọc sổ linh kiện thật"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-2
    executor: script
    cmd: config:executors.script.refresh_measures_two_way
    layer: backend-effect
    paths: [_acceptance/refresh-design-assembly-tool/rang/**, tools/design-assembly/**, design/component-registry.json, design/theme.json]
    expected: "exit 0; bốn bài đạt, 0 hỏng. Bài 'register-names-once' xanh trên kho và đỏ ở năm ca phá, mỗi ca một thông điệp ghim của ma trận đầu tệp (sổ của commit 0861fdc; FilterChip đặt ở tệp gom; sổ bỏ một mục; sổ thêm tên NotAComponent; công cụ mới đưa vào làm công cụ cũ → 'the old tool did not list twice: FilterAdvancedRow FiltersAdvancedPanel'). Bài lệnh kiểm sổ của công cụ mới xanh trên kho, đỏ khi sổ thiếu mục FilterChip"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-3
    executor: script
    cmd: config:executors.script.refresh_measures_two_way
    layer: backend-effect
    paths: [_acceptance/refresh-design-assembly-tool/rang/**, tools/design-assembly/**]
    expected: "exit 0; bài 'tool-tree' đạt: xanh trên kho; đỏ trên bản dựng tạm thêm một byte vào check.mjs ('differs from the plugin's at feea58d: 27 files') và trên bản thêm một tệp ('differs from the plugin's at feea58d: 28 files')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-4
    executor: script
    cmd: config:executors.script.refresh_measures_two_way
    layer: backend-effect
    paths: [_acceptance/refresh-design-assembly-tool/rang/**, design/theme.json]
    expected: "exit 0; bài 'only-register-changed' đạt: xanh trên kho; đỏ khi danh sách tệp đổi có design/theme.json ('design ledgers: changed by this branch: design/theme.json') và khi dữ liệu lệnh kiểm khai screen-actions ('design ledgers: the check data declares screen-actions for screen-actions')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-1
    executor: script
    cmd: config:executors.script.register_matches_source
    long_running: 5
    layer: backend-effect
    paths: [design/component-registry.json, src/components/**, tools/design-assembly/**]
    expected: "exit 0; dòng 'component manifest: design/component-registry.json is up to date (<k> components)'; rồi trên bản dựng tạm, với công cụ mới: lượt không thêm gì thoát 0, lượt thêm changed-probe.tsx thoát khác 0 với 'ChangedProbe is not in the file'; dòng cuối 'new component: green as committed, red with ChangedProbe added'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
