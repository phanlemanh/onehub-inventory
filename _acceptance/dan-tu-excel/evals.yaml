    expected: "exit 0; ca 'khong-quyen-khong-mo': vai CompanyAdmin dán thì không bản xem trước, cửa 0 lần, có thông báo; ListAgent thì mở (đối chứng dương); ca 'cat-xoa-khong-ghi': cắt, Delete, Backspace không gọi cửa. Chiều đỏ: pha-thu-bo-quyen → «khong-quyen-khong-mo: CompanyAdmin»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7-e2e
    criterion: AC-7
    executor: test
    cmd: config:executors.test.dan_tu_excel_e2e
    paths: [src/modules/listings/**, src/components/candidate/**, tests/e2e/dan-tu-excel.spec.ts]
    expected: "exit 0 ở bốn khổ; ca 'khong-quyen' (CompanyAdmin, 1440): không bản xem trước, 0 lần ghi; ca 'dien-thoai-khong-dan' (360, 414): dán không mở gì, 0 lần ghi. Chiều đỏ: điện thoại mở bản xem trước → «dien-thoai-khong-dan: mở ở 360»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.dan_tu_excel_e2e
    paths: [src/components/candidate/**, src/modules/listings/ui/**, tests/e2e/dan-tu-excel.spec.ts, tests/e2e/sheet.spec.ts, tests/e2e/sua-tren-o.spec.ts]
    expected: "exit 0; ca 'phim-trong-ban-xem-truoc': tiêu điểm vào ở Áp, Tab/Shift+Tab đi qua ô chọn và hai nút, Space bật tắt, Esc đóng, tiêu điểm về ô đang chọn và ArrowDown chuyển ô; hộp thoại có tên và mô tả; bài của 2a và 4 vẫn xanh. Chiều đỏ: Esc để tiêu điểm ở body → «phim-trong-ban-xem-truoc: tiêu điểm không về ô»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-10
    executor: test
    cmd: config:executors.test.dan_tu_excel_e2e
    layer: backend-effect
    paths: [src/components/candidate/**, src/modules/listings/**, tests/e2e/dan-tu-excel.spec.ts]
    expected: "exit 0 ở 1440; bốn ca viết trước: 'mot-o-ca-vung' (1 ô «3 tỷ» lên vùng chọn 4 ô Giá chào → 4 dòng sẽ đổi), 'khoi-lap' (khối 1 × 2 lên vùng 2 × 2 → 4 ô, hai dòng giống nhau), 'loc-khong-ghi-dong-an' (lọc Toà, dán 3 dòng → bản xem trước chỉ có căn đang hiện, Áp không ghi id của dòng ẩn; đối chứng dương: id dòng hiện có trong window.__sampleSaves), 'ngoai-tuyen-tu-dau' (context.setOffline(true) rồi Áp → 0 ô đổi trên bảng, thông báo «Chưa ô nào được ghi — mất kết nối mạng.»). Chiều đỏ: dán ghi theo thứ tự dòng của dữ liệu thay vì dòng đang hiện → «loc-khong-ghi-dong-an: ghi dòng ẩn»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

