<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng mời người</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình tại điểm quyết định · Mời người, gán vai</p>
    <h1>Mời người: máy gửi thư mời, hay quản trị tự báo</h1>
    <p class="sub">Hỏi-1 của thiết kế · AC-1, AC-2</p>

    <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Lanes ===== -->
      <line x1="40" y1="64" x2="1160" y2="64" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="300" x2="1160" y2="300" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="528" x2="1160" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="40" y="88" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.18em">QUẢN TRỊ SÀN</text>
      <text x="40" y="324" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NGƯỜI ĐƯỢC MỜI</text>

      <!-- ===== Arrows (drawn before boxes) ===== -->
      <!-- 1 -> 2 -->
      <line x1="344" y1="184" x2="382" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2 -> B (up, fanned) -->
      <path d="M544 172 H564 Q572 172 572 164 V132 Q572 124 580 124 H598" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- 2 -> A (down, fanned) -->
      <path d="M544 196 H564 Q572 196 572 204 V236 Q572 244 580 244 H598" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- A: thư -> mở thư (handoff) -->
      <line x1="680" y1="280" x2="680" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B: kênh khác -> tự tìm (handoff) -->
      <path d="M760 124 H872 Q880 124 880 132 V330" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- mở thư -> xin mã -->
      <path d="M680 396 V460 Q680 468 688 468 H798" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tự tìm -> xin mã -->
      <line x1="880" y1="396" x2="880" y2="434" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- xin mã -> vào sàn -->
      <line x1="960" y1="468" x2="998" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- arrow labels -->
      <rect x="688" y="304" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="692" y="316" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">THƯ TỚI</text>

      <!-- ===== Quản trị sàn ===== -->
      <rect x="184" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="184" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm «Mời»</text>
      <text x="264" y="198" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">email · tên · vai</text>

      <rect x="384" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="464" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy thêm người vào sàn</text>
      <text x="464" y="198" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">có ngay trong danh sách</text>

      <!-- Nhánh B -->
      <rect x="600" y="88" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="88" width="160" height="72" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="608" y="94" width="88" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="652" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B · KHÔNG THƯ</text>
      <text x="680" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quản trị tự báo</text>
      <text x="680" y="148" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">qua kênh khác</text>

      <!-- Nhánh A -->
      <rect x="600" y="208" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="208" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="608" y="214" width="88" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="652" y="226" fill="#ba4513" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A · MÁY KHUYÊN</text>
      <text x="680" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy gửi một thư mời</text>
      <text x="680" y="268" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tên sàn, người mời, vai</text>

      <!-- Ghi chú -->
      <text x="388" y="264" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Thư hỏng thì không ai</text>
      <text x="388" y="280" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">được thêm, quản trị thử lại</text>

      <!-- ===== Người được mời ===== -->
      <rect x="600" y="332" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="332" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở thư mời</text>
      <text x="680" y="378" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">bấm tới trang đăng nhập</text>

      <rect x="800" y="332" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="332" width="160" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="880" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tự tìm trang đăng nhập</text>
      <text x="880" y="378" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không có đường dẫn sẵn</text>

      <rect x="800" y="436" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="436" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xin mã, gõ mã</text>
      <text x="880" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mã về email, như hàng 8</text>

      <rect x="1000" y="436" width="160" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="1000" y="436" width="160" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="1080" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vào sàn với đúng vai</text>
      <text x="1080" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thanh bên theo vai</text>

      <!-- AC tags -->
      <rect x="436" y="224" width="56" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="464" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-2</text>
      <rect x="776" y="240" width="56" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="804" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-2</text>
      <rect x="436" y="128" width="56" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="464" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-1</text>
      <rect x="1052" y="508" width="56" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1080" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-1</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="568" x2="1160" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="600" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước chung</text>

      <rect x="132" y="600" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="152" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh A, máy khuyên</text>

      <rect x="268" y="600" width="14" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="288" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh B, không thư</text>

      <line x1="396" y1="604" x2="424" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="432" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Luồng</text>

      <line x1="480" y1="604" x2="508" y2="604" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="516" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Luồng nhánh B</text>

      <rect x="596" y="598" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="632" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tiêu chí nghiệm thu</text>
    </svg>
  </div>
</body>
</html>
