<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 · Cài gói</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', 'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    h1 code { font-family: var(--font-mono); font-size: 0.8em; }
    .sub { color: var(--color-soft); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sơ đồ rẽ nhánh · Hỏi-1 · Cổng Phạm vi</p>
    <h1>Hỏi-1: cài <code>make setup</code> trước lượt chấm</h1>
    <p class="sub">Liên quan: AC-1, AC-2 (không đổi), bộ suite của lượt chấm.</p>

    <div class="scroll">
    <svg viewBox="0 0 1232 384" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      <rect x="0" y="0" width="1232" height="384" fill="#f5f5f5"/>

      <!-- Connectors first (behind nodes) -->
      <!-- Root → branch A (two attach points on the root's right edge) -->
      <path d="M 232 132 L 248 132 Q 256 132 256 124 L 256 88 Q 256 80 264 80 L 280 80" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Root → branch B -->
      <path d="M 232 188 L 248 188 Q 256 188 256 196 L 256 232 Q 256 240 264 240 L 280 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Branch A chain -->
      <path d="M 440 80 L 480 80" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 680 80 L 720 80" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 920 80 L 960 80" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Branch B chain -->
      <path d="M 440 240 L 600 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 800 240 L 960 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Root: today's baseline -->
      <rect x="32" y="80" width="200" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="80" width="200" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="88" width="88" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="84" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NỀN HÔM NAY</text>
      <text x="132" y="140" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">make check</tspan> xanh</text>
      <text x="132" y="160" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">build và e2e đỏ</text>
      <text x="132" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next 16.4.2 trong node_modules</text>
      <text x="132" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lockfile đòi 16.4.6</text>

      <!-- Branch A · choice (focal) -->
      <rect x="280" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="40" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="288" y="48" width="64" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="320" y="60" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH A</text>
      <text x="360" y="96" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Cho phép <tspan font-family="'Geist Mono', monospace" font-weight="500">make setup</tspan></text>

      <!-- Branch A · install -->
      <rect x="480" y="40" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="40" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="72" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">npm ci</tspan> từ lockfile</text>
      <text x="580" y="90" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">trong worktree này</text>
      <text x="580" y="108" fill="#4f5d75" font-size="9" text-anchor="middle">(checkout chính không đổi)</text>

      <!-- Branch A · grading run -->
      <rect x="720" y="40" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="40" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="820" y="76" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Lượt chấm chạy đủ</text>
      <text x="820" y="96" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle">make check, build, e2e</text>

      <!-- Branch A · outcome -->
      <rect x="960" y="40" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="40" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="1080" y="76" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bằng chứng đủ ba lệnh</text>
      <text x="1080" y="96" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">của bộ suite</text>

      <!-- Branch B · choice -->
      <rect x="280" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="208" width="64" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="320" y="220" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH B</text>
      <text x="360" y="256" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Không cài</text>

      <!-- Branch B · grading run -->
      <rect x="600" y="200" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="200" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="228" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Lượt chấm chạy</text>
      <text x="700" y="246" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">build và e2e đỏ</text>
      <text x="700" y="264" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">ở cả nền lẫn nhánh</text>

      <!-- Branch B · outcome -->
      <rect x="960" y="200" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="200" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="1080" y="236" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Lượt có thể dừng vì hạ tầng;</text>
      <text x="1080" y="256" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">bằng chứng thiếu build, e2e</text>

      <!-- Legend strip -->
      <line x1="32" y1="312" x2="1200" y2="312" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="32" y="348" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="56" y="358" fill="#4f5d75" font-size="9">Nhánh cho bằng chứng đủ</text>

      <rect x="216" y="348" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="358" fill="#4f5d75" font-size="9">Hiện trạng · lựa chọn · bước</text>

      <rect x="420" y="348" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="444" y="358" fill="#4f5d75" font-size="9">Điều kéo theo cho lượt chấm</text>
    </svg>
    </div>
  </main>
</body>
</html>
