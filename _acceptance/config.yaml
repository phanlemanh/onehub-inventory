# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict     # suy từ: _acceptance/config.yaml của Quỹ hàng
gap_probe: required     # suy từ: Quỹ hàng (mặc định của kit là advisory)
recheck: strict         # suy từ: kho mới, chưa có báo cáo cũ
executors:
  test:
    unit: "make test"                # suy từ: Makefile
    proof_gate: "npx vitest run tools/proof_gate --coverage.enabled=false --reporter=verbose"   # thang-chon-khoi-vao-cong (1n): screen proof gate only
    mot_cua: "npx vitest run src/modules/identity/one-door.test.ts --coverage.enabled=false --reporter=verbose"   # row 7a: one query door scan, rule 3 (no role or company switch outside the door)
    danh_muc: "npx vitest run src/modules/catalog tests/danh-muc-chuyen-mau.test.ts --coverage.enabled=false --reporter=verbose"   # danh-muc-can-nhu-onehub-invest (row 7d): code reader, keys, sample move
    sua_tren_o: "npx vitest run src/modules/listings/edit-rules.test.ts src/modules/listings/save-door.test.ts src/components/candidate/use-change.test.tsx src/components/candidate/data-region-cell-edit.test.tsx --coverage.enabled=false --reporter=verbose"   # sua-tren-o (row 4): edit rules, save door and undo, cell edit by permission
    sua_tren_o_e2e: "npx playwright test tests/e2e/sua-tren-o.spec.ts tests/e2e/sheet.spec.ts tests/e2e/ho-so-can.spec.ts"   # sua-tren-o (row 4): in-cell edit at four sizes, with the 2a and 3 key rules
    sua_tren_o_rao: "npx vitest run tests/behavior-guard.test.ts --coverage.enabled=false --reporter=verbose"   # sua-tren-o (row 4): behaviour guard reads .ts as TypeScript (K-5)
    vai_dang_nhap_unit: "npx vitest run src/modules/identity/with-company.test.ts tests/vai-dang-nhap-nguon.test.ts --coverage.enabled=false --reporter=verbose"   # ung-dung-noi-bang-vai-khong-chu (row 7c): door checks its login role, source scan of test connection strings, .env.example add-only
    vai_man_so: "npx vitest run tests/vai-man-so-man.test.ts --coverage.enabled=false --reporter=verbose"   # kiem-vai-theo-man (row 9b): screen register entry rule, pair set, shared sign-in door, sidebar vs register
    vai_man_nut: "npx vitest run tests/vai-man-nut-sinh.test.ts tests/vai-man-dau-nut.test.tsx tests/bo-nut-vai-man.test.ts src/modules/identity/permitted-action.test.tsx --coverage.enabled=false --reporter=verbose"   # kiem-vai-theo-man (row 9b): role × screen × button table from the register and module UI, every screen and the App Shell frame
  script:
    check: "make check"              # suy từ: Makefile, .github/workflows/ci.yml
    build: "npm run build"           # suy từ: package.json, ci.yml
    quyen_kho: "bash -c 'out=$(npx vitest run tests/permissions.test.ts --coverage.enabled=false 2>&1); rc=$?; printf \"%s\\n\" \"$out\"; [ $rc -eq 0 ] && printf \"%s\" \"$out\" | grep -qE \"Tests +47 passed \\(47\\)\"'"
    quyen_kho_ban_goc: "node -e \"const a=JSON.parse(require('child_process').execSync('git show 84a2d597:.claude/settings.json')).permissions,b=JSON.parse(require('fs').readFileSync('.claude/settings.json')).permissions;for(const k of ['deny','allow'])if(JSON.stringify(a[k])!==JSON.stringify(b[k])){console.error(k+' list changed');process.exit(1)}console.log('deny and allow identical to 84a2d597')\""
    e2e: "make e2e"                  # suy từ: mk/design.mk — cần trình duyệt Playwright
    product_map: "R=\"${CLAUDE_PLUGIN_ROOT:-$(node tools/kit-root.mjs)}\" && node \"$R/scripts/product-map.mjs\" --root . --check"   # suy từ: mẫu của kit, cách viết của Quỹ hàng
    cach_ly: "bash db/scripts/cach-ly.sh"   # hồ sơ cach-ly-moi-san — Postgres của dãy (DB_LANE), duyệt N-2
    vai_man: "npx vitest run tests/coverage-matrix.test.ts --coverage.enabled=false"   # row 1d: role × screen register and contract block
    reui_catalog_offline: "node --require ./tools/reui_catalog/no-network.cjs tools/reui_catalog/build.mjs && node --require ./tools/reui_catalog/no-network.cjs tools/reui_catalog/build.mjs && git diff --exit-code -- design/reui-catalog.json && echo 'reui catalog regenerated twice offline, identical to commit'"   # danh-muc-reui (1g)
    reui_catalog_check: "node --require ./tools/reui_catalog/no-network.cjs tools/reui_catalog/build.mjs --check"   # danh-muc-reui (1g)
    reui_catalog_test: "npx vitest run tools/reui_catalog --coverage.enabled=false --reporter=verbose"   # danh-muc-reui (1g)
    man_mau: "npx vitest run tools/e2e_templates --coverage.enabled=false --reporter=verbose"   # bo-bai-kiem-tu-so-man (1f): register-driven suite, unit level
    dang_nhap_db: "DB_LANE=${DB_LANE:-n} DB_PORT=${DB_PORT:-5563} npx vitest run -c vitest.db.config.ts --reporter=verbose"   # dang-nhap-ma-email (row 8): lane Postgres, scratch databases dang_nhap_*
    dang_nhap_e2e: "DB_LANE=${DB_LANE:-n} DB_PORT=${DB_PORT:-5563} npx playwright test -c playwright.db.config.ts"   # dang-nhap-ma-email (row 8): browser flow on lane Postgres
    va_dang_nhap_db: "DB_LANE=r DB_PORT=5565 npx vitest run -c vitest.db.config.ts --reporter=verbose"   # va-dang-nhap (row 1m): row 8 database tests on lane R Postgres
    va_dang_nhap_e2e: "DB_LANE=r DB_PORT=5565 npx playwright test -c playwright.db.config.ts"   # va-dang-nhap (row 1m): every sign-in browser test on lane R Postgres
    va_dang_nhap_cach_ly: "DB_LANE=r DB_PORT=5565 bash db/scripts/cach-ly.sh"   # va-dang-nhap (row 1m): isolation suite on lane R Postgres
    moi_nguoi_db: "DB_LANE=${DB_LANE:-n} DB_PORT=${DB_PORT:-5563} npx vitest run -c vitest.db.config.ts tests/db/moi-nguoi.db.test.ts --reporter=verbose"   # moi-nguoi-gan-vai (row 9): lane Postgres, scratch databases moi_nguoi_*
    cach_ly_n: "DB_LANE=${DB_LANE:-n} bash db/scripts/cach-ly.sh"   # moi-nguoi-gan-vai (row 9): the isolation suite on lane N's Postgres when other lanes' containers run too
    moi_nguoi_e2e: "DB_LANE=${DB_LANE:-n} DB_PORT=${DB_PORT:-5563} npx playwright test -c playwright.db.config.ts tests/e2e-db/members.spec.ts"   # moi-nguoi-gan-vai (row 9): members screen on lane Postgres
    kiem_chung_phien: "DB_LANE=h DB_PORT=5567 npx playwright test -c playwright.db.config.ts tests/e2e-db/screens.spec.ts"   # bo-kiem-chung-khi-dang-nhap (1r): register-driven suite with one test session, lane H Postgres
    kiem_chung_lap: "E2E_CPU_THROTTLE=4 npx playwright test --grep @cho --project=360 --project=1024 --repeat-each=20"   # bo-kiem-chung-khi-dang-nhap (1r): sheet and banner waits, 20 runs on a 4x slowed CPU
    kiem_chung_lap_phien: "DB_LANE=h DB_PORT=5567 E2E_CPU_THROTTLE=4 npx playwright test -c playwright.db.config.ts tests/e2e-db/members.spec.ts --grep @cho --project=360 --repeat-each=20"   # bo-kiem-chung-khi-dang-nhap (1r): members sheet wait, 20 runs slowed, lane H Postgres
    kiem_chung_db_tron: "DB_LANE=h DB_PORT=5567 npx playwright test -c playwright.db.config.ts"   # bo-kiem-chung-khi-dang-nhap (1r): every signed-in browser test after the shared setup changed, lane H Postgres
    bang_quyen_unit: "npx vitest run src/modules/identity/permissions.test.ts src/modules/identity/permission-table.test.ts --coverage.enabled=false --reporter=verbose"   # bang-quyen-theo-vai (row 9a): permission table, unit level
    bang_quyen_db: "DB_LANE=${DB_LANE:-n} DB_PORT=${DB_PORT:-5563} npx vitest run -c vitest.db.config.ts tests/db/bang-quyen.db.test.ts tests/db/bang-quyen-api.db.test.ts --reporter=verbose"   # bang-quyen-theo-vai (row 9a): every cell at API and database, lane Postgres
    moi_nguoi_db_9a: "DB_LANE=${DB_LANE:-n} DB_PORT=${DB_PORT:-5563} npx vitest run -c vitest.db.config.ts tests/db/moi-nguoi.db.test.ts -t '^(?!.*pha-thu-moi-khong-kiem-quan-tri)' --reporter=verbose"   # bang-quyen-theo-vai (row 9a): row 9's cases and seven break pairs; the invite-without-admin-check pair is caught first at the API now and its database lock is measured by E4 (owner, 2026-11-12)
    cach_ly_7b_db_c: "DB_LANE=${DB_LANE:-c} DB_PORT=${DB_PORT:-5569} npx vitest run -c vitest.db.config.ts tests/db --reporter=verbose"   # cach-ly-dang-xem-chi-ghi (row 7b): every database test file on lane C in one command, no -t filter, so no case of row 9 or 9a is skipped (C-5, supervisor 2026-11-12)
    cach_ly_c: "DB_LANE=${DB_LANE:-c} DB_PORT=${DB_PORT:-5569} bash -c 'bash db/scripts/cach-ly.sh && npx vitest run -c vitest.db.config.ts tests/db/cach-ly.db.test.ts --reporter=verbose'"   # cach-ly-truoc-du-lieu-that (row 7a): isolation suite, then agreements-vs-ontology and runner tests, lane C Postgres — one command so a grading round never runs two of them on the same scratch databases
    cach_ly_db_c: "DB_LANE=${DB_LANE:-c} DB_PORT=${DB_PORT:-5569} bash -c 'bash db/scripts/cach-ly.sh && npx vitest run -c vitest.db.config.ts tests/db/cach-ly.db.test.ts --reporter=verbose'"   # row 7a: same command as cach_ly_c on purpose (deduplicated in a grading round)
    danh_muc_db_r: "DB_LANE=${DB_LANE:-r} DB_PORT=${DB_PORT:-5565} bash -c 'bash db/scripts/cach-ly.sh && npx vitest run -c vitest.db.config.ts tests/db/danh-muc.db.test.ts --reporter=verbose'"   # row 7d: isolation suite, then shared catalog database tests, lane R Postgres — one command so a round never runs both on the same scratch databases
    bang_quyen_db_r: "DB_LANE=${DB_LANE:-r} DB_PORT=${DB_PORT:-5565} npx vitest run -c vitest.db.config.ts tests/db/bang-quyen.db.test.ts --reporter=verbose"   # row 7d: permission table with the three catalog actions (72 cells), lane R Postgres
    vai_dang_nhap_c: "DB_LANE=${DB_LANE:-c} DB_PORT=${DB_PORT:-5569} bash -c 'bash db/scripts/cach-ly.sh && npx vitest run -c vitest.db.config.ts tests/db/cach-ly.db.test.ts tests/db/vai-dang-nhap.db.test.ts --reporter=verbose'"   # ung-dung-noi-bang-vai-khong-chu (row 7c): isolation suite with the login-role cases, then runner tests and the door tests, lane C Postgres, one command
    vai_dang_nhap_e2e_c: "DB_LANE=${DB_LANE:-c} DB_PORT=${DB_PORT:-5569} npx playwright test -c playwright.db.config.ts"   # row 7c: every signed-in browser test, dev server connected as quy_hang_login, lane C Postgres
    bo_nut_unit: "npx vitest run src/modules/identity/permitted-action.test.tsx src/components/candidate/row-actions.test.tsx src/modules/identity/permissions.test.ts --coverage.enabled=false --reporter=verbose"   # bo-nut-theo-quyen (row 9e): shared action button, row menu, confirm dialog
    bo_nut_kiem: "npx vitest run tests/bo-nut-kiem.test.ts --coverage.enabled=false --reporter=verbose"   # bo-nut-theo-quyen (row 9e): every write button goes through the shared component
    bo_nut_vai_man: "npx vitest run tests/bo-nut-vai-man.test.ts --coverage.enabled=false --reporter=verbose"   # bo-nut-theo-quyen (row 9e): role × screen × button table generated from the permission table
    bo_nut_e2e: "npx playwright test tests/e2e/bo-nut.spec.ts"   # bo-nut-theo-quyen (row 9e): template sample under four roles, axe light and dark
    bo_nut_e2e_db: "DB_LANE=${DB_LANE:-v} DB_PORT=${DB_PORT:-5570} npx playwright test -c playwright.db.config.ts tests/e2e-db/bo-nut-members.spec.ts"   # bo-nut-theo-quyen (row 9e): sidebar, members screen and 403 notice on lane V Postgres
    hoi_dau_chu_e2e_db: "DB_LANE=${DB_LANE:-v} DB_PORT=${DB_PORT:-5570} npx playwright test -c playwright.db.config.ts tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts"   # hoi-dau-chu-bao-sai (row 3e): ask bar and report dialog signed in, lane V Postgres
    goc_nhin_db: "DB_LANE=${DB_LANE:-k} DB_PORT=${DB_PORT:-5564} npx vitest run -c vitest.db.config.ts tests/db/goc-nhin.db.test.ts --reporter=verbose"   # luu-goc-nhin-cot-hai (row 2c): saved views at API and database, lane K Postgres
    goc_nhin_e2e: "DB_LANE=${DB_LANE:-k} DB_PORT=${DB_PORT:-5564} npx playwright test -c playwright.db.config.ts tests/e2e-db/goc-nhin.spec.ts"   # luu-goc-nhin-cot-hai (row 2c): save, open, rename, remove a saved view in the browser, lane K Postgres
    cach_ly_k: "DB_LANE=${DB_LANE:-k} DB_PORT=${DB_PORT:-5564} bash db/scripts/cach-ly.sh"   # luu-goc-nhin-cot-hai (row 2c): isolation suite with the saved_view table, lane K Postgres
    ci_db_thu: "bash db/scripts/ci-thu.sh"   # ci-co-postgres (row 1s): shallow clone of HEAD + fresh Postgres from the workflow patch, `make ci-db` green, then break copies (no test session, session cases as owner) red
    ci_db_kiem: "npx vitest run tests/ci-db.test.ts tests/dem-giao-nhan.test.ts tests/don-dung-tam.test.ts tests/ci-ban-sao-nong.test.ts tests/ci-yml-patch.test.ts --coverage.enabled=false --reporter=verbose"   # ci-co-postgres (row 1s): step runner on stubs, hand-over count, build folder sweep, shallow-clone fixtures, workflow patch
    ci_db_that: "node db/scripts/ci-that.mjs --cho 60"   # ci-co-postgres (row 1s): latest CI run on the branch head — job e2e-db green, its log lines, duration against timeout-minutes
    vai_man_e2e: "DB_LANE=${DB_LANE:-d} DB_PORT=${DB_PORT:-5571} bash -c 'J=$(mktemp -t vai-man).json; PLAYWRIGHT_JSON_OUTPUT_NAME=$J npx playwright test -c playwright.db.config.ts tests/e2e-db/vai.setup.ts tests/e2e-db/vai-man.spec.ts --reporter=list,json && node tests/e2e-db/vai-man-doi-chieu.mjs $J'"   # kiem-vai-theo-man (row 9b): every role × screen pair through the shared role sign-in door, lane D Postgres
    vai_man_pha_thu: "DB_LANE=${DB_LANE:-d} DB_PORT=${DB_PORT:-5571} node tests/e2e-db/pha-thu-vai-man.mjs"   # kiem-vai-theo-man (row 9b): three breaks on a copy of the tree, each must turn its pair red with the pinned message
    doi_bai_kiem: "node _acceptance/bo-o-tim-cua-vung/rang/doi-bai-kiem.mjs --root . --self-test"   # bo-o-tim-cua-vung (row 2e): every removed test line about the region search box has a row in the old → new table
    ghim_ngan_e2e: "npx playwright test tests/e2e/ghim-ngan.spec.ts"   # ngan-chi-tiet-ghim-thanh-cot (row 3a): pin the record panel as a column, four widths, axe light and dark
  design:
    floor: "R=\"${CLAUDE_PLUGIN_ROOT:-$(node tools/kit-root.mjs)}\" && node \"$R/scripts/design-floor-s4.mjs\" --root ."   # design-floor at S4: raw hex on touched UI files
    khuon: "R=\"${CLAUDE_PLUGIN_ROOT:-$(node tools/kit-root.mjs)}\" && node \"$R/scripts/design-floor-khuon.mjs\" --kiem --root ."   # template map; silent until design/patterns/ exists
    # No `gate` key: it needs a captured page and cannot read Tailwind 4 colours. Contrast is covered by axe in `make e2e`.
    ui_check: "${CLAUDE_PLUGIN_ROOT:-$(node tools/kit-root.mjs)}/scripts/design-scan.js"
risk_tiers:
  t1_skip_globs:
    - "docs/**"                      # suy từ: tài liệu, như Quỹ hàng
    - "wiki/**"                      # suy từ: AGENTS.md (quyết định, sự cố, ghi chép)
    - "README.md"
    - "CHANGELOG.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "setup-blueprint.yaml"         # suy từ: bản ghi lần dựng kho, không chạy
    - ".github/workflows/ci.yml"     # suy từ: Quỹ hàng — tệp chứa job cổng, ghi đích danh
    - "PRODUCT-MAP.md"               # suy từ: mẫu của kit — máy sinh, commit cùng chữ ký
    - "LO-TRINH.html"
    - "docs/tri-thuc/**"
  t3_paths:
    - "PRODUCT-INVARIANTS.md"        # product invariants; only the owner edits this file
    - "db/**"                        # suy từ: bất biến 1 — chỗ đặt migration khi chuyển mã
    - "src/modules/identity/**"      # suy từ: modules.yaml — đăng nhập, cửa truy vấn theo sàn
    - "src/modules/agreements/**"    # suy từ: bất biến 2 — trần lớp dữ liệu, thoả thuận
    - "src/modules/sharing/**"       # suy từ: bất biến 4 — luật ẩn, trang khách
    - "src/modules/imports/ai/**"    # suy từ: blueprint — che số chủ nhà trước khi gửi mô hình
    - "ontology/**"                  # suy từ: governance/autonomy.yaml mức high
    - "architecture/modules.yaml"    # suy từ: AGENTS.md — đổi ranh giới là quyết định thiết kế
    - "governance/**"                # suy từ: autonomy.yaml
    - "tools/**"                     # suy từ: autonomy.yaml — gồm rào ranh giới
    - "mk/**"
    - "Makefile"
    - ".claude/settings.json"        # suy từ: Quỹ hàng — quyền cấm của agent
    - ".claude/hooks/**"
    - ".pre-commit-config.yaml"      # suy từ: autonomy.yaml — quét bí mật
    - ".gitleaks.toml"
    - ".github/workflows/deploy.yml" # suy từ: Quỹ hàng — đường ra bản thật
    - ".github/workflows/release.yml"
signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]           # suy từ: git config user.name
design:
  surface_globs:
    - "src/app/**"
    - "src/components/candidate/**"
    - "src/components/templates/**"
    - "src/modules/*/ui/**"
design_floor:
  tokens: design/tokens.json                   # written from the stylesheet by make design-tokens
  registry: design/component-registry.json     # written from the source by make gen
  sinh_lai:
    - "make gen"                     # S3 regenerates derived files inside the round
design_pass:
  proto_route: http://127.0.0.1:3470/proto/{slug}
  ds_skill: inventory-ui
  dev_cmd: "npm run dev"
feature_loop:
  ui_standards_skill: inventory-ui
  ngoai_n_tu_dinh_tuyen: true   # same as onehub-quy-hang: the machine routes out-of-contract items on clean T2 records
  suite_keys:
    - executors.script.check
    - executors.script.build
    - executors.script.e2e
dev_server:
  start: "npm run dev"
  url: "http://127.0.0.1:3470"
capture:
  ui: "npx playwright screenshot"   # <url> <out.png>, for the Gate 2 slideshow
dieu_phoi:
  goi_dot: docs/plan/dot-{ten}   # batch package; open with /dieu-phoi:mo-dot <name>
tri_thuc:
  noi: docs/tri-thuc   # in this repo; public since 2026-11-10 and the owner chose to keep raw sources here
lo_trinh:
  tep: docs/plan/lo-trinh.json
