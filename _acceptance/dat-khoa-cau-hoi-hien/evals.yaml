schema_version: 1
feature_slug: dat-khoa-cau-hoi-hien
# Kế hoạch đo, viết trước khi chấm. E1–E3 và E4b cùng một lệnh (rang/kiem.mjs): chạy `make dat-khoa ENV=staging` trên
# terminal thật của hệ điều hành (rang/pty.py) với gh giả đứng đầu PATH, dựng lại màn lúc kết thúc (rang/man-hinh.mjs);
# mỗi eval đọc dòng `ok <ca>` của AC mình. E1t chạy cùng tệp ở `--tu-kiem`: vật lành xanh, bốn bản phá của mã đỏ đúng
# thông điệp ghim — chiều đỏ của E1–E3. Đỏ của mỗi ca in `DO <ca>: <thông điệp ghim>` và lệnh thoát 1.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/kiem.mjs
    layer: backend-effect
    paths: ["tools/deploy/dat-khoa.mjs", "mk/deploy.mk", "_acceptance/dat-khoa-cau-hoi-hien/rang/**"]
    expected: >-
      exit 0; in «ok tty-that — make dat-khoa trên terminal thật: 5/5 câu hỏi còn trên màn, mỗi câu một dòng; khoá nhận
      đúng, chữ đã dán không hiện (…)», «ok tty-doi-co — terminal 80 cột, đổi cỡ xuống 60 cột giữa lúc dán chuỗi pooler:
      5/5 câu hỏi vẫn còn trên màn, khoá nhận đúng» và dòng cuối «kiem: 5/5 ca đạt (…)». Chiều đỏ: câu hỏi bị xoá hay không
      đứng nguyên một dòng → «câu hỏi không còn trên màn: <tên>» (bản phá pha-thu-tu-cu, pha-thu-tu-cu-doi-co của E1t);
      câu hỏi lệch thứ tự → «câu hỏi sai thứ tự: <tên>» (pha-sai-thu-tu); đổi cỡ không làm readline vẽ lại → «đổi cỡ không
      làm readline vẽ lại dòng nhập — ca không đo gì» (pha-khong-doi-co); byte có chuỗi điều khiển mô hình màn không biết →
      «kiem: không chạy được — <ca>: màn dựng lại gặp chuỗi điều khiển lạ: …» (exit 2; pha-chuoi-la); câu hỏi của phép
      đo không còn trong mã → «kiem: không chạy được — câu hỏi của phép đo không có trong mã: <tên>» (exit 2).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/kiem.mjs
    layer: backend-effect
    paths: ["tools/deploy/dat-khoa.mjs", "mk/deploy.mk", "_acceptance/dat-khoa-cau-hoi-hien/rang/**"]
    expected: >-
      exit 0; cùng dòng «ok tty-that — …» của E1 (ca ấy đỏ nếu có một trong các lỗi dưới) và «ok gh-gia — gh trên PATH là
      bản giả của phép đo; không lệnh nào chạm GitHub». Mật khẩu thử mang @ và # nên gh giả chỉ nhận đúng
      khi chuỗi pooler được mã hoá. Chiều đỏ: «chữ đã dán hiện ra màn: <tên>» (bản phá pha-hien-chu), «khoá nhận sai:
      <tên>» (pha-nhan-sai; pha-bo-ma-hoa đỏ «khoá nhận sai: MIGRATE_DATABASE_URL»), «khoá sinh sai: <tên>» (pha-sinh-sai
      đỏ «khoá sinh sai: AUTH_SECRET»), «lệnh không xong: exit <n>», «lệnh treo: trả
      lời <k>/5 câu»; gh trên PATH không phải bản giả → «kiem: không chạy được — gh trên PATH không phải bản giả …» (exit 2,
      trước khi chạy lệnh nào).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/kiem.mjs
    layer: backend-effect
    paths: ["tools/deploy/dat-khoa.mjs", "mk/deploy.mk", "_acceptance/dat-khoa-cau-hoi-hien/rang/**"]
    expected: >-
      exit 0; in «ok khong-tty — ống dẫn: 5 câu hỏi, đọc từng dòng, khoá nhận đúng». Chiều đỏ: «DO khong-tty: ống dẫn
      không hỏi: <tên>», «câu hỏi ra luồng ra: <tên>» (bản phá pha-hoi-ra-luong-ra), «khoá nhận sai: <tên>» — bản phá pha-thieu-dong của E1t (bỏ dòng đầu, mọi câu trả lời lệch một
      câu) đỏ «khoá nhận sai: VERCEL_TOKEN».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1t
    criterion: AC-1
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/kiem.mjs --tu-kiem
    layer: backend-effect
    paths: ["tools/deploy/dat-khoa.mjs", "mk/deploy.mk", "_acceptance/dat-khoa-cau-hoi-hien/rang/**"]
    expected: >-
      exit 0, dòng cuối «tu-kiem: 12/12 ca đúng (…)»: «ok vat-lanh — vật lành xanh» và mười một dòng «ok <bản phá> — đỏ
      đúng: <thông điệp>»: pha-sai-thu-tu (câu hỏi sai thứ tự: MIGRATE_DATABASE_URL — màn lành vừa đọc, đổi chỗ hai câu),
      pha-thu-tu-cu (câu hỏi không còn trên màn: VERCEL_TOKEN), pha-hien-chu (chữ đã dán hiện ra màn: VERCEL_TOKEN),
      pha-nhan-sai (khoá nhận sai: VERCEL_TOKEN), pha-bo-ma-hoa (khoá nhận sai: MIGRATE_DATABASE_URL), pha-sinh-sai (khoá
      sinh sai: AUTH_SECRET), pha-khong-doi-co (đổi cỡ không làm readline vẽ lại dòng nhập — ca không đo gì),
      pha-thu-tu-cu-doi-co (câu hỏi không còn trên màn: VERCEL_TOKEN), pha-thieu-dong (khoá nhận sai: VERCEL_TOKEN),
      pha-hoi-ra-luong-ra (câu hỏi ra luồng ra: VERCEL_TOKEN), pha-chuoi-la (màn dựng lại gặp chuỗi điều khiển lạ).
      Mỗi bản phá của mã là bản sao mã của PR đổi đúng một chỗ trong thư mục lượt đo; chỗ cần đổi không còn trong mã → «kiem: không
      chạy được — bản phá <ca> không áp được» (exit 2). Một bản phá không đỏ đúng thông điệp → «DO <ca>: …» và exit 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/bai-kiem.mjs
    layer: backend-effect
    paths: ["tools/deploy/dat-khoa.mjs", "tools/deploy/dat-khoa-ask.test.ts", "_acceptance/dat-khoa-cau-hoi-hien/rang/bai-kiem.mjs"]
    expected: >-
      exit 0, dòng cuối «bai-kiem: 2/2 ca đúng (…)»: «ok lanh — bài kiểm xanh trên mã của PR (1/1)» và «ok thu-tu-cu —
      thứ tự cũ làm đỏ bài kiểm: to contain 'VERCEL_TOKEN (dán rồi Enter): \n'». Chiều đỏ: bài kiểm không đỏ với thứ tự cũ,
      hay đỏ ở chỗ khác → «DO thu-tu-cu: thứ tự cũ không làm đỏ bài kiểm đúng chỗ (…)»; bài kiểm đỏ trên mã của PR → «DO
      lanh: …»; thứ tự mới không còn trong mã → «bai-kiem: không chạy được …» (exit 2).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4b
    criterion: AC-4
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/kiem.mjs
    layer: backend-effect
    paths: ["tools/deploy/dat-khoa.mjs", "_acceptance/dat-khoa-cau-hoi-hien/rang/**"]
    expected: >-
      exit 0; in «ok ban-cu-mat-cau-hoi — bản trước PR (<điểm rẽ>) trên cùng terminal: 5/5 câu hỏi bị xoá khỏi màn».
      Chiều đỏ: bản ở điểm rẽ không mất đủ năm câu → «DO ban-cu-mat-cau-hoi: bản trước PR không mất câu hỏi như lúc hỏng
      (mất <k>/5)».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/pham-vi.mjs
    layer: backend-effect
    expected: >-
      exit 0, in «pham-vi ok: <n> tệp so với <điểm rẽ>; ngoài hồ sơ chỉ dat-khoa.mjs, bài kiểm mới và một dòng nhật ký; mọi
      dòng đổi của dat-khoa.mjs nằm trong hàm hỏi (dòng <a>–<b>)». Chiều đỏ (ca của E5t, trên chính đầu ra git thật đã phá
      một chỗ): «PR chạm tệp ngoài phạm vi: <tệp>», «PR thiếu tệp của thiết kế: <tệp>», «dat-khoa.mjs đổi ngoài hàm hỏi:
      dòng <a>–<b>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5t
    criterion: AC-5
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/pham-vi.mjs --tu-kiem
    layer: backend-effect
    expected: >-
      exit 0, dòng cuối «tu-kiem: 4/4 ca đúng»: vật lành xanh, ba bản phá trên đầu ra git thật đỏ đúng ba thông điệp ghim
      của E5 — PR đổi một tệp ngoài danh sách cho phép thì KHÔNG qua (pha-tep-ngoai: «PR chạm tệp ngoài phạm vi:
      mk/deploy.mk»), thiếu bài kiểm mới thì KHÔNG qua (pha-thieu-bai-kiem: «PR thiếu tệp của thiết kế:
      tools/deploy/dat-khoa-ask.test.ts»), một dòng đổi ngoài hàm hỏi thì KHÔNG qua (pha-doi-ngoai-ham: «dat-khoa.mjs đổi
      ngoài hàm hỏi: dòng 20–20»).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: bash _acceptance/dat-khoa-cau-hoi-hien/rang/bai-deploy.sh
    layer: backend-effect
    paths: ["tools/deploy/**"]
    expected: >-
      exit 0, dòng cuối «bai-deploy: tools/deploy xanh, có ca dat-khoa-ask»: mọi bài kiểm của tools/deploy/ pass (bốn tệp)
      và báo cáo có ca «in câu hỏi trên dòng riêng …» của dat-khoa-ask.test.ts. Chiều đỏ: vitest đỏ → mã thoát của nó; ca
      mới không có trong báo cáo → «bai-deploy: báo cáo không có ca của dat-khoa-ask.test.ts» (exit 1). Chiều đỏ của chính
      ca mới do E4 chứng.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6b
    criterion: AC-6
    executor: script
    cmd: config:executors.script.check
    layer: backend-effect
    expected: "exit 0: make check xanh."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6c
    criterion: AC-6
    executor: script
    cmd: config:executors.script.build
    layer: backend-effect
    expected: "exit 0: npm run build xanh."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6d
    criterion: AC-6
    executor: script
    cmd: config:executors.script.e2e
    layer: backend-effect
    expected: "exit 0: make e2e xanh ở bốn khổ màn."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/ci.mjs
    layer: backend-effect
    paths: ["_acceptance/dat-khoa-cau-hoi-hien/rang/ci.mjs"]
    expected: >-
      exit 0, in «ci ok: đầu nhánh <sha> quick, e2e, e2e-db xanh (gate: <trạng thái>)» — đọc bằng gh, chỉ đọc. Chiều đỏ
      (ca của E7t): «ci: <việc> trên đầu nhánh <sha> không xanh (<kết>)», «ci: <việc> trên đầu nhánh <sha> chưa xong
      (<trạng thái>)», «ci: thiếu việc <việc> trên đầu nhánh <sha>».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7t
    criterion: AC-7
    executor: script
    cmd: node _acceptance/dat-khoa-cau-hoi-hien/rang/ci.mjs --tu-kiem
    layer: backend-effect
    paths: ["_acceptance/dat-khoa-cau-hoi-hien/rang/ci.mjs"]
    expected: >-
      exit 0, dòng cuối «tu-kiem: 4/4 ca đúng»: dữ liệu CI thật vừa đọc xanh; ba bản phá trên chính dữ liệu ấy (e2e-db đỏ,
      e2e chưa xong, thiếu quick) đỏ đúng ba thông điệp ghim của E7. Dữ liệu thật chưa xanh → «tu-kiem: không chạy được —
      dữ liệu CI thật chưa xanh: …», exit 1.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
