<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lần chạy lại 0.36.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng · Hỏi-2 · AC-3, AC-6</p>
    <h1>Khi 0.36.1 cài: chạy lại upgrade, ghim số của nó, không duyệt lại</h1>

    <svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ Arrows (drawn first, behind nodes) ============ -->
      <line x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="168" x2="500" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="676" y1="268" x2="744" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="340" x2="500" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="436" x2="500" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420 520 V536 A8 8 0 0 1 412 544 H308 A8 8 0 0 0 300 552 V576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M580 520 V536 A8 8 0 0 0 588 544 H692 A8 8 0 0 1 700 552 V576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M300 632 V652 A8 8 0 0 0 308 660 H496" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M700 632 V652 A8 8 0 0 1 692 660 H504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="500" y1="664" x2="500" y2="696" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ Arrow labels (masked, 8px gap from line) ============ -->
      <rect x="696" y="244" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="712" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="508" y="352" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="532" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <!-- ============ Nodes ============ -->
      <rect x="320" y="40" width="360" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="320" y="40" width="360" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phiên design-assembly báo 0.36.1 đã cài</text>

      <rect x="380" y="120" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xem trước upgrade trên nhánh</text>

      <polygon points="500,196 676,268 500,340 324,268" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="244" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xem trước đổi gì</text>
      <text x="500" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ngoài thư mục công cụ,</text>
      <text x="500" y="272" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dấu hay bước cổng,</text>
      <text x="500" y="286" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hoặc một quyết định</text>
      <text x="500" y="300" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đổi trạng thái</text>

      <rect x="744" y="244" width="200" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="744" y="244" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="844" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dừng, trình chủ kho</text>

      <rect x="300" y="380" width="400" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chạy upgrade, một commit</text>
      <text x="500" y="420" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">chỉ đổi thư mục công cụ, dấu phiên bản và bước cổng</text>

      <rect x="300" y="464" width="400" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ma trận ghim mã cây, bước cổng</text>
      <text x="500" y="504" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">và danh sách tệp của 0.36.1, một dòng sổ fix</text>

      <rect x="160" y="576" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="600" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chưa chấm:</text>
      <text x="300" y="616" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">lượt chấm đầu đo trên 0.36.1</text>

      <rect x="560" y="576" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="600" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã chấm:</text>
      <text x="700" y="616" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">lượt chấm mới đo lại mọi tiêu chí</text>

      <circle cx="500" cy="660" r="4" fill="#2d3142"/>

      <rect x="280" y="696" width="440" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="280" y="696" width="440" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="500" y="720" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Bằng chứng:</text>
      <text x="500" y="736" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">chủ kho thấy mã 0.36.1, CodeQL hết cảnh báo</text>

      <!-- ============ Legend ============ -->
      <line x1="40" y1="780" x2="960" y2="780" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH NÓI LOẠI</text>
      <rect x="40" y="808" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="818" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>
      <rect x="216" y="808" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="248" y="818" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>
      <polygon points="320,814 332,808 344,814 332,820" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="352" y="818" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>
      <circle cx="444" cy="814" r="4" fill="#2d3142"/>
      <text x="456" y="818" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hai nhánh gặp lại</text>
      <rect x="584" y="808" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="616" y="818" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Cổng chủ kho duyệt</text>
    </svg>
  </div>
</body>
</html>
