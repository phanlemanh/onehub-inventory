schema_version: 1
feature_slug: lui-ban-luc-xoay-mat-khau
# Kế hoạch đo, viết trước khi viết mã.
#
# Tệp kiểm: tests/so-tay-lui-ban.test.ts. Mỗi describe mang tiền tố mã eval («E2 · …»); rang/chay.sh <mã> chạy đúng các
# ca của mã ấy. Bốn hàm thuần, mỗi hàm nhận { tệp → nội dung } (và mã nguồn rollBack khi cần) và trả danh sách lỗi:
#   motCho(files)            — đúng một tiêu đề «## Lùi bản sau khi xoay mật khẩu vai đăng nhập», ở xoay-khoa.md
#   duDong(files, lenBan, luiBan) — mục kể mọi tên bước của STEPS, mọi dòng lùi bản của rollBack, dòng kiem-nhanh-ten-mien ĐỎ
#   troToi(files)            — mọi đoạn lùi bản / nhắc xoay mật khẩu vai đăng nhập ngoài mục mang câu trỏ (luật riêng sổ lùi bản)
#   khongKeLai(files)        — ngoài mục không đoạn nào chứa «mật khẩu cũ»
# Đối chứng dương: nội dung thật của docs/van-hanh/*.md và mã thật → mỗi hàm trả [].
# Chiều đỏ, trên bản sao trong bộ nhớ của CHÍNH nội dung thật (cùng fixture), mỗi ca ghim nguyên thông điệp:
#   bỏ câu trỏ ở bước 6 sổ đưa bản lên          → troToi: «dua-ban-len.md: đoạn nói về lùi bản không trỏ mục «…»: "<đầu đoạn>"»
#   bỏ câu trỏ ở đoạn mở đầu sổ lùi bản          → troToi: «lui-ban.md: đoạn mở đầu không trỏ mục «…»»
#   thêm tệp moi.md có một câu lùi bản không trỏ → troToi: «moi.md: đoạn nói về lùi bản không trỏ mục «…»: …»
#   thêm câu «bản cũ giữ mật khẩu cũ» vào sổ lùi bản → khongKeLai: «lui-ban.md: đoạn kể lại lý do ngoài mục: …»
#   bỏ dòng «lùi bản DỪNG — không đọc được mã bản mới» khỏi mục → duDong: «mục «…» thiếu dòng của lệnh: lùi bản DỪNG — không đọc được mã bản mới»
#   thêm một dòng say("lùi bản ĐỎ — dòng thử") vào bản sao rollBack → duDong: «… thiếu dòng của lệnh: lùi bản ĐỎ — dòng thử»
#   chép tiêu đề mục sang dua-ban-len.md         → motCho: «mục «…» phải có đúng một chỗ, ở xoay-khoa.md: thấy 2 (xoay-khoa.md, dua-ban-len.md)»
# Dòng lùi bản rút từ mã nguồn rollBack (chuỗi trong say(…)/stop(…)), cắt ở «${», «(» hay «,» đầu tiên. Ma trận viết
# trước — ca «E2 · đọc được mã» ghim đúng chín chuỗi, phân biệt, theo thứ tự trong mã:
#   lùi bản ĐỎ — không đọc được danh sách bản của Vercel
#   lùi bản DỪNG — không đọc được bản tên miền trỏ tới trước khi gắn
#   lùi bản DỪNG — không đọc được mã bản mới
#   lùi bản DỪNG — trước khi gắn
#   lùi bản ĐỎ — vercel rollback lỗi
#   lùi bản ĐỎ — tên miền chưa về bản
#   lùi bản ĐỎ — tên miền đã về bản
#   đã lùi về bản trước
#   kiem-nhanh-ten-mien ĐỎ                       (lui-ban.mjs)
# duDong chỉ tính các hàng bảng của mục (không phần Luật); tên bước khớp nguyên tên trong backtick.
# Văn bản chuẩn NFC trước khi so.
evals:
  - id: E1
    criterion: AC-1
    executor: judgment
    inputs: ["docs/van-hanh/xoay-khoa.md", "tools/deploy/len-ban.mjs", "tools/deploy/lui-ban.mjs", "tools/deploy/kiem-nhanh.mjs", "src/modules/identity/health.ts", "mk/deploy.mk", ".github/workflows/deploy.yml", "_acceptance/lui-ban-luc-xoay-mat-khau/contract.md"]
    question: >-
      Đọc mục «Lùi bản sau khi xoay mật khẩu vai đăng nhập» của xoay-khoa.md như người vận hành vừa xoay mật khẩu vai đăng
      nhập, với contract.md (AC-1) làm ý định và bốn tệp mã làm sự thật.
      (1) Mục có nói luật theo bản dựng — mỗi bản giữ mật khẩu của lúc dựng; từ khi một lượt in «vai-dang-nhap đạt» với mật
      khẩu mới, mọi bản dựng trước lượt ấy không nối được nữa, mãi chứ không riêng mấy phút của lượt — và điều ấy có khớp
      mã không (bước bien ghi DATABASE_URL trước bước dung; vai-dang-nhap đặt mật khẩu vào cơ sở dữ liệu)?
      (2) Có nói lùi về bản như thế bằng cả ba đường (lệnh tự lùi, make rollback, Instant Rollback) không khôi phục kết nối,
      và chỉ bản dựng ở bước dung của lượt xoay hay lượt sau nối được?
      (3) Có nói phải lùi thì chọn bản nào (bản tạo sau lượt xoay, đọc giờ tạo trong danh sách make rollback in ra), và không
      có bản như thế thì không lùi, sửa và đưa bản sửa lên? Danh sách make rollback trong mã có thật in giờ tạo không?
      (4) Có nêu sức khoẻ «"vai":"dat"» là thước, và mã kiểm nhanh có thật đòi vai đạt qua vai đăng nhập không?
      (5) Mục chỉ người vận hành tới chỗ tìm giờ lượt xoay (tab Actions › Deploy, lệnh make dat-khoa … XOAY=1): các chỗ ấy có
      thật trong mk/deploy.mk và .github/workflows/deploy.yml không?
      (6) Có câu nào trong mục nói sai điều mã làm? Trích câu làm bằng.
    evidence_required: [run_id, verifier, verified_at, verdict, rationale]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: bash _acceptance/lui-ban-luc-xoay-mat-khau/rang/chay.sh E2
    layer: backend-effect
    paths: ["docs/van-hanh/*.md", "tests/so-tay-lui-ban.test.ts", "tools/deploy/len-ban.mjs", "tools/deploy/lui-ban.mjs"]
    expected: >-
      exit 0. Ca «E2 · đọc được mã» pass: rollbackLines(len-ban.mjs, lui-ban.mjs) bằng đúng chín chuỗi của ma trận đầu tệp,
      phân biệt, theo thứ tự ấy; STEPS.staging ∪ STEPS.production có mười tên bước. Ca «E2 · một chỗ» và «E2 · đủ dòng»
      pass trên nội dung thật: motCho → [], duDong → [] (các hàng bảng của mục kể mọi tên bước, trong backtick, và mọi
      dòng rút được). Chiều đỏ, cùng nội dung: chép tiêu đề sang
      dua-ban-len.md → motCho trả đúng một thông điệp «mục «Lùi bản sau khi xoay mật khẩu vai đăng nhập» phải có đúng một
      chỗ, ở xoay-khoa.md: thấy 2 (xoay-khoa.md, dua-ban-len.md)»; bỏ dòng «lùi bản DỪNG — không đọc được mã bản mới» →
      duDong trả đúng «… thiếu dòng của lệnh: lùi bản DỪNG — không đọc được mã bản mới»; thêm say("lùi bản ĐỎ — dòng thử")
      vào bản sao rollBack → duDong trả đúng «… thiếu dòng của lệnh: lùi bản ĐỎ — dòng thử»; thay mọi «`kiem-nhanh`»
      (nguyên tên) trong bảng của mục bằng «kiểm nhanh», giữ «`kiem-nhanh-ten-mien`» → duDong trả đúng «mục «…» thiếu
      bước: kiem-nhanh»; dòng ấy chỉ còn ở phần Luật (chuyển «đã lùi về bản trước» ra khỏi bảng, sang một đoạn văn của mục)
      → duDong trả đúng «… thiếu dòng của lệnh: đã lùi về bản trước». Thêm từ lượt sửa 1 (ca «E2 · lý do kiểm nhanh»):
      tiền đề health.ts có «ok: vai === "dat"» và notOkReason(kiem-nhanh.mjs) = «sức khoẻ ok khác true»; rotationReason
      trên nội dung thật → []; thay «sức khoẻ ok khác true» bằng «vai nối chưa đạt» trong sổ xoay khoá → đúng hai thông
      điệp «mục «…» nêu lý do kiểm nhanh mà máy không in khi bản không nối được: vai nối chưa đạt» và «mục «…» thiếu lý do
      kiểm nhanh khi bản không nối được: sức khoẻ ok khác true».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: judgment
    inputs: ["docs/van-hanh/xoay-khoa.md", "tools/deploy/len-ban.mjs", "tools/deploy/lui-ban.mjs", "tools/deploy/kiem-nhanh.mjs", "src/modules/identity/health.ts", "_acceptance/lui-ban-luc-xoay-mat-khau/contract.md"]
    question: >-
      Đọc bảng dòng của lệnh trong mục «Lùi bản sau khi xoay mật khẩu vai đăng nhập» của xoay-khoa.md, với contract.md
      (AC-2) làm ý định và mã làm sự thật (rollBack và vòng bước của lenBan trong len-ban.mjs; lui-ban.mjs; kiemNhanh).
      Với mỗi hàng, «Bản đang chạy» và «Làm gì» có đúng với mã không:
      (1) «đã lùi về bản trước» — mã chỉ in sau khi tên miền về đúng bản trước và kiemNhanh bản ấy đạt (đòi vai «dat»); bảng
      có nói bản ấy nối được lúc kiểm, và không nói nó «không nối được»?
      (2) ba dòng «lùi bản DỪNG» — mã không lùi, tên miền ở bản mới dựng ở lượt này; bảng có nói không mất kết nối vì mật
      khẩu và không khuyên chọn bản trong danh sách in kèm?
      (3) bốn dòng «lùi bản ĐỎ» — hàng «tên miền đã về bản … nhưng kiểm nhanh đỏ» có nói mất kết nối; ba hàng còn lại có nói
      đúng là không chắc tên miền ở đâu?
      (4) bước đỏ sau vai-dang-nhap mà «DỪNG ở <bước> — tên miền không đổi»: có nói tên miền vẫn ở bản dựng trước lượt xoay,
      đã mất kết nối? Các bước được kể có đúng là các bước đứng sau vai-dang-nhap trong STEPS của từng môi trường?
      (5) đỏ ở bien hay trước, hay ở vai-dang-nhap: có tách lượt xoay đầu (mật khẩu chưa đổi) với lượt chạy lại sau một lượt
      đã in «vai-dang-nhap đạt» (bản đang chạy đã mất kết nối từ lượt trước)?
      (6) dòng «rollback <ENV>: kiem-nhanh-ten-mien ĐỎ» của make rollback: có nói bản cũ hơn cũng vậy?
      Trích hàng làm bằng cho mỗi ý sai.
    evidence_required: [run_id, verifier, verified_at, verdict, rationale]
  - id: E4
    criterion: AC-3
    executor: test
    cmd: bash _acceptance/lui-ban-luc-xoay-mat-khau/rang/chay.sh E4
    layer: backend-effect
    paths: ["docs/van-hanh/*.md", "tests/so-tay-lui-ban.test.ts"]
    expected: >-
      exit 0. Ca «E4 · nội dung thật» pass: troToi trên mọi docs/van-hanh/*.md → []; và ca «E4 · phủ đủ chỗ» pass: tập đoạn
      troToi xét chứa đủ hai mươi ba chỗ (từ lượt sửa 1 thêm: lui-ban.md bước 1 «Đỏ thì», bước 3 «Đạt khi», bước 6 «Đỏ thì»,
      hàng «DỪNG — chưa nêu bản», hàng «DỪNG — tên miền đã ở bản»; dua-ban-len.md hai hàng vai-dang-nhap; xoay-khoa.md bước 4
      «Đỏ thì») — mười lăm chỗ đầu là — dua-ban-len.md: «Đỏ thì» bước 3, 5, 6, đoạn mở đầu «Đỏ thì làm gì», hàng
      gan-ten-mien; lui-ban.md: đoạn mở đầu, «Khi nào dùng», «Đỏ thì» bước 4 và 5, hàng «kiem-nhanh-ten-mien ĐỎ», hàng
      «Lệnh không chạy được ở máy nào» (Instant Rollback); xoay-khoa.md: «Đỏ thì» bước 3, «Đỏ thì làm gì» dòng hai;
      README.md: hàng make rollback và «Đỏ thì» việc 13 (thước không xanh vì bỏ sót chỗ). Chiều đỏ, cùng nội dung: bỏ câu trỏ ở
      «Đỏ thì» bước 6 của dua-ban-len.md → đúng một thông điệp bắt đầu «dua-ban-len.md: đoạn nói về lùi bản không trỏ mục
      «Lùi bản sau khi xoay mật khẩu vai đăng nhập»: "- **Đỏ thì:**»; bỏ câu trỏ ở đoạn mở đầu lui-ban.md → đúng «lui-ban.md:
      đoạn mở đầu không trỏ mục «Lùi bản sau khi xoay mật khẩu vai đăng nhập»»; thêm moi.md với «Lỗi thì lùi bản ngay.» →
      đúng một thông điệp bắt đầu «moi.md: đoạn nói về lùi bản không trỏ mục»; bỏ câu trỏ ở hàng Instant Rollback của
      lui-ban.md → đúng một thông điệp «lui-ban.md: đoạn nói về lùi bản không trỏ mục «…»: "| Lệnh không chạy được ở máy
      nào …"» (60 ký tự đầu của hàng); từ lượt sửa 1: bỏ câu trỏ ở bước 3 lui-ban.md → đúng «lui-ban.md: bước «3. …» nói
      về lùi bản mà không trỏ mục «…»» (sổ lùi bản xét theo bước); bỏ câu trỏ ở hàng vai-dang-nhap thứ nhất của
      dua-ban-len.md → đúng một thông điệp «dua-ban-len.md: đoạn nói bản đang chạy yên không trỏ mục «…»: …».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-4
    executor: test
    cmd: bash _acceptance/lui-ban-luc-xoay-mat-khau/rang/chay.sh E5
    layer: backend-effect
    paths: ["docs/van-hanh/*.md", "tests/so-tay-lui-ban.test.ts"]
    expected: >-
      exit 0. Ca «E5 · nội dung thật» pass: khongKeLai → [] và phần nhắc-xoay của troToi → [] trên mọi docs/van-hanh/*.md;
      đối chứng dương: mục mới (bên trong) có chứa «mật khẩu cũ» — luật không xanh vì chữ ấy biến mất khỏi cả thư mục.
      Chiều đỏ, cùng nội dung: thêm «Lùi không cứu được: bản cũ giữ mật khẩu cũ.» vào «Khi nào dùng» của lui-ban.md → đúng
      một thông điệp bắt đầu «lui-ban.md: đoạn kể lại lý do ngoài mục: »; thêm «Vừa xoay mật khẩu vai đăng nhập thì chờ.»
      vào bước 5 của dua-ban-len.md (không câu trỏ) → đúng một thông điệp bắt đầu «dua-ban-len.md: đoạn nhắc xoay mật khẩu
      vai đăng nhập không trỏ mục».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-5
    executor: judgment
    inputs: ["docs/van-hanh/dua-ban-len.md", "docs/van-hanh/lui-ban.md", "docs/van-hanh/xoay-khoa.md", "docs/van-hanh/README.md", "tools/deploy/len-ban.mjs", "_acceptance/lui-ban-luc-xoay-mat-khau/contract.md"]
    question: >-
      Đọc bốn sổ như người vận hành, với contract.md (AC-5) làm ý định.
      (1) Mỗi câu trỏ tới mục «Lùi bản sau khi xoay mật khẩu vai đăng nhập» có là một vế ngắn nói khi nào phải đọc mục, không
      lặp lý do, và câu quanh nó vẫn đọc trôi không? Trích câu vụng nếu có.
      (2) Ngoài mục ấy, còn câu nào ngụ ý bản đang chạy yên, hay khuyên lùi về bản cũ, lúc vừa xoay mật khẩu vai đăng nhập
      mà không trỏ tới mục? Xét kỹ bước 3, 5, 6 và «Đỏ thì làm gì» của dua-ban-len.md, mọi bước của lui-ban.md, bước 3 và
      «Đỏ thì làm gì» của xoay-khoa.md, việc 13 của README.md.
      (3) Các dòng «Đạt khi» của bước 2 và bước 5 sổ đưa bản lên có kể đủ các bước theo đúng thứ tự STEPS trong len-ban.mjs
      không (ca kiểm thường trực của hàng trước cũng giữ điều này); mọi hàng bien và vai-dang-nhap còn dặn không bấm dựng
      lại trên Vercel trước khi lệnh chạy xanh không?
      (4) Có câu nào bảo in, dán hay gửi giá trị của khoá không?
    evidence_required: [run_id, verifier, verified_at, verdict, rationale]
  - id: E7
    criterion: AC-6
    executor: script
    cmd: config:executors.script.check
    layer: backend-effect
    expected: exit 0.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
