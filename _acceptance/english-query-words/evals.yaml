schema_version: 1
feature_slug: english-query-words
# Ma trận viết trước:
#   AC-7 (E1): 9 từ cũ (ma, toa, du-an, ho-so, vung, goc-nhin, vai, mau, quyen) x 11 ngữ cảnh đọc/ghi truy vấn (?w= · &w= ·
#     query.w · query["w"] · get("w") · getAll("w") · set("w" · has("w") · delete("w") · hằng ...PARAM = "w" · khoá "w": của
#     object dựng địa chỉ hay của SEARCH_PARAM) trên 5 vùng (src/, tests/, tools/deploy/, tools/e2e_templates/, design/).
#     Lệnh quét chữ, không đọc cú pháp: ô query.du-an cấy nguyên chữ. In «quet: 9 tu x 11 ngu canh x 5 vung · cham: 0 · giu: <n>».
#     Tự thử: 99 ô (một bản sao mỗi ô, xoay qua 5 vùng) + 1 ca lệch giu.txt = 100 tên ca.
#   AC-4 (E2): 6 từ liên kết x 3 ca (chỉ cũ → chuyển sang mới · cũ và mới cùng có → mới thắng · không từ cũ → không chuyển)
#     = 18 assert, cộng 2 ca chung (?vung= lặp lại giữ đủ giá trị và thứ tự · tham số khác giữ nguyên) và 2 ca công tắc dev
#     của Bảng hàng (?vai=, ?mau=bien không được dịch) = 22 assert, mỗi assert một tên ca. ?quyen= của /proto đo ở E11.
#   AC-3 (E3): 6 chỗ ghi địa chỉ (searchHref ba loại, liên kết cây địa lý, savedViewHref, useRecordAddress mở/đóng, chuyển hướng
#     tìm-được-một-căn, liên kết trong tin hỏi đầu chủ) — mỗi chỗ so địa chỉ viết trước.
# Cặp phá thử (bản sao; ca tương ứng phải đỏ với thông điệp ghim):
#   pha-thu-chu-cu (cấy từng từ cũ vào một tệp của từng vùng ở bản sao)   → «chu-cu: <từ> <tệp>»
#   pha-thu-bang-dich (bỏ một dòng khỏi bảng dịch ở bản sao)              → «dich: ho-so khong chuyen»
#   pha-thu-dev-dich (thêm vai vào bảng dịch ở bản sao)                   → «dich: vai khong duoc dich»
evals:
  - id: E1
    criterion: AC-7
    executor: script
    cmd: node _acceptance/english-query-words/rang/query-words.mjs --root .
    paths: [src/**, tests/**, tools/deploy/**, tools/e2e_templates/**, design/**]
    expected: "exit 0; in «quet: 9 tu x 11 ngu canh x 5 vung · cham: 0 · giu: <n>» với n bằng số dòng giữ đã ghim trong lệnh (giu.txt khác danh sách ghim → đỏ «giu: lech danh sach ghim»). Chiều đỏ: E1-pha"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1-pha
    criterion: AC-7
    executor: script
    cmd: node _acceptance/english-query-words/rang/query-words.mjs --root . --self-test
    paths: [_acceptance/english-query-words/rang/**]
    expected: "exit 0; lệnh dựng một bản sao cho mỗi ô từ × ngữ cảnh (99 ô), cấy đúng ô ấy vào một tệp, các bản sao xoay qua đủ năm vùng; mỗi bản sao phải đỏ với «chu-cu: <từ> <ngữ cảnh>» đúng ô đã cấy; thêm một bản sao có thêm một dòng vào giu.txt phải đỏ «giu: lech danh sach ghim»; in «self-test: 100/100 do dung cho», mỗi ô một tên ca. Đối chứng dương: cây thật xanh trong cùng lượt"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-4
    executor: test
    cmd: bash _acceptance/english-query-words/rang/chay.sh E2
    paths: [src/modules/listings/ui/**, src/app/(app)/inventory/**, tests/old-query-words.test.ts]
    expected: "exit 0; ca 'dich' đủ 22 assert viết trước (ma.toa.du-an.ho-so.vung.goc-nhin x chỉ-cũ/cả-hai/không-cũ; vung lặp lại; tham số khác giữ; vai, mau không dịch); ca 'trang-chuyen' vẽ trang Bảng hàng với ?ho-so=r1&status=Active và thấy chuyển hướng tới /inventory?status=Active&record=r1 (đối chứng: ?record=r1 không chuyển); ca 'dang-nhap-next' chưa đăng nhập với ?goc-nhin=v1 về /login?next= mang %3Fview%3Dv1. Chiều đỏ: pha-thu-bang-dich đỏ «dich: ho-so khong chuyen»; pha-thu-dev-dich đỏ «dich: vai khong duoc dich»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: bash _acceptance/english-query-words/rang/chay.sh E3
    paths: [src/modules/listings/**, src/components/candidate/record-panel.tsx, src/app/(app)/inventory/**, tests/**]
    expected: "exit 0; ca 'ghi' so đủ 6 chỗ ghi với địa chỉ viết trước: searchHref → ?unit= · ?building= · ?subdivision=; liên kết cây địa lý → ?place=; savedViewHref → ?view=; useRecordAddress mở → ?record=<id>, đóng → không còn record; chuyển hướng tìm-được-một-căn → record; tin hỏi đầu chủ → /inventory?record=<id>. Thêm một chỗ ghi từ cũ thì E1 đỏ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-1
    executor: test
    cmd: bash _acceptance/english-query-words/rang/chay.sh E4
    paths: [src/modules/listings/ui/**, src/app/(app)/inventory/**, tests/inventory-page.test.tsx, tests/unit-jump.test.tsx, tests/loi-vao-ho-so.test.tsx]
    expected: "exit 0; ca ô tìm của tests/unit-jump.test.tsx và tests/inventory-page.test.tsx xanh với ?unit=, ?building=, ?subdivision=; tìm ra một căn thì chuyển sang ?record=<id>; ca 'tu-cu-khong-loc' mở ?toa=S1.01 không qua bảng dịch (gọi thẳng hàm lọc) và không lọc gì; tests/loi-vao-ho-so.test.tsx xanh với ?record=<id> mở đúng ngăn hồ sơ của căn viết trước, và ?record=<id đã xoá> ra đúng câu báo liên kết cũ viết trước (đối chứng: id có thật không ra câu báo)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-2
    executor: script
    cmd: config:executors.script.dia_ly
    paths: [src/modules/listings/ui/geo-tree.ts, src/modules/listings/ui/use-geo-place.ts, tests/dia-ly.test.tsx]
    expected: "exit 0 — cây địa lý đọc và ghi ?place=; geo-tree.test.ts so liên kết cây với ?place= và xoá building, subdivision, view khi chọn nơi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-2
    executor: script
    cmd: config:executors.script.goc_nhin_e2e
    paths: [src/modules/listings/ui/**, src/app/(app)/inventory/**, tests/e2e-db/goc-nhin.spec.ts]
    expected: "exit 0 — lưu, mở, đổi tên, xoá góc nhìn trên Postgres dãy K, địa chỉ mở là ?view=<id>; ca góc nhìn đã xoá thấy câu báo như trước"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/english-query-words/rang/chay.sh E7
    paths: [db/migrations/**, src/modules/listings/saved-view.ts, src/modules/listings/ui/saved-view-api.ts, tests/old-query-words.test.ts]
    expected: "exit 0; lệnh quét in «luu-tru: 0 migration moi so voi nhanh chinh · saved_view.view: query,filters,sort,grouped,hidden»; ca 'khu-hoi-goc-nhin' đưa một lưới lọc theo nơi (Dự án và Toà), lọc trạng thái và chữ tìm qua bộ ghi thật storedView rồi bộ đọc gridView: vật lưu không có khoá hay giá trị nào thuộc chín từ cũ hoặc chín từ mới, filters khoá theo tên trường (Listing.buildingName, Listing.subdivisionName, Listing.standardStatus), và lưới mở lại bằng đúng vật ấy. Chiều đỏ: bản sao cho storedView ghi thêm place → đỏ «khu-hoi: tu truy van trong vat luu»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-5
    executor: script
    cmd: config:executors.script.the_dien_thoai_e2e
    paths: [src/modules/listings/ui/inventory-rows.ts, src/app/(app)/inventory/**, tests/e2e/the-dien-thoai.spec.ts]
    expected: "exit 0 — thẻ điện thoại với ?sample=edge và ?role=<Role> ở bốn khổ như trước; ca 'cong-tac-cu' mở ?mau=bien và ?vai=BuyerAgent và thấy trang như không có công tắc"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-5
    executor: script
    cmd: config:executors.script.ban_dung_that
    paths: [tools/deploy/thu-ban-dung.sh, src/app/(app)/**]
    expected: "exit 0 — bản build thật trên Postgres dãy K: ?role=, ?sample=, ?state= không đổi gì và /proto/hanh-vi-trong-luoi-khung?permission=denied trả trang không có; đối chứng dev: ít nhất một ?role= đổi được trang trên máy dev (dòng «doi-chung ?role=…»)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-8
    executor: script
    cmd: config:executors.script.check
    expected: "exit 0 — make check xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-8
    executor: script
    cmd: config:executors.script.e2e
    paths: [src/**, tests/e2e/**]
    expected: "exit 0 — make e2e xanh ở bốn khổ; behavior.spec.ts: ?permission=denied bỏ nút «Thêm dòng» (đối chứng dương), ca 'quyen-cu' mở ?quyen=khong và thấy nút «Thêm dòng» như không có công tắc"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-8
    executor: script
    cmd: config:executors.script.bang_hang_that_e2e
    paths: [src/app/(app)/inventory/**, src/modules/listings/**, tests/e2e-db/bang-hang-that.spec.ts]
    expected: "exit 0 — Bảng hàng thật khi đã đăng nhập, Postgres dãy R, mọi địa chỉ mang từ mới"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-8
    executor: script
    cmd: config:executors.script.dia_ly_e2e_db
    paths: [src/modules/listings/ui/**, tests/e2e-db/dia-ly.spec.ts]
    expected: "exit 0 — cây địa lý trong App Shell đã đăng nhập ở bốn khổ, Postgres dãy K, địa chỉ ?place="
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
    criterion: AC-8
    executor: script
    cmd: config:executors.script.hoi_dau_chu_e2e_db
    paths: [src/modules/listings/**, tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts]
    expected: "exit 0 — thanh hỏi đầu chủ và hộp báo sai, Postgres dãy V; tin chép ra mang /inventory?record=<id>"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-8
    executor: script
    cmd: node _acceptance/english-query-words/rang/query-words.mjs --root . --wiki
    paths: [wiki/entities/**, wiki/log/**, design/behaviors.md]
    expected: "exit 0; in «wiki: 0 trang thuc the tro tu cu · behaviors: 0 tu cu · nhat ky: 1 dong english-query-words»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E16
    criterion: AC-8
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/luoi.md", "src/app/(app)/inventory/**/*.tsx", "src/app/(app)/sent/**/*.tsx", "src/app/(app)/contacts/**/*.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm luoi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E17-ui
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    target: http://127.0.0.1:3485/inventory?ho-so=<id>&vung=<nơi>
    paths: [src/app/(app)/inventory/**, src/modules/listings/ui/**, src/components/candidate/record-panel.tsx]
    steps:
      - "From the repo root, with lane R Postgres up (DB_PORT 5565), run: URL_ANH=1 DB_LANE=r DB_PORT=5565 npx playwright test -c playwright.db.config.ts tests/e2e-db/bang-hang-that.spec.ts --project 1440 -g 'old link images' — it signs a list agent in, opens an old link /inventory?ho-so=<a listing id>&vung=<a place key>, and saves the frame below in .acceptance-runs/english-query-words/"
      - "Open old-link-1440.png and read the three lines printed under the frame in the test output: the old link that was opened, the unit code and place name the link points at, and the address the browser ended on"
    question: "Trong khung, ngăn hồ sơ căn có mở đúng căn có mã in ra dưới khung, cây địa lý có sáng đúng nơi in ra, và địa chỉ in ra có mang record= và place= thay cho ho-so= và vung=? Nêu điều nào lệch."
    expected: "Ngăn hồ sơ mở, nơi sáng, địa chỉ chỉ mang từ mới"
    evidence_required: [run_id, screenshot, observed, verdict]

  - id: E18
    criterion: AC-4
    executor: script
    layer: backend-effect
    cmd: config:executors.script.bang_hang_that_e2e
    paths: [src/app/(app)/inventory/**, src/modules/listings/**, src/components/templates/page-state.tsx, tests/e2e-db/bang-hang-that.spec.ts]
    expected: "exit 0 — ca 'lien-ket-cu' trên Postgres dãy R: chưa đăng nhập mở /inventory?ho-so=<id viết trước>&vung=<nơi viết trước>&goc-nhin=<id> thấy trang đăng nhập với next= chỉ mang record=, place=, view=; đăng nhập xong trình duyệt về thẳng địa chỉ mới, ngăn hồ sơ mở đúng căn viết trước, và danh sách phản hồi chuyển hướng ghi được có đúng một bước dịch (không vòng lặp). Đối chứng dương: liên kết từ mới không có bước dịch nào"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
