schema_version: 1
feature_slug: sua-thong-tin-can
# Ma trận viết trước:
#   AC-1: 4 vai × 3 lần chào (đang mở mới nhất, lần trước, đã đóng) = 12 ô «có nút / không nút», hằng 12 ghim; 4 vai × PATCH
#         details = 4 mã (200 ba vai, 403 Quản trị sàn), hằng 4 ghim.
#   AC-4: 5 kết cục (offline, 409, 401, 500, 403) × hộp = 5 câu ghim, hằng 5.
#   AC-6: lớp màn: 5 kiểu × bộ sửa đúng kiểu = 5 ô, hằng 5 (o-rieng-nam-kieu); lớp máy chủ: 5 kiểu × (giá trị đúng lưu,
#         giá trị sai kiểu bị từ chối) = 10 ô, hằng 10 (custom-nam-kieu); thêm trường đã ngừng, lựa chọn không có = 2 ca từ
#         chối; vai: Quản trị sàn ô không mở kèm đối chứng dương Đầu chủ mở được (o-rieng-quan-tri-khong-mo), PATCH
#         customField của Quản trị sàn 403 (custom-quan-tri-403).
#   AC-10: 2 loại sửa (bốn trường, trường riêng) × «Xác nhận lúc» theo Hỏi-1 = 2 ô, hằng 2 (details-mot-luat-xac-nhan).
#   AC-7: 7 trả lời (401, 403, 409, 404, 400, 500, thân hỏng) = 7 kết cục ghim, hằng 7; quét src/ tìm bảng mã thứ hai.
#   AC-9: 2 vật (hộp, ô riêng) × 2 nền = 4 lượt quét; 4 khổ.
# Bài và ca (tên ca là thông điệp ghim):
#   tests/sua-thong-tin-may-chu.test.ts: details-bon-truong · details-ngoai-tap-400 · details-qua-dai-400 ·
#     custom-nam-kieu · custom-sai-kieu-400 · custom-ngung-400 · custom-khong-lua-chon-400 · quan-tri-403 ·
#     custom-quan-tri-403 · details-mot-luat-xac-nhan · hop-409-ban-hien-tai
#   src/modules/listings/ui/http-save-door.test.ts: bay-tra-loi-tu-handler-that
#   src/lib/write-failure.test.ts: mot-bang-ma · nem-va-tra-cung-luat
#   tests/mot-luat-ghi.test.ts: khong-bang-ma-thu-hai
#   tests/sua-thong-tin-can.test.tsx: nut-sua-12-o · hop-luu-dem-lai · hop-khong-doi-khong-gui · hop-qua-dai · hop-nam-ket-cuc ·
#     hop-truong-cu-dai · hop-de-trong-la-xoa · hop-409-tai-ban-moi · o-rieng-nam-kieu · o-rieng-sai-kieu ·
#     o-rieng-quan-tri-khong-mo · dan-cot-rieng · du-thong-tin-cho-hang-15
#   tests/bang-hang-khong-du-quyen-doi-chung.test.tsx: doi-chung-co-vung-hang · doi-chung-co-ma-can (tệp mới: bài đã ký của hàng
#     10 giữ nguyên; cùng ba kiểm, lưới được cho chiều cao để vẽ dòng)
#   tests/e2e/sua-thong-tin-can.spec.ts (bốn khổ): sua-bon-truong · hoan-tac-bon-truong · o-rieng-theo-kieu · axe-sang-toi
#   tests/e2e-db/sua-thong-tin-can.spec.ts: tai-lai-con · quan-tri-khong-nut
# Cặp phá thử (bản sao; ca tương ứng phải đỏ với thông điệp ghim):
#   pha-thu-nut-khong-quyen (nút Sửa bỏ PermittedAction)          → «nut-sua-12-o: CompanyAdmin·đang mở»
#   pha-thu-bo-kiem-rieng (handler bỏ checkCustomValue)            → «custom-sai-kieu-400»
#   pha-thu-401-thanh-403 (luật đọc 401 như 403)                   → «mot-bang-ma: 401»
#   pha-thu-bang-ma-thu-hai (http-save-door so status riêng)        → «khong-bang-ma-thu-hai: http-save-door.ts»
#   pha-thu-dem-rieng (hồ sơ đếm thiếu bằng mảng riêng)             → «du-thong-tin-cho-hang-15»
#   pha-thu-bo-vung-hang (màn không đủ quyền vẫn vẽ vùng hàng)       → «khong-du-quyen-tren-man: vẫn có vùng hàng»
#   pha-thu-luoi-khong-cao (bỏ tallGridViewport ở bài đối chứng)     → «doi-chung-co-ma-can»
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.sua_thong_tin_unit
    paths: [src/modules/listings/**, tests/sua-thong-tin-can.test.tsx]
    expected: "exit 0; ca 'nut-sua-12-o' ghim 12 ô (ba vai sửa thấy nút ở lần chào đang mở; Quản trị sàn, lần trước, đã đóng không thấy). Chiều đỏ: pha-thu-nut-khong-quyen → «nut-sua-12-o: CompanyAdmin·đang mở»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

