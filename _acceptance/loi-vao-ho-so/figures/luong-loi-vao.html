<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng lối vào hồ sơ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Cổng Phạm vi · lối vào hồ sơ</p>
    <h1>Hai lối vào, cùng Bảng hàng như hôm nay</h1>

    <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (drawn first, behind nodes) ===== -->
      <!-- Ba lối vào → trang riêng (fan on left edge: 208 / 232 / 256) -->
      <path d="M216 104 H232 Q240 104 240 112 V200 Q240 208 248 208 H264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="216" y1="232" x2="264" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M216 360 H232 Q240 360 240 352 V264 Q240 256 248 256 H264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- trang riêng → tìm căn -->
      <line x1="488" y1="232" x2="528" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tìm căn → một căn → hồ sơ -->
      <path d="M576 184 V112 Q576 104 584 104 H688" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tìm căn → nhiều toà -->
      <line x1="624" y1="232" x2="688" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- tìm căn → không có -->
      <path d="M576 280 V352 Q576 360 584 360 H688" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- nhiều toà → bấm toà → hồ sơ -->
      <line x1="808" y1="196" x2="808" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- hồ sơ → đã chép -->
      <line x1="928" y1="104" x2="1000" y2="104" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- không có → về Bảng hàng -->
      <line x1="928" y1="360" x2="1000" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Edge labels (masked, 8px gap to the line) -->
      <rect x="604" y="82" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="636" y="93" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">một căn</text>
      <rect x="628" y="210" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="656" y="221" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nhiều toà</text>
      <rect x="604" y="338" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="636" y="349" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không có</text>
      <rect x="816" y="162" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="820" y="173" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bấm mã căn</text>

      <!-- ===== Nodes ===== -->
      <!-- E1: Mở toàn màn (entry, oval) -->
      <text x="216" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-1, 2</text>
      <rect x="40" y="72" width="176" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="40" y="72" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="128" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm mã căn</text>
      <text x="128" y="118" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trong Bảng hàng</text>

      <!-- E2: Gõ mã căn (entry, oval) -->
      <text x="216" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-5</text>
      <rect x="40" y="200" width="176" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="40" y="200" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="128" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Gõ mã căn»</text>
      <text x="128" y="246" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thanh trên · <tspan font-family="'Geist Mono', monospace" font-size="9">⌘K · /</tspan></text>

      <!-- E3: đường dẫn đồng nghiệp gửi (entry, oval) -->
      <text x="216" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-3</text>
      <rect x="40" y="328" width="176" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="40" y="328" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="128" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đường dẫn</text>
      <text x="128" y="374" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đồng nghiệp gửi</text>

      <!-- T: Trang riêng (focal, the one node all entries reach) -->
      <rect x="264" y="184" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="184" width="224" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="376" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng hàng</text>
      <text x="376" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/inventory?ho-so=&lt;id&gt;</text>
      <text x="376" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hoặc ?ma=&lt;mã&gt;</text>

      <!-- D: tìm căn (decision) -->
      <polygon points="576,184 624,232 576,280 528,232" fill="#f5f5f5"/>
      <polygon points="576,184 624,232 576,280 528,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="576" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tìm căn</text>
      <text x="576" y="245" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">id · mã</text>

      <!-- S1: hồ sơ của căn -->
      <rect x="688" y="64" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="64" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="808" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ nổi cạnh bảng</text>
      <text x="808" y="113" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">như hàng 3</text>
      <text x="808" y="129" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nút «Chép đường dẫn»</text>

      <!-- S2: nhiều căn — chọn toà -->
      <rect x="688" y="196" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="196" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="696" y="204" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="714" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-6 </text>
      <text x="808" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng lọc theo mã</text>
      <text x="808" y="256" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mỗi toà một dòng</text>

      <!-- S3: không có căn -->
      <rect x="688" y="324" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="324" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="696" y="332" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="714" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-7</text>
      <text x="808" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Không dòng nào khớp»</text>
      <text x="808" y="384" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trạng thái sẵn có</text>

      <!-- X1: đã chép (exit, focal) -->
      <text x="1160" y="64" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-2</text>
      <rect x="1000" y="72" width="160" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="1000" y="72" width="160" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1080" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Đã chép đường dẫn»</text>
      <text x="1080" y="118" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">người tự dán và gửi</text>

      <!-- X2: về Bảng hàng (exit) -->
      <rect x="1000" y="328" width="160" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="1000" y="328" width="160" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1080" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xoá lọc</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="428" x2="1160" y2="428" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="132" y="446" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối vào · điểm ra</text>

      <rect x="284" y="446" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Trạng thái của Bảng hàng</text>

      <polygon points="484,444 492,452 484,460 476,452" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <rect x="580" y="446" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="612" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Viền cam: chỗ mọi lối gặp nhau, và chỗ ra để gửi</text>

      <text x="1160" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-n: tiêu chí liên quan</text>
    </svg>
  </div>
</body>
</html>
