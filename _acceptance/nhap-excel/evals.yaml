    cmd: config:executors.test.nhap_excel_unit
    paths: [src/modules/imports/**, src/modules/company-config/rules.ts, tests/nhap-excel-ghep-cot.test.ts]
    expected: "exit 0; tests/nhap-excel-ghep-cot.test.ts: bảng tiêu đề viết trước 24 ca hằng 24, mỗi ca một (đích, dấu, lý do) — mẫu nhập trùng → giữ nguyên; trùng nhãn riêng 'Block' → giữ nguyên; trùng nhãn chuẩn 'Giá chào' khác hoa thường, dấu → giữ nguyên; từ điển tiêu đề 'Giá KBP', 'DT', 'PN', 'Mã căn', 'Mã', 'TT' → máy sửa kèm lý do; 'View' lạ → cần người; 'Chủ nhà', 'SĐT', 'Điện thoại' → chặn lý do 'owner-column'; hai cột 'Giá' và 'Giá chào' cùng ListPrice → cả hai chặn 'same-target'; không cột mã căn → chặn 'no-unit-column'; thứ tự ưu tiên ghim bằng một ca tiêu đề vừa có trong mẫu vừa trùng nhãn chuẩn khác đích → đích của mẫu; tạo trường riêng mới từ cột 'View' qua checkFieldDraft của 7e: kiểu 'formula' bị từ chối, trường thứ 21 bị từ chối 'field-limit', 'chọn một' lấy sẵn ≤30 giá trị khác nhau; ca phá: chỉ soát cột đầu khi trùng đích → khẳng định 'second column with same target not blocked'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

