schema_version: 1
feature_slug: nhap-excel
# Bốn lệnh chấm của hàng (thêm vào _acceptance/config.yaml sau khi G mở vùng):
#   executors.test.nhap_excel_unit   npx vitest run src/modules/imports tests/nhap-excel --coverage.enabled=false --reporter=verbose
#   executors.script.nhap_excel_db   DB_LANE=${DB_LANE:-d} DB_PORT=${DB_PORT:-5571} npx vitest run -c vitest.db.config.ts tests/db/nhap-excel.db.test.ts --reporter=verbose
#   executors.script.nhap_excel_e2e  DB_LANE=${DB_LANE:-d} DB_PORT=${DB_PORT:-5571} npx playwright test -c playwright.db.config.ts tests/e2e-db/nhap-excel.spec.ts
#   executors.script.cach_ly_d       DB_LANE=${DB_LANE:-d} DB_PORT=${DB_PORT:-5571} bash db/scripts/cach-ly.sh
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.nhap_excel_unit
    paths: [src/modules/imports/**, tests/nhap-excel-doc-tep.test.ts, tests/fixtures/nhap-excel/**]
    expected: "exit 0; tests/nhap-excel-doc-tep.test.ts: bảng viết trước 6 tệp đọc đúng (xlsx một trang, xlsx ba trang — đọc trang đầu có dữ liệu và trả tên hai trang còn lại, csv phẩy, csv chấm phẩy, csv có BOM, csv có ô ngoặc kép chứa phẩy và xuống dòng) hằng 6, mỗi ca so tiêu đề và ô từng chữ; ma trận lỗi viết trước 7 ca hằng 7 (sai đuôi .pdf, 10 MB + 1 byte, 5.001 dòng, tệp 0 byte, chỉ dòng tiêu đề, xlsx hỏng, xlsx khoá mật khẩu); nguồn từng tệp thử ghi trong tests/fixtures/nhap-excel/NGUON.md (thư viện ghi khác thư viện đọc; csv phẩy theo khuôn Google Sheet «Tải xuống»; csv chấm phẩy có BOM theo khuôn Excel bản Việt; ô ngày lưu dạng số ngày của Excel và chuỗi dùng chung có trong gon.xlsx) mỗi ca trả đúng mã lỗi và câu từ tệp chữ của mô-đun; ca phá: bỏ kiểm số dòng → khẳng định 'row limit not enforced: 5001'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: script
    cmd: config:executors.script.nhap_excel_e2e
    layer: backend-effect
    paths: [src/modules/imports/**, "src/app/(app)/nhap-tep/**", "src/app/api/v1/imports/**", tests/e2e-db/nhap-excel.spec.ts]
    expected: "exit 0; tests/e2e-db/nhap-excel.spec.ts ca 'tep khong len may chu': chọn tests/fixtures/nhap-excel/gon.xlsx ở 1440, ghi mọi yêu cầu mạng; không yêu cầu nào có content-type multipart hay thân chứa byte đầu 'PK' của tệp xlsx; đúng các yêu cầu tới /api/v1/imports/preview mang JSON {headers, rows}; ca lỗi: chọn tệp .pdf hiện câu sai đuôi và nút «Chọn tệp khác», 0 yêu cầu tới /api/v1; đối chứng dương: tệp đúng thì ≥1 yêu cầu preview; ca phá trong bài: gửi tệp bằng FormData → khẳng định 'file body left the browser'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

