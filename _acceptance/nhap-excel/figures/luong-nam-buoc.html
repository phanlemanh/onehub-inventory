<!DOCTYPE html>

<text x="40" y="68" fill="#2d3142" font-size="24" font-weight="600" font-family="'Lora','Instrument Serif',Georgia,serif" text-anchor="start" >Từ tệp bảng tính tới Bảng hàng, qua năm bước</text>
<text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Máy đề xuất, người chốt. Lần sau cùng dạng tệp thì đi thẳng tới Xem trước, không còn câu hỏi nào.</text>

<text x="312" y="224" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Mỗi cột một đích, đi theo thứ tự:</text>

<text x="312" y="278" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Cột lạ thì hỏi người</text>

<text x="792" y="260" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Con số do máy chủ trả</text>
<text x="792" y="278" fill="#ba4513" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Còn ô «chặn» thì nút Áp tắt</text>
<rect x="1020" y="148" width="200" height="164" rx="6" fill="#f5f5f5"/><rect x="1020" y="148" width="200" height="164" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
<rect x="1032" y="160" width="52" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.6" stroke-width="0.8"/><text x="1058" y="172" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="middle" letter-spacing="0.08em">BƯỚC 5</text>
<text x="1032" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Xong</text>

<text x="1032" y="242" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Sàn vừa học được những gì</text>
<text x="1032" y="260" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Ô nào giữ chữ gốc</text>
<text x="1032" y="278" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Nút Hoàn tác lần nhập</text>
<line x1="60" y1="408" x2="1220" y2="408" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="60" y="436" fill="#636b80" font-size="9" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" letter-spacing="0.1em">CHỈ BẢNG CHỮ LÊN MÁY CHỦ</text>
<text x="60" y="458" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Tệp gốc ở lại máy người nhập;</text>
<text x="60" y="476" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >không có bản sao tệp trên máy chủ.</text>
<text x="460" y="436" fill="#636b80" font-size="9" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" letter-spacing="0.1em">ÁP LÀ MỘT GIAO DỊCH</text>
<text x="460" y="458" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Hỏng giữa chừng thì không gì</text>
<text x="460" y="476" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >được ghi và không học gì.</text>
<text x="860" y="436" fill="#636b80" font-size="9" font-weight="600" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" letter-spacing="0.1em">HỌC KHI THÀNH CÔNG</text>
<text x="860" y="458" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >Lựa chọn của người được sàn nhớ,</text>
<text x="860" y="476" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist','Helvetica Neue',Arial,sans-serif" text-anchor="start" >lần sau không phải hỏi lại.</text>
