<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hai lượt chạy · Luồng hai làn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Lora', 'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-soft); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng hai làn · Hỏi-1 · AC-1 đến AC-4</p>
    <h1>Bộ kiểm chung chạy hai lượt: lượt không đăng nhập và lượt có phiên thử</h1>
    <p class="sub">Màn cần đăng nhập không bị bỏ im lặng: lượt trên giao nó cho lượt dưới, lượt dưới đo hết.</p>

    <svg viewBox="0 0 1200 616" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="80" x2="1168" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="260" x2="1168" y2="260" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="460" x2="1168" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="216" y1="80" x2="216" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="40" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÀN</text>
      <text x="240" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CÁC BƯỚC</text>

      <text x="40" y="152" fill="#2d3142" font-size="12" font-weight="600">Lượt không</text>
      <text x="40" y="168" fill="#2d3142" font-size="12" font-weight="600">cơ sở dữ liệu</text>
      <text x="40" y="188" fill="#636b80" font-size="9">lượt thử thường · CI</text>

      <text x="40" y="344" fill="#2d3142" font-size="12" font-weight="600">Lượt có</text>
      <text x="40" y="360" fill="#2d3142" font-size="12" font-weight="600">cơ sở dữ liệu</text>
      <text x="40" y="380" fill="#636b80" font-size="9">máy dãy · lượt chấm</text>

      <!-- Arrows (drawn first) -->
      <!-- Top lane: open → measurable -->
      <line x1="440" y1="128" x2="536" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Top lane: open → pushed to sign-in -->
      <path d="M440 152 H480 Q488 152 488 160 V200 Q488 208 496 208 H536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Handoff: top lane → bottom lane -->
      <path d="M780 208 H872 Q880 208 880 216 V316" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Bottom lane chain -->
      <line x1="400" y1="360" x2="428" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="360" x2="636" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="752" y1="360" x2="780" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1008" y1="360" x2="1036" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Branch Hỏi-1 → bottom lane -->
      <line x1="440" y1="484" x2="440" y2="464" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="456" y="104" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="488" y="117" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MỞ ĐƯỢC</text>

      <rect x="500" y="160" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="504" y="173" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BỊ ĐẨY VỀ ĐĂNG NHẬP</text>

      <rect x="792" y="184" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="828" y="197" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIAO SANG</text>

      <!-- Top lane steps -->
      <rect x="240" y="112" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="112" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="136" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bộ kiểm chung mở màn</text>
      <text x="340" y="154" fill="#636b80" font-size="9" text-anchor="middle">khi chưa đăng nhập</text>

      <rect x="540" y="104" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="104" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="124" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Đo như bộ kiểm hiện có</text>
      <text x="660" y="142" fill="#636b80" font-size="9" text-anchor="middle">màn Đăng nhập chỉ đo ở lượt này</text>

      <rect x="540" y="184" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="184" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="204" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Giao sang lượt có phiên</text>
      <text x="660" y="222" fill="#636b80" font-size="9" text-anchor="middle">bỏ qua có ghi lý do, không bỏ im lặng</text>

      <!-- Bottom lane steps -->
      <rect x="240" y="320" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="320" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="352" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Chuẩn bị</text>
      <text x="320" y="370" fill="#636b80" font-size="9" text-anchor="middle">sàn thử + người thử</text>
      <text x="320" y="384" fill="#636b80" font-size="9" text-anchor="middle">đủ bốn vai</text>

      <rect x="432" y="320" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="320" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="352" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Đăng nhập một lần</text>
      <text x="520" y="370" fill="#636b80" font-size="9" text-anchor="middle">qua màn đăng nhập thật,</text>
      <text x="520" y="384" fill="#636b80" font-size="9" text-anchor="middle">không đi đường tắt</text>

      <rect x="640" y="320" width="112" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="320" width="112" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="696" y="352" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Lưu phiên</text>
      <text x="696" y="370" fill="#636b80" font-size="9" text-anchor="middle">dùng cho</text>
      <text x="696" y="384" fill="#636b80" font-size="9" text-anchor="middle">cả lượt chạy</text>

      <rect x="784" y="320" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="320" width="224" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="896" y="344" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bộ kiểm chung mở</text>
      <text x="896" y="360" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">mọi màn bằng phiên</text>
      <text x="896" y="378" fill="#636b80" font-size="9" text-anchor="middle">Hôm nay · Bảng hàng · Đã gửi · Thành viên</text>
      <text x="896" y="392" fill="#636b80" font-size="9" text-anchor="middle">bị đẩy về đăng nhập thì báo đỏ</text>

      <rect x="1040" y="320" width="128" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="1040" y="320" width="128" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1104" y="348" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bỏ qua vì cần</text>
      <text x="1104" y="364" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">đăng nhập: 0</text>
      <text x="1104" y="384" fill="#636b80" font-size="9" text-anchor="middle">không màn nào sót</text>

      <!-- Hỏi-1 branch -->
      <rect x="240" y="484" width="400" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="484" width="400" height="48" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="252" y="492" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="274" y="501" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
      <text x="308" y="503" fill="#2d3142" font-size="12" font-weight="600">Nếu chủ kho thêm cơ sở dữ liệu vào CI</text>
      <text x="308" y="520" fill="#636b80" font-size="9">thì lượt có phiên cũng chạy trên CI, không chỉ ở máy dãy và lượt chấm</text>

      <!-- Legend -->
      <line x1="40" y1="556" x2="1168" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="40" y="588" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="598" fill="#4f5d75" font-size="9">Bước</text>

      <rect x="132" y="588" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="156" y="598" fill="#4f5d75" font-size="9">Kết quả cần thấy</text>

      <line x1="284" y1="594" x2="312" y2="594" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="320" y="598" fill="#4f5d75" font-size="9">Đi tiếp trong làn</text>

      <line x1="452" y1="594" x2="480" y2="594" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="488" y="598" fill="#4f5d75" font-size="9">Giao sang làn kia</text>

      <rect x="620" y="588" width="16" height="12" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="644" y="598" fill="#4f5d75" font-size="9">Nhánh chờ chủ kho quyết</text>
    </svg>
  </div>
</body>
</html>
