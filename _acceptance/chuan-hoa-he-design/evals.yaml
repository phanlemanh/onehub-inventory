    paths: [src/styles/dark.css, src/app/globals.css, tests/e2e/chuan-hoa-mau.spec.ts]
    expected: "exit 0; chuan-hoa-mau.spec.ts «AC-11 · floating surface stands off the grid in dark» ở 1440: nền tối, ngăn chi tiết của 0905 mở, đọc giá trị xám của điểm ảnh ở dải đường dẫn (trang), một ô lưới trống chữ và thân ngăn trống chữ: ngăn − lưới ≥ 5; mở trình đơn tiêu đề «Giá chào», rê mục thứ hai: mục rê − nền trình đơn ≥ 5; nền sáng ba giá trị như trước vòng. Chiều đỏ trên cùng hàm: --popover = --card cho 'record surface equals the grid in dark'; --popover = neutral-800 cho 'menu hover equals the menu'; không thấy ngăn cho 'no record open'. Đã chạy trong ảnh Linux của Playwright."
