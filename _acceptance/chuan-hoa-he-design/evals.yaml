  - id: E15
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    paths: [src/lib/format/index.ts, src/app/globals.css, src/components/candidate/**, src/modules/listings/ui/**]
    steps:
      - "Open _acceptance/chuan-hoa-he-design/evidence/truoc/ (frames on the VP10 slice 1 branch before this round) and _acceptance/chuan-hoa-he-design/evidence/sau/ (same screens, sizes and data after this round)."
      - "For 1440 light and dark, compare Bảng hàng with all six statuses, one sold row and the record of 0905 open; for 360 light and dark compare the phone cards; for 1024 compare the hover pencil on Giá chào and the open editor."
      - "Open evidence/pha/mau-1440-light-trung.png (the same screen with «Chưa đủ để rao» forced to the «Tạm ngừng» colour) beside sau/mau-1440-light.png."
    expected: "Sau: sáu nhãn đọc được sáu màu khác nhau ở cả sáng lẫn tối, «Chưa đủ để rao» xám, «Đang giao dịch» tím, bốn màu kia như trước; dòng căn đã bán không còn ổ khoá; ngăn chi tiết và thẻ điện thoại cùng màu với lưới; bút chì chỉ ở ô sửa được; khung sửa nằm trên ô. Chiều đỏ: khung pha/mau-1440-light-trung.png phải bị chấm là CÓ hai nhãn trùng màu — chấm nó là sáu màu khác nhau thì phép nhìn không phân biệt được."
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E16
    criterion: AC-10
    executor: judgment
    inputs: [_acceptance/chuan-hoa-he-design/design.md, _acceptance/chuan-hoa-he-design/contract.md, _acceptance/chuan-hoa-he-design/decisions.jsonl, design/behaviors.md, wiki/decisions/0052-chuan-hoa-he-design.md]
    question: "Đặt cạnh mục «Nguồn — lời chủ kho, nguyên văn» và bảng «Cắt lát» của design.md, cùng dòng trả lời Cổng Phạm vi trong decisions.jsonl: (1) mỗi điều của lát 1 có đúng một dòng ở bảng «Từng chỗ và cách làm — lát 1» và cột «Sau» làm đúng điều ấy, không thêm việc chủ kho không bảo; (2) design/behaviors.md các dòng «Sửa dữ liệu», «Phím trong lưới», «Chữ mở trong ô», «Ô không sửa được» nói đúng luật mới (Enter là sửa ở ô sửa được, mở hồ sơ ở ô khác; phím cách mở hồ sơ; bấm ra ngoài là ghi; khoá do trạng thái không vẽ ổ khoá) kèm lời duyệt và ngày 2026-11-27, và không còn câu «Enter mở dòng khi màn có hồ sơ»; (3) các điều của lát 2, lát 3 và các câu chi-nguoi chưa trả lời không nằm trong phần đã làm của design.md, behaviors.md hay trang quyết định 0052?"
    evidence_required: [verdict, rationale, judges]
