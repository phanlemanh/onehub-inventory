    paths: [src/components/candidate/cell-editor.tsx, src/components/candidate/data-region.tsx, src/modules/listings/ui/use-listing-cell-edit.tsx, tests/e2e-db/chuan-hoa-ghi-mot-lan.spec.ts]
    expected: "exit 0; tests/e2e-db/chuan-hoa-ghi-mot-lan.spec.ts trên Postgres có đăng nhập, 1440: đếm yêu cầu ghi tới /api/v1 khi sửa ô Giá chào: bấm ra ngoài đúng 1 lần ghi; Enter đúng 1 lần, không thêm lần nào khi khung đóng hay khi bấm sang ô khác sau đó; Esc 0 lần; giá trị chưa hiểu rồi bấm ra ngoài 0 lần; tải lại trang thì ô hiện giá mới (đọc từ máy chủ). Chiều đỏ trên cùng hàm: để đường bấm-ra-ngoài ghi thêm sau Enter cho 'two writes for one edit'; huỷ lần ghi khi lưới vẽ lại cho 'value lost after reload'."
