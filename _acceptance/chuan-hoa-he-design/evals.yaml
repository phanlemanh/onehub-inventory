schema_version: 1
feature_slug: chuan-hoa-he-design
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E1
    paths: [src/lib/format/index.ts, src/app/globals.css, src/styles/dark.css, tests/e2e/chuan-hoa-mau.spec.ts]
    expected: "exit 0; tests/e2e/chuan-hoa-mau.spec.ts «AC-1 · six statuses, six colours» ở 1440 sáng và tối, trên Bảng hàng có đủ sáu trạng thái: chụp nhãn đầu tiên của mỗi trạng thái, lấy màu chữ (điểm ảnh xa màu nền nhất) đổi sang Lab; ma trận viết sẵn 15 cặp × 2 nền = 30 ô, mỗi ô ΔE2000 ≥ 12 (ngưỡng theo câu trả lời Hỏi-2), bài đòi đúng 30 ô; «Chưa đủ để rao» độ bão hoà chữ ≤ 8 ở cả hai nền; «Đang giao dịch» sắc theo Hỏi-2; trạng thái có độ bão hoà > 8 lệch sắc giữa sáng và tối ≤ 30°. Chiều đỏ trên cùng hàm: tập nhãn rỗng cho 'no status badge found'; ép «Chưa đủ để rao» về biến thể của «Tạm ngừng» cho 'two statuses share a colour: Incomplete and Hold'; trả --info nền sáng về --onehub-blue cho 'two statuses share a colour: Pending and Closed'; sắc tím ảnh 27/11 (violet) ở nền sáng cho 'Pending and Closed 10.4 under 12' khi ngưỡng là 12. Đã chạy trong ảnh Linux của Playwright."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: test
    cmd: npx vitest run tests/mau-trang-thai.test.ts --coverage.enabled=false --reporter=verbose
    paths: [src/lib/format/index.ts, src/app/globals.css, tests/mau-trang-thai.test.ts]
    expected: "exit 0; STATUS_TONE có sáu biến thể khác nhau từng đôi; Incomplete là 'invert-light', Pending là 'info-light'; khối :root của src/app/globals.css khai --info khác --primary và không trỏ --onehub-blue; quét mọi tệp .ts, .tsx dưới src (trừ src/components/ui, src/components/reui): biến thể và lớp info ('info-light', variant=\"info\", text-info, bg-info, border-info) chỉ xuất hiện ở src/lib/format/index.ts. Chiều đỏ trong cùng tệp: bảng giả có hai trạng thái chung biến thể cho 'STATUS_TONE gives Incomplete and Hold the same variant'; chuỗi CSS giả '--info: var(--onehub-blue)' cho 'light --info equals the brand blue'; tệp giả dùng variant=\"info\" cho 'info used outside the status table: <tệp>'; thư mục quét rỗng cho 'no source file scanned'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E3
    paths: [src/lib/format/index.ts, src/modules/listings/ui/listing-record.tsx, src/modules/listings/ui/listing-record-full.tsx, tests/e2e/chuan-hoa-mau.spec.ts]
    expected: "exit 0; chuan-hoa-mau.spec.ts «AC-2 · one colour per status everywhere», sáng và tối, ma trận viết sẵn 22 ô mỗi nền = 44 ô: lưới 1440 (6 trạng thái), thẻ điện thoại 360 (6), đầu ngăn chi tiết của một căn mỗi trạng thái (6), lịch sử lần chào (4: Đang giao dịch, Ngừng hẳn, Đã bán của căn 0905; Chưa đủ để rao của căn 1202); mỗi ô so màu chữ với ô lưới cùng trạng thái cùng nền, ΔE2000 ≤ 3; bài in số ô đã đo và đòi đúng 44. Chiều đỏ: ép nhãn trong ngăn sang biến thể khác cho 'status Active differs between grid and record head, light'; thiếu một ô cho tên ô, ví dụ 'no Pending badge in offer history, dark'; số ô khác 44 cho 'measured 43 of 44 cells'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E4
    paths: [src/components/candidate/typed-cell.tsx, src/modules/listings/ui/listing-cell-edit.tsx, tests/e2e/chuan-hoa-mau.spec.ts]
    expected: "exit 0; chuan-hoa-mau.spec.ts «AC-3 · no padlock where the status says it» ở 1024 và 1440 trên dòng căn đã bán và căn ngừng hẳn: các ô trạng thái, giá chào, phí, cột riêng không chứa svg ổ khoá; mỗi ô ấy có title và aria-description bắt đầu bằng chữ khoá của lưới và nêu tên trạng thái; Enter, F2, gõ chữ, bấm đúp không mở khung sửa. Chiều đỏ: vẽ lại ổ khoá cho 'padlock where the status explains the lock'; bỏ aria-description cho 'locked cell gives no reason'; không tìm thấy dòng khoá nào cho 'no locked row found'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E5
    paths: [src/components/candidate/data-region.tsx, tests/e2e/chuan-hoa-sua-o.spec.ts]
    expected: "exit 0; tests/e2e/chuan-hoa-sua-o.spec.ts «AC-4 · Enter edits» ở 1024 và 1440: vai Đầu chủ chọn ô Giá chào của căn đang bán, Enter → khung sửa mở trên ô, ngăn chi tiết không mở; Enter trên ô Căn, ô giá căn đã bán, ô Diện tích → ngăn chi tiết của đúng dòng; vai chỉ xem Enter trên ô Giá chào → ngăn chi tiết; /sent Enter → chi tiết; /company-layer Enter → ô dưới được chọn. Chiều đỏ trên cùng hàm: trả cửa Enter về luật cũ cho 'Enter opened the record on an editable cell'; ép Enter mở sửa ở ô khoá cho 'Enter opened an editor on a locked cell'. Cùng tệp đơn vị src/components/candidate/data-region-keys.test.tsx xanh."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E6
    paths: [src/components/candidate/data-region.tsx, tests/e2e/chuan-hoa-sua-o.spec.ts]
    expected: "exit 0; chuan-hoa-sua-o.spec.ts «AC-5 · Space opens the record» ở 1024 và 1440 trên /inventory và /sent: chọn ô Giá chào (sửa được) rồi phím cách → ngăn chi tiết của đúng dòng mở, không khung sửa, scrollTop của trang và của lưới không đổi; khung sửa đang mở thì phím cách thêm một dấu cách vào giá trị. Chiều đỏ: bỏ cửa phím cách cho 'Space did not open the record'; để trình duyệt cuộn mặc định cho 'Space scrolled the grid'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E7
    paths: [src/components/candidate/data-region.tsx, tests/e2e/chuan-hoa-sua-o.spec.ts]
    expected: "exit 0; chuan-hoa-sua-o.spec.ts «AC-6 · a pencil on editable cells» ở 1024 và 1440: vai Đầu chủ rê ô Giá chào căn đang bán → một bút chì thấy được ở nửa phải ô, có title; rê ô giá căn đã bán, ô Diện tích, ô Căn → không bút; vai chỉ xem rê ô Giá chào → không bút; ngữ cảnh chạm (hasTouch, không rê) 1024 chọn ô Giá chào → bút thấy được. Chiều đỏ: hiện bút ở mọi ô cho 'pencil on a cell that does not edit'; ẩn bút khi không rê cho 'no pencil on the selected cell without hover'; không có ô sửa được nào cho 'no editable cell found'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/chuan-hoa-he-design/rang/chay.sh E8
    paths: [src/components/candidate/cell-editor.tsx, src/components/candidate/data-region.tsx, src/modules/listings/ui/use-listing-cell-edit.tsx, tests/e2e/chuan-hoa-sua-o.spec.ts]
    expected: "exit 0; chuan-hoa-sua-o.spec.ts «AC-7 · clicking away saves» ở 1024 và 1440: mở sửa ô Giá chào, gõ giá đổi ≤ 20 %, bấm ô Diện tích dòng khác → ô Giá chào hiện giá mới, thông báo có «Hoàn tác», ô Diện tích là ô đang chọn; gõ giá đổi > 20 % rồi bấm ra ngoài → hỏi lại như Enter; gõ chữ không đọc được rồi bấm ra ngoài → khung còn mở, dòng báo chưa hiểu, giá cũ không đổi; Esc → không ghi; Tab → ghi và ô kế được chọn. Chiều đỏ trên cùng hàm: trả bấm ra ngoài về huỷ cho 'clicking away dropped the typed value'; ghi cả giá trị chưa hiểu cho 'an unread value was saved'."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E18
