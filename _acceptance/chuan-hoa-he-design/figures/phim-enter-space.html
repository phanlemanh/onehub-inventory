<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter và phím cách</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:2.5rem 1.5rem}
.frame{max-width:1100px;margin:0 auto}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif','Lora',serif;font-size:2rem;font-weight:400;line-height:1.25;margin-bottom:.25rem}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Hỏi-1 · chuan-hoa-he-design</p>
<h1>Enter là sửa, phím cách là mở hồ sơ</h1>
<p class="sub">AC liên quan: AC-4, AC-5</p>
<svg viewBox="0 0 1096 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Enter là sửa, phím cách là mở hồ sơ: hôm nay và sau lát 1">
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- connectors (drawn before boxes) -->
<path d="M152 240 H168 Q176 240 176 232 V176 Q176 168 184 168 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M152 256 H168 Q176 256 176 264 V320 Q176 328 184 328 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M296 156 H312 Q320 156 320 148 V104 Q320 96 328 96 H344" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="296" y1="168" x2="344" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M296 180 H312 Q320 180 320 188 V232 Q320 240 328 240 H344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="296" y1="328" x2="344" y2="328" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="584" y1="96" x2="624" y2="96" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="584" y1="168" x2="624" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="584" y1="240" x2="624" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="584" y1="328" x2="624" y2="328" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<!-- column heads -->
<text x="736" y="52" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hôm nay</text>
<text x="960" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sau lát 1</text>

<!-- start -->
<rect x="24" y="224" width="128" height="48" rx="24" fill="#f5f5f5"/>
<rect x="24" y="224" width="128" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="88" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chọn một ô</text>

<!-- keys -->
<rect x="200" y="144" width="96" height="48" rx="6" fill="#f5f5f5"/>
<rect x="200" y="144" width="96" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="248" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Enter</text>

<text x="248" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phím cách</text>

<!-- cases -->

<text x="464" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ô sửa được</text>
<rect x="344" y="140" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="344" y="140" width="240" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="464" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ô không sửa được</text>
<text x="464" y="182" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">(khoá, không quyền, mã căn)</text>
<rect x="344" y="212" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="344" y="212" width="240" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="464" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Màn không có ngăn</text>
<text x="464" y="254" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">(Tuỳ chỉnh)</text>
<rect x="344" y="300" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="344" y="300" width="240" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="464" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mọi ô</text>

<!-- outcome rows: left half = Hôm nay, right half = Sau lát 1 -->
<rect x="624" y="68" width="448" height="56" rx="6" fill="#f5f5f5"/>
<rect x="624" y="68" width="448" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="852" y="72" width="216" height="48" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="736" y="100" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Mở hồ sơ</text>
<text x="960" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở sửa trên ô</text>

<rect x="624" y="140" width="448" height="56" rx="6" fill="#f5f5f5"/>

<line x1="848" y1="148" x2="848" y2="188" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>

<rect x="624" y="212" width="448" height="56" rx="6" fill="#f5f5f5"/>
<rect x="624" y="212" width="448" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<line x1="848" y1="220" x2="848" y2="260" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<text x="736" y="244" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Đi xuống một dòng</text>
<text x="960" y="244" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Đi xuống một dòng</text>

<rect x="624" y="300" width="448" height="56" rx="6" fill="#f5f5f5"/>
<rect x="624" y="300" width="448" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="852" y="304" width="216" height="48" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="736" y="332" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Không làm gì</text>
<text x="960" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở hồ sơ</text>

<!-- legend -->
<line x1="24" y1="388" x2="1072" y2="388" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="24" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
<rect x="24" y="420" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="56" y="430" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Chỗ đổi ở lát 1</text>
<line x1="200" y1="426" x2="232" y2="426" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="244" y="430" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Đường đổi</text>
<line x1="356" y1="426" x2="388" y2="426" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="400" y="430" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Đường giữ nguyên</text>
</svg>
</div>
</body>
</html>
