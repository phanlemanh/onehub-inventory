schema_version: 1
feature_slug: hoi-dau-chu-bao-sai
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.hoi_dau_chu_e2e_db
    paths: [src/components/candidate/record-panel.tsx, src/modules/listings/ui/**, tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts]
    expected: "exit 0; tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts ở 1440, 1024, 414, 360 mở /inventory?ho-so=<id hàng mẫu do người khác giữ, rút từ hàm mẫu của listings, không viết tay>: phần tử data-slot record-footer nằm ngoài data-slot record-panel-body, chứa đúng một nút có chữ 'Hỏi đầu chủ · ' nối tên người giữ của hàng ấy; cuộn thân hồ sơ tới cuối thì mép trên thanh không đổi quá 1 px và mép dưới phần tử cuối của thân nằm trên mép trên thanh; ở 414 và 360 nút cao ít nhất 36 px (cỡ lớn của bộ nút) và rộng bằng thân hồ sơ trừ lề (±2 px); ca đối chứng đặt thanh vào trong thân bằng thẻ style position static cho 'footer scrolls with the body', ca đối chứng ép nút cao 28 px cho 'touch target below 36'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.unit
    paths: [src/lib/share/**, src/modules/listings/**, tests/hoi-dau-chu-bao-sai.test.tsx]
    expected: "exit 0; trong tests/hoi-dau-chu-bao-sai.test.tsx: với MỌI hàng mẫu do người khác giữ, tin hỏi dựng từ hàng có text 'Hỏi về căn <unitNumber> · <buildingName>' và url bằng new URL('/inventory?ho-so=' + id, origin) (so lại từ hàng, không chép chữ); render nút trong khung có quyền với navigator.share giả: một cú bấm gọi share đúng một lần, đồng bộ trong trình xử lý bấm (share được gọi trước bất kỳ await nào — giả share ghi thứ tự), với {text, url} ấy; share ném AbortError thì không thông báo nào được gọi; ca đối chứng lấy mã căn của hàng khác cho 'question names the wrong unit', ca đối chứng gọi share sau một await cho 'share called outside the click'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2b
    criterion: AC-2
    executor: script
    cmd: config:executors.script.hoi_dau_chu_e2e_db
    paths: [src/modules/listings/ui/**, src/lib/share/**, tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts]
    expected: "exit 0; ở 1440 và 360 trên trang thật, navigator.share giả ghi lại đối số: bấm 'Hỏi đầu chủ' thì có đúng một lời gọi, url của nó mở trong trang mới hiện hồ sơ có data-record-id bằng id hàng đang hỏi; ca đối chứng cho nút gửi url của hàng đầu bảng cho 'link opens another unit'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.unit
    paths: [src/lib/share/**, tests/hoi-dau-chu-bao-sai.test.tsx]
    expected: "exit 0; ma trận viết trước ba máy × kết cục cho hàm mở của src/lib/share (số assert bằng số ô): có share và share xong → 'chia-se'; có share, share ném AbortError → 'huy' và không chép; có share, share ném lỗi khác, có clipboard → chép 'text\\nurl' và 'da-chep'; không share, có clipboard → 'da-chep'; không share, clipboard ném → 'loi'; không share, không clipboard → 'loi'; trên nút hỏi: 'da-chep' gọi notify với 'Đã chép tin hỏi', 'loi' hiện ngay dưới nút một dòng role=alert và ô chỉ đọc chứa nguyên tin (ở lại tới khi đổi căn hay bấm lại), ca đối chứng ẩn ô ấy cho 'manual copy text missing'; ca đối chứng nuốt lỗi chép trả 'da-chep' cho 'copy failure reported as copied'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/listings/**, tests/hoi-dau-chu-bao-sai.test.tsx]
    expected: "exit 0; với một hàng mẫu chưa ai giữ: nút ở thanh đáy có disabled, chữ đúng 'Căn chưa có đầu chủ giữ'; bấm (fireEvent.click) không gọi share giả hay clipboard giả; đối chứng dương: hàng do người khác giữ thì nút bật; ca đối chứng bật nút khi chưa ai giữ cho 'unheld unit asks nobody'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/listings/**, src/components/candidate/action-permission.tsx, tests/hoi-dau-chu-bao-sai.test.tsx]
    expected: "exit 0; ma trận viết trước bốn vai × ba kiểu giữ căn (người khác, chính mình, chưa ai) qua ActionPermissionProvider dựng từ actionVisibility thật của bảng quyền: có thanh đáy khi và chỉ khi vai có ô viewListings và người xem không giữ căn (12 ô, số assert bằng 12); Quản trị sàn không có thanh ở cả ba kiểu; ngoài ActionPermissionProvider không có thanh; ca đối chứng bỏ điều kiện 'không giữ căn' cho 'holder asked themselves', ca đối chứng so tên vai thay bảng quyền cho 'role name instead of permission table'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: script
    cmd: config:executors.script.hoi_dau_chu_e2e_db
    paths: [src/components/candidate/record-panel.tsx, src/modules/listings/ui/**, tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts]
    expected: "exit 0; ở 1440 mở hồ sơ hàng mẫu do chính người xem giữ: không có data-slot record-footer; bấm 'Sau' tới hàng do người khác giữ (rút từ hàm mẫu) thì thanh hiện với tên người giữ của hàng ấy; ca đối chứng giữ tên người giữ của hàng trước cho 'footer kept the previous holder'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/listings/**, tests/hoi-dau-chu-bao-sai.test.tsx]
    expected: "exit 0; bấm 'Báo sai thông tin' mở hộp tiêu đề 'Báo sai thông tin căn <mã>'; danh sách chọn có đúng năm mục theo thứ tự Căn, Toà, Dự án, Diện tích, Phòng ngủ (chữ lấy từ label()); chọn từng mục thì 'Đang hiện:' bằng giá trị hồ sơ hiện cho trường ấy (rút từ listingView, không viết tay); ma trận ô giá trị đúng khi bấm 'Chép và mở bảng chia sẻ': '' và '   ' không gọi share giả và hiện 'Gõ giá trị đúng trước khi gửi.' tại ô (aria-invalid), 'a' và 200 ký tự gọi share một lần, 201 ký tự không gõ được quá 200 (maxLength), căn cứ 501 ký tự không gõ được quá 500; vai không có ô readCatalog (dựng bảng quyền thử bỏ ô) thì không có nút; ca đối chứng cho chọn cả Giá chào cho 'listing field offered as catalog field'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.unit
    paths: [src/lib/share/**, src/modules/listings/**, tests/hoi-dau-chu-bao-sai.test.tsx]
    expected: "exit 0; tin báo sai dựng từ một hàng mẫu và chữ gõ: các dòng theo đúng thứ tự 'Báo sai thông tin căn <mã>', 'Toà: ', 'Dự án: ', 'Thuộc tính: ', 'Đang hiện: ', 'Đúng là: ' (đã cắt khoảng trắng), thêm 'Ghi chú: ' chỉ khi căn cứ khác rỗng; bấm nút soạn qua FormDialog thật với share giả ghi thứ tự: share được gọi đúng một lần, đồng bộ trong trình xử lý bấm (trước mọi await), với text ấy; ba kết cục chia-se, da-chep, loi hiện đúng 'Đã mở bảng chia sẻ', 'Đã chép', lỗi kèm textarea readonly có nguyên tin; huy không hiện gì; đóng hộp rồi mở lại thì hai ô rỗng và không dòng báo; ca đối chứng thiếu dòng 'Đang hiện' cho 'report missing current value', ca đối chứng chèn một await trước share cho 'report share called outside the click'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.hoi_dau_chu_e2e_db
    paths: [src/modules/listings/ui/**, src/lib/share/**, tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts]
    expected: "exit 0; layer: backend-effect — ở 1440 trên trang thật ghi mọi yêu cầu (page.on('request')) sau khi trang tải xong: bấm hỏi (share giả thành công, rồi huỷ, rồi không có share), mở hộp báo sai, điền, bấm soạn, đóng — không có yêu cầu nào ngoài tải tài nguyên tĩnh và RSC điều hướng cùng nguồn của Next (phương thức GET, không thân); không yêu cầu POST, PUT, PATCH, DELETE; văn bản ô của dòng ấy trên Bảng hàng và tám trường hồ sơ trước và sau giống hệt; ca đối chứng thêm một fetch POST vào lượt bấm (route giả) cho 'button sent a request'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.unit
    paths: [src/**, tests/hoi-dau-chu-bao-sai-luat.test.ts]
    expected: "exit 0; tests/hoi-dau-chu-bao-sai-luat.test.ts đọc dấu hiệu SP-3 từ PRODUCT-INVARIANTS.md (không chép biểu thức) và quét src/lib/share/** cùng các tệp nút mới: không khớp; các tệp ấy không gọi fetch, XMLHttpRequest, sendBeacon hay WebSocket; nút hỏi và nút báo sai gọi useActionPermission với đúng 'viewListings' và 'readCatalog' (đọc cây cú pháp TypeScript, không biểu thức chữ); đối chứng dương: bản sao chèn 'zalo.sendMessage(' khớp dấu hiệu cho 'SP-3 signal'; bản sao chèn fetch cho 'network call in a share button'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.hoi_dau_chu_e2e_db
    paths: [src/components/candidate/record-panel.tsx, src/modules/listings/ui/**, tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts]
    expected: "exit 0; ma trận viết trước 4 khổ (1440, 1024, 414, 360) × sáng, tối × 2 bề mặt (hồ sơ có thanh đáy, hộp báo sai mở): quét axe không vi phạm mức serious hay critical; mỗi khổ in 'axe scans <khổ> 4', bốn khổ cộng 16 lượt; ca đối chứng hạ tương phản chữ nút bằng thẻ style cho vi phạm color-contrast"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    paths: [src/components/candidate/record-panel.tsx, src/modules/listings/ui/**]
    steps:
      - "From the repo root, with lane V Postgres up (make db-up DB_LANE=v DB_PORT=5570 if docker ps does not list onehub-inventory-db-v), run: DB_LANE=v DB_PORT=5570 npx playwright test -c playwright.db.config.ts tests/e2e-db/hoi-dau-chu-bao-sai.spec.ts — it signs a person in through the real sign-in screen and writes frames to .acceptance-runs/hoi-dau-chu-bao-sai/e2e/"
      - "Run: npx playwright test tests/e2e/ho-so-can.spec.ts -g 'two lines' — it writes the record head frames to .acceptance-runs/hoi-dau-chu-bao-sai/dau-ho-so/"
      - "Copy every frame of both folders to _acceptance/hoi-dau-chu-bao-sai/evidence/ with the prefix E9b- and look at each one"
      - "Compare each frame with the question and name any frame that differs"
    question: "Ảnh hoi-<khổ>-<sáng|tối>: đáy hồ sơ căn có một thanh dính với đúng một nút «Hỏi đầu chủ · [Tên] 0x», không đè chữ của thân. chua-ai-giu: nút tắt, chữ «Căn chưa có đầu chủ giữ». minh-giu: không có thanh đáy. bao-sai-<khổ>-<màu>: hộp «Báo sai thông tin căn …» có ô thuộc tính sai, dòng «Đang hiện», ô giá trị đúng đã gõ, ô ghi chú căn cứ. hoi-loi và bao-sai-loi: dòng báo lỗi và ô chỉ đọc chứa nguyên tin, đọc được, không bị cắt. dau-ho-so-<khổ>-<màu>: đầu hồ sơ hai dòng — tên căn một dòng, dưới là biểu tượng chép đường dẫn, Trước, Sau, Đóng; không nút nào tràn khỏi hồ sơ. Ảnh tối đọc được, chữ không chồng chữ."
    expected: "Ảnh hồ sơ ở 1440, 1024, 414, 360, sáng và tối: thanh đáy với nút hỏi dính đáy hồ sơ, không chồng chữ; ảnh căn chưa ai giữ có nút tắt chữ 'Căn chưa có đầu chủ giữ'; ảnh hộp báo sai ở 1440 và 360 với một thuộc tính đã chọn và 'Đang hiện'; ảnh lỗi chép của nút hỏi (thông báo lỗi kèm nguyên tin) và của hộp báo sai (ô chỉ đọc) ở 360 và 1440, sáng và tối: nguyên tin hiện đủ, không bị cắt, bôi chọn được; mọi chữ nút từ bảng nhãn, ≤ 17 ký tự"
    evidence_required: [screenshot, observed]

  - id: E9c
    criterion: AC-9
    executor: judgment
    inputs: [_acceptance/hoi-dau-chu-bao-sai/design.md, _acceptance/hoi-dau-chu-bao-sai/contract.md, ontology/labels.yaml]
    question: "Theo design.md và contract.md, hai nhãn mới AskListAgent và ReportUnitError trong ontology/labels.yaml có đúng chữ đã duyệt ở câu hỏi chữ nút báo sai, có kind action, own: true, không quá 17 ký tự, và không dùng lại tên RESO cho nghĩa khác không?"
    evidence_required: [verdict, reasons]

