schema_version: 1
feature_slug: design-decisions-40-of-40
# Mỗi tiêu chí: một phép đo xanh trên cây (rang/do.mjs) và một phép đo hai chiều trên bản sao mới (rang/hai-chieu.mjs).
# Phép đo đọc plugin design-assembly 0.69.0 ở $DA_PLUGIN (mặc định thư mục chủ kho cài).
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: ["design/**", "tests/**", "tools/**", "wiki/log/**"]
    expected: "exit 0; đầu ra có 'design-assembly: 25 decisions held by 36 checks, each seen failing on a changed copy', 'component manifest: design/component-registry.json is up to date (297 components)', 'determinism: 62/73 = 85%' và 'Tests  2698 passed | 2 skipped (2700)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: node _acceptance/design-decisions-40-of-40/rang/do.mjs muc
    layer: backend-effect
    paths: ["design/**", "tests/**", "playwright.config.ts", "_acceptance/design-decisions-40-of-40/rang/**"]
    expected: "exit 0; dòng 'muc: 40 of 40 core decisions answered, 14 held, 19 claimed, 7 recorded'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: script
    cmd: node _acceptance/design-decisions-40-of-40/rang/hai-chieu.mjs --only muc
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/design-decisions-40-of-40/rang/**", "design/**", "tests/**"]
    expected: "exit 0; mỗi ca xanh trên bản sao không đổi và đỏ sau khi phá — muc-untag: đỏ 'the audit says 39 of 40, 14 held, 18 claimed, 7 recorded'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: script
    cmd: node _acceptance/design-decisions-40-of-40/rang/do.mjs sau-dong
    layer: backend-effect
    paths: ["design/**", "tests/**", "playwright.config.ts", "_acceptance/design-decisions-40-of-40/rang/**"]
    expected: "exit 0; dòng 'sau-dong: error-copy recorded; terms, test-screen-sizes, reference-implementation, screen-ledger, screen-actions claimed by their checks'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
