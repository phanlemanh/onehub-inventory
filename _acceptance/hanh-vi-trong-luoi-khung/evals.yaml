    paths: [src/app/**, src/modules/**, tests/behavior-guard.test.ts, tests/behavior.test.tsx, tests/grid.test.tsx, design/decisions.yaml]
    expected: "exit 0; tests/behavior-guard.test.ts có danh sách viết trước đúng 13 nguồn bị cấm trong tệp màn, khai bằng tệp đích trong kho (9 tệp: components/ui/sheet, dialog, alert-dialog, drawer, skeleton, empty, spinner, components/candidate/record-panel, region-state) hay gói (4: sonner, vaul, @base-ui/react/dialog, @base-ui/react/alert-dialog); mỗi đường nhập được giải về tệp đích trước khi so, nên mọi cách viết quy về một; ma trận viết trước 9 tệp × 6 cách viết (bí danh, bí danh có đuôi, tương đối, tương đối có đuôi, tương đối qua gốc kho, tương đối mở bằng ./) cộng 4 gói × 2 cách viết (gói, đường con) = 62 ca phá trên cây tạm, mỗi ca đỏ với thông điệp nêu đúng tệp màn, đường nhập, tệp đích và thành phần dùng chung phải dùng thay, bộ kiểm khẳng định 62; câu nhập được đọc bằng cây cú pháp của TypeScript, không bằng biểu thức chữ; ma trận viết trước đúng 11 dạng câu lệnh (nhập tên, nhập mặc định, nhập cả mô-đun, mặc định kèm tên, nhập chỉ để chạy, tái xuất tên, tái xuất tất cả, tái xuất cả mô-đun, nhập động, nhập động trong hàm, nhập tên trải nhiều dòng), mỗi dạng đặt giữa các câu nhập và tái xuất khác trong một tệp màn nhiều dòng và đỏ đúng một lần, bộ kiểm khẳng định 11; cửa chung của Base UI đỏ với nhập Dialog, nhập AlertDialog đổi tên, nhập cả mô-đun dạng * as và tái xuất Dialog; ca đối chứng xanh cho chính các thành phần dùng chung, nhập chỉ để có kiểu (import type, { type … }, export type), một tên na ná (sheetish, sonnerish), phần khác của Base UI và một chuỗi chữ có hình câu nhập; quét thật mọi tệp .ts/.tsx dưới src/app và src/modules/*/ui không thấy nguồn nào, trừ src/app/layout.tsx chỉ được nhập components/ui/sonner; ma trận viết trước đúng sáu dòng nối id quyết định với một ca phá thử có thông điệp ghim — edit-in-cell 'edit mode: date', undo-or-confirm 'irreversible change ran without confirmation', feedback-by-delay 'progress before 10s', state-matrix 'header leaks count: error', notification-channel 'field error sent to toast' (gửi lỗi trường qua bộ báo thật notify với luật kênh đã phá và thấy toast bắn), read-only-cell 'locked cell without reason' — mỗi ca chạy và đỏ đúng thông điệp ấy, bộ kiểm khẳng định 6 ca; với sáu id ấy và record-panel, mỗi mục trong design/decisions.yaml có check trỏ tệp có thật chứa 'decision:<id>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

