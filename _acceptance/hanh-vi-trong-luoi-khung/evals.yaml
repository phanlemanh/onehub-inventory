    layer: ui-observed
    paths: [src/components/candidate/**, "src/app/(app)/proto/**"]
    steps:
      - "Use the dev server at the URL given (lane port); do not start one on port 3470"
      - "Navigate {url}/proto/hanh-vi-trong-luoi-khung at 1440x900, light, press the open button of the second listing row → screenshot evidence/E14-step1.png"
      - "Same page, press «Sau» in the record panel, then switch to the people grid and open its first row → screenshot evidence/E14-step2.png"
      - "Navigate {url}/proto/hanh-vi-trong-luoi-khung at 360x800, dark, open the first listing row → screenshot evidence/E14-step3.png"
      - "Navigate {url}/proto/hanh-vi-trong-luoi-khung?state=error at 1440x900 → screenshot evidence/E14-step4.png"
      - "Navigate {url}/proto/hanh-vi-trong-luoi-khung at 1440x900, press the irreversible demo action (its button carries the verb) → screenshot evidence/E14-step5.png"
    expected: "hồ sơ nằm cạnh bảng bên phải, đầu hồ sơ có tên dòng, 'Trước', 'Sau', 'Đóng'; hồ sơ người dùng đúng khung ấy; ở 360 tối hồ sơ phủ toàn màn và đọc được; vùng lỗi đầu chỉ có tên vùng, câu ba phần và 'Thử lại'; hộp xác nhận nói việc sẽ xảy ra, nút mang động từ và có 'Thôi'"

  - id: E15
    criterion: AC-5
    executor: judgment
    question: "Trả lời bốn câu có/không chỉ dựa trên các hằng chữ trong grid-copy.ts và frame-copy.ts: (a) câu lỗi vùng khi màn chưa nối việc tải lại có đủ ba phần chuyện gì xảy ra, vì sao, làm gì tiếp và không nhắc tới nút «Thử lại»; (b) câu vùng tải hỏng một phần mà chưa có dòng nào nói rõ dữ liệu có nhưng chưa tải được, không nói chưa ai nhập; (c) câu tiến độ sau 10 giây nói đang tải lâu và cho biết có thể huỷ; (d) câu hộp xác nhận chung bảo người đọc việc sẽ xảy ra trước khi bấm. Với cả bốn: người dùng được gọi là «bạn» theo design/language.md và không có dấu chấm than."
    inputs: [src/components/candidate/grid-copy.ts, src/components/templates/frame-copy.ts, design/language.md]

