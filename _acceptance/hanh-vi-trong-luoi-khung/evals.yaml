    expected: "exit 0; ma trận viết trước ba ô: (đảo được, trong sàn) → làm ngay, toast có 'Hoàn tác', bấm gọi undo một lần, không hộp xác nhận; (đảo được, ra ngoài sàn) và (không đảo được, trong sàn) → hộp xác nhận mở trước, việc chưa chạy, nút xác nhận có đúng chữ động từ màn đưa, 'Thôi' đóng hộp và việc không chạy, xác nhận thì việc chạy một lần và toast không có 'Hoàn tác'; việc ném lỗi khi navigator.onLine false → băng screen-banner kind save-failed và giá trị ô nhập của màn còn nguyên; việc ném FieldError thì cửa gửi nó qua bộ báo notify theo kênh field, trả lỗi về màn mang channel 'inline', không toast, không băng — cả khi thay đổi đi qua hộp xác nhận: sau khi bấm động từ, FieldError và lỗi khác đều về màn qua lời hứa của run (không thành false như bấm Thôi); notify('result') ra toast và notify('screen') ra băng trên màn; ca đối chứng dùng bản làm ngay mọi thay đổi và khẳng định thông điệp 'irreversible change ran without confirmation'"
