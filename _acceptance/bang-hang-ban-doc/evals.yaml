schema_version: 1
feature_slug: bang-hang-ban-doc
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/listings/ui/**, tests/inventory.test.tsx]
    expected: "exit 0; trong tests/inventory.test.tsx, inventoryRows trên dữ liệu mẫu hàng 1 cho đúng 60 dòng; với MỌI dòng, bộ kiểm tra lại từ dữ liệu nguồn: id = id lần chào, Listing.unitNumber/buildingName/subdivisionName/standardStatus/listPrice/lastConfirmedAt = của lần chào, Unit.livingArea và Unit.bedroomsTotal = của căn có upi bằng upi liên kết căn của lần chào (không phải căn cùng chỉ số); ca liên kết trỏ upi không có → hai ô ấy null; hai ca đối chứng trên cùng dữ liệu: bộ dựng ghép căn theo chỉ số mảng thay vì theo liên kết cho thông điệp 'row unit mismatch: <id lần chào>', bộ dựng lấy căn đầu tiên khi upi không có cho thông điệp 'missing unit filled: <id lần chào>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/listings/ui/**, "src/app/(app)/inventory/**", tests/inventory.test.tsx]
    expected: "exit 0; InventoryGrid dựng với 60 dòng mẫu: cột số dòng rồi đúng tám đầu cột theo thứ tự, chữ mỗi đầu cột bằng label() của khái niệm Unit, Building, Subdivision, StandardStatus, ListPrice, LivingArea, BedroomsTotal, LastConfirmedAt VÀ bằng chuỗi đã duyệt viết sẵn: 'Căn', 'Toà', 'Dự án', 'Trạng thái', 'Giá chào', 'Diện tích', 'Phòng ngủ', 'Xác nhận lúc'; cả 60 dòng trong một lần cuộn, số dòng 1..60 không hở, không thanh chia trang, chân bảng '60 dòng'; cột số dòng, Căn, Toà được ghim đầu (trạng thái ghim của bảng); một ô giá dạng 'x,xx tỷ', một ô diện tích có 'm²', ô trạng thái là huy hiệu data-status đúng trạng thái; ca đối chứng xoá một dòng khỏi lần cuộn cho 'run broken at row <n>' và chèn lại thanh chia trang cho 'pager present'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.e2e
    paths: [src/modules/listings/ui/**, "src/app/(app)/inventory/**", src/components/candidate/**, tools/e2e_templates/**, tests/e2e/screens/screens.spec.ts]
    expected: "exit 0; trong báo cáo Playwright của tests/e2e/screens/screens.spec.ts, ở cả bốn khổ 360/414/1024/1440, mọi ca dưới 'man inventory › vung' (cho-tai, trong, tim-khong-ra, loi, mot-phan-hong, chu-dai, khong-du-quyen, tim) và mọi ca 'pha vung …' của chúng (gồm 'tim: chi con khung dau') ĐƯỢC CHẠY và xanh — không ca nào bị bỏ qua với lý do 'chua co vung du lieu'; bốn ca khung của inventory và các ca 'pha khung …' xanh; ca phá xanh nghĩa là chính hàm kiểm của ca chính đã ném đúng thông điệp ghim trên Bảng hàng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.man_mau
    paths: [tools/e2e_templates/**]
    expected: "exit 0; NO_REGION_YET không có khoá inventory và vẫn có khoá sent với lý do cũ; ca classifyGrid('inventory', {hasRegion:true}) với danh sách thật cho {run:true}; ca đối chứng với bản sao danh sách thêm lại inventory ném 'da co vung, go khoi danh sach: inventory'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.man_mau
    paths: [tools/e2e_templates/**, src/modules/listings/**, src/modules/catalog/**]
    expected: "exit 0; trong tools/e2e_templates: pickNeedle trên 60 dòng chữ dựng từ dữ liệu mẫu bằng chính inventoryRows với khung đầu bằng số dòng khung cuộn dựng sẵn (ca kiểm với 24 và 25) trả chuỗi khác null mà số dòng khớp lớn hơn khung đầu, nhỏ hơn 60 và có dòng ngoài khung đầu; pickNeedle(rows, 50) trả null; trên 120 dòng của đích hiệu chuẩn với cỡ 50 vẫn chọn như cũ; bài tìm trên trình duyệt đọc mọi dòng bằng lăn chuột qua khung cuộn; ca phá 'chi con khung dau' (khoá cuộn) và 'go mot dong khop' (ẩn dòng kết quả số 1) cho 'tim: bo sot dong khop'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.unit
    paths: ["src/app/(app)/inventory/**", src/modules/listings/ui/**, tests/inventory.test.tsx]
    expected: "exit 0; ma trận viết trước 6 tham số (loading, empty, error, partial, forbidden, lạ) × 2 môi trường (production, development) = 12 ô: production cho 'ready' ở cả 6, development cho đúng trạng thái ở 5 ô và 'ready' cho tham số lạ; bộ kiểm khẳng định hằng 12 viết trong tệp; ca đối chứng dùng bộ đọc bỏ qua môi trường và khẳng định thông điệp 'production honours state: loading' (ô đầu của ma trận)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.unit
    paths: [_acceptance/bang-hang-ban-doc/chung-minh-man.md, design/patterns/luoi.md, tools/proof_gate/**]
    expected: "exit 0; make test chạy python3 tools/proof_gate/check.py --root . và nó xanh với hợp đồng này đã implemented trở lên; mục '## Màn inventory' có ma trận mười một dòng (bảy 'đạt' trỏ tệp bài kiểm có thật, bốn 'không áp' có lý do) và bảng khối; design/patterns/luoi.md có dòng 'Màn: inventory' và không còn ngoại lệ trỏ src/app/(app)/inventory/page.tsx"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.unit
    paths: [tests/proof-matrix-self.test.ts, tools/proof_gate/**, design/states.md, _acceptance/bang-hang-ban-doc/**]
    expected: "exit 0; tests/proof-matrix-self.test.ts trên kho thật: số trạng thái lưới đọc được bằng đúng 11 và bằng số dòng bảng của design/states.md; hồ sơ bang-hang-ban-doc có trạng thái thuộc diện được chấm và lưới chấm mục '## Màn inventory'; trên bản sao kho xoá dòng 'Lỗi' khỏi ma trận của Bảng hàng thì check.py thoát khác 0 và in 'ma trận thiếu trạng thái 'Lỗi''; ca đối chứng làm design/states.md của bản sao không đọc được bảng thì bài tự kiểm ném 'bang trang thai rong' thay vì xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.unit
    paths: [ontology/labels.yaml, ontology/glossary.md, src/generated/**, tests/language.test.ts, src/modules/listings/ui/**]
    expected: "exit 0; tests/language.test.ts xanh với năm khái niệm mới (ListPrice, StandardStatus, LivingArea, BedroomsTotal mang reso; LastConfirmedAt mang own: true), nhãn ưu tiên duy nhất, có trong bảng thuật ngữ; ca 'does not hard-code labels' quét mọi tệp src/ kể cả tệp mới và xanh; make gen không làm đổi src/generated (make check gồm bước so tệp sinh)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    paths: [src/modules/listings/ui/**, "src/app/(app)/inventory/**", src/components/candidate/**]
    steps:
      - "Use the dev server at the URL given (lane K, port 3481); if it does not answer, start it from the repo root with PORT=3481 npm run dev (never port 3470, never while a suite command is running), note its PID and stop only that PID when done"
      - "Navigate {url}/inventory at 1440x900, light → screenshot evidence/inventory-1440-sang.png"
      - "Same page at 1440x900, dark (emulate prefers-color-scheme dark) → screenshot evidence/inventory-1440-toi.png"
      - "Navigate {url}/inventory at 1024x768, light → screenshot evidence/inventory-1024-sang.png"
      - "Same at 1024x768, dark → screenshot evidence/inventory-1024-toi.png"
      - "Navigate {url}/inventory at 414x896, light → screenshot evidence/inventory-414-sang.png"
      - "Same at 414x896, dark → screenshot evidence/inventory-414-toi.png"
      - "Navigate {url}/inventory at 360x800, light → screenshot evidence/inventory-360-sang.png"
      - "Same at 360x800, dark → screenshot evidence/inventory-360-toi.png"
      - "Navigate {url}/inventory at 1440x900, light, type Empire in the search box and wait for the rows to settle → screenshot evidence/inventory-1440-chu-dai.png (the long project name in the «Dự án» column ends in an ellipsis)"
    expected: "tám ảnh Bảng hàng trạng thái có dữ liệu trong App Shell: đầu màn 'Bảng hàng', khung vùng có tên 'Hàng', ô tìm có kính lúp và số dòng, cột số dòng rồi tám cột đọc được (Căn, Toà, Dự án, Trạng thái, Giá chào, Diện tích, Phòng ngủ, Xác nhận lúc), kẻ dọc giữa cột, chân bảng '60 dòng'; ở 1440 đủ tám cột không thanh cuộn ngang; ở 360/414 lưới cuộn ngang trong vùng còn trang không cuộn ngang; không chữ chồng chữ; nền và chữ đổi theo tối và vẫn đọc được"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E11
    criterion: AC-10
    executor: judgment
    inputs: [_acceptance/bang-hang-ban-doc/evidence/inventory-360-sang.png, _acceptance/bang-hang-ban-doc/evidence/inventory-360-toi.png, _acceptance/bang-hang-ban-doc/evidence/inventory-1440-sang.png, _acceptance/bang-hang-ban-doc/evidence/inventory-1440-toi.png, _acceptance/bang-hang-ban-doc/evidence/inventory-1440-chu-dai.png, _acceptance/bang-hang-ban-doc/design.md]
    question: "Bốn ảnh Bảng hàng (360 và 1440, sáng và tối) có cho thấy đúng những gì ảnh tĩnh thấy được theo mục Đặc tả UX của design.md không: đầu màn 'Bảng hàng', các đầu cột hiện ra đọc được, chữ không chồng nhau, tên khu dài bị cắt có dấu chấm lửng, và ảnh tối vẫn đủ tương phản để đọc? (Thứ tự tám cột và việc cuộn trong vùng do E2, E3 đo, không hỏi ở đây.)"
    evidence_required: [verdict, rationale]

  - id: E12
    criterion: AC-6
    executor: test
    cmd: config:executors.test.unit
    layer: backend-effect
    paths: ["src/app/(app)/inventory/**", src/modules/listings/**, src/modules/catalog/**, tests/inventory-page.test.tsx]
    expected: "exit 0; tests/inventory-page.test.tsx gọi CHÍNH hàm trang của src/app/(app)/inventory/page.tsx (không gọi bộ đọc thuần) với searchParams thật: ma trận viết trước 5 tham số × 2 môi trường (vi.stubEnv NODE_ENV production, development) = 10 ô, đọc trạng thái mà trang đưa vào InventoryGrid: production 'ready' ở cả 5, development đúng trạng thái; trang ở 'ready' đưa 60 dòng, và dòng của lần chào id 4d415500-0001-4000-8000-000000000001 mang Unit.livingArea và Unit.bedroomsTotal bằng của căn có upi bằng upi liên kết căn của lần chào ấy (tra từ dữ liệu nguồn, không chép số); ca đối chứng: bản trang đọc thẳng tham số bỏ qua môi trường cho thông điệp 'page honours state in production: error'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-11
    executor: test
    cmd: config:executors.test.unit
    paths: [src/components/candidate/column-kind.ts, src/components/candidate/data-region.tsx, tests/grid.test.tsx]
    expected: "exit 0; trong tests/grid.test.tsx khối 'content-fitted width of text columns': ma trận viết trước 5 ô (mã ngắn '0905' → 7ch, nhãn dài hơn giá trị → 10ch, chuỗi dài bị chặn ở độ dài đọc → 19ch, kể cả 1ch dư cho đệm thật; cột không giá trị giữ 18ch, kiểu không phải chữ giữ độ dài mẫu) khẳng định hằng 5; hai ca đối chứng: bộ tính bỏ chặn độ dài đọc cho 'fitted width: long text capped at reading length', luật cũ cho 'fitted width: short code'; vùng 60 dòng cỡ trang 25 giữ nguyên bề rộng mọi đầu cột sau khi gõ tìm và sau khi xoá tìm; ca đối chứng đo trên các dòng còn lại sau tìm cho 'width follows the shown rows: search'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
    criterion: AC-11
    executor: script
    cmd: config:executors.script.e2e
    paths: [src/components/candidate/**, src/modules/listings/ui/**, "src/app/(app)/inventory/**", tests/e2e/screens/inventory-width.spec.ts]
    expected: "exit 0; tests/e2e/screens/inventory-width.spec.ts ở khổ 1440 mở /inventory: tám đầu cột nằm trọn trong khung vùng và khung vùng không cuộn ngang (scrollWidth = clientWidth); ở 360 và 414 trang không cuộn ngang và bài in số cột thấy trọn; ca đối chứng nới cột Khu thêm 40ch bằng thẻ style trên trang thật và khẳng định thông điệp 'inventory 1440: columns hidden behind horizontal scroll'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-7
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/luoi.md", "src/app/(app)/inventory/**/*.tsx", "src/app/(app)/sent/**/*.tsx", "src/app/(app)/contacts/**/*.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm luoi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
