schema_version: 1
feature_slug: upgrade-design-assembly-tool
# Ma trận viết trước (dữ liệu ở rang/matrix.mjs, mọi phép đo đọc nó).
#   Commit nhánh được cắt ra (main, công cụ trước khi lên đời): b6f4f2934b4bdc5d0625755bb59efacb6448f284.
#   Commit lên đời: 158cf51, cha là commit trên.
#   Bản plugin (AC-2): design-assembly 0.1.0; mã cây thư mục công cụ ghi ở plugins/design-assembly/references/releases.json,
#     cột tool: 4f5d879929427743a4d10ea5aafc435afd0e1034, 27 tệp.
#     Dòng in: «tool: tools/design-assembly is the plugin's version 0.1.0, 27 files, tree 4f5d87992942; the stamp says the same»;
#     lệch → «tool: tools/design-assembly differs from the plugin's version 0.1.0: <k> files, tree <…>» ·
#     «tool: no stamp at design/tool-stamp.json» · «tool: the stamp says version <v>, not 0.1.0» ·
#     «tool: the stamp's tree <…> is not the tree of version 0.1.0».
#   Ba mục «dựng từ» được thêm (AC-3): Filters ← FiltersAdvanced; FiltersRow ← FilterChip, FiltersBuilder.
#     Dòng in: «register: 3 parts added (Filters: FiltersAdvanced; FiltersRow: FilterChip FiltersBuilder), nothing else
#     changed in 291 components»; lệch → «register: components added or removed: <tên …>» ·
#     «register: parts not added: <tên.phần …>» · «register: changed beyond the parts: <tên (trường)> …».
#   Tám tệp commit lên đời đổi (AC-4): design/component-registry.json, design/tool-stamp.json, và dưới tools/design-assembly/:
#     adapters/eslint.mjs, check.mjs, columns.mjs, components.mjs, lint.mjs, tokens.mjs.
#     Dòng in: «upgrade commit: changed exactly 8 files, the six tool files, the register and the stamp»; lệch →
#     «upgrade commit: changed outside the upgrade: <tệp …>» · «upgrade commit: not changed by the upgrade: <tệp …>».
#   Nguồn của mã cây ghim (AC-2): sổ phát hành plugins/design-assembly/references/releases.json ở commit
#     34a7938a84b9f5628bcf9e2f4fec2ee6a4a3dd77 của kho design-assembly, đọc ở ~/dev/design-assembly hoặc DESIGN_ASSEMBLY_REPO.
#     Dòng in: «release ledger: version 0.1.0 at 34a7938 names tool tree 4f5d87992942, the one pinned here»; lệch →
#     «release ledger: cannot read … at 34a7938 in <thư mục>» · «release ledger: version 0.1.0 names tool tree <…>, not
#     4f5d87992942» · «release ledger: no version 0.1.0 at 34a7938».
#   Cả nhánh (AC-6): tám tệp của AC-4 cộng tệp của hồ sơ (thư mục hồ sơ, _acceptance/config.yaml, design doc, kế hoạch,
#     wiki/log.md, PRODUCT-MAP.md, LO-TRINH.html).
#     Dòng in: «branch: <n> files changed, all of them the upgrade's or this record's»; lệch → «branch: changed outside the
#     upgrade and this record: <tệp …>»; sau khi gộp → «branch: nothing between main and HEAD to compare (merged already)».
#   Cặp hai chiều (measures-two-way.mjs), sáu bài, mười chín ca phá, mỗi ca một thông điệp ghim:
#     tool-tree — năm ca: thêm một byte vào check.mjs → «…: 27 files»; thêm một tệp → «…: 28 files»; dấu ghi 0.0.9;
#       dấu ghi mã cây toàn số 0; không có dấu;
#     register-gains-parts — bốn ca: sổ trước khi lên đời làm sổ sau → cả ba mục «parts not added»; hàng lọc mất bộ dựng
#       lọc → «parts not added: FiltersRow.FiltersBuilder»; ô lọc đổi level → «changed beyond the parts: FilterChip
#       (level)»; ô lọc bị bỏ → «components added or removed: FilterChip»;
#     lệnh kiểm sổ của công cụ — một ca: hàng lọc mất bộ dựng lọc → «design/component-registry.json is not what
#       src/components gives» và «FiltersRow differs»;
#     upgrade-changes — hai ca: danh sách có thêm design/theme.json; danh sách thiếu design/tool-stamp.json;
#     release-ledger — ba ca: thư mục không phải kho; sổ ghi mã cây khác; sổ không có bản 0.1.0;
#     branch-changes — hai ca đỏ: thêm design/tokens.json; thêm mk/design-assembly.mk; một ca danh sách rỗng in «merged already».
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: [tools/**, design/**, tests/**, src/components/**, mk/**]
    expected: "exit 0; đầu ra có dòng 'design-assembly: 17 decisions held by 20 checks, each seen failing on a changed copy' và dòng 'component manifest: design/component-registry.json is up to date (291 components)'. Chiều đỏ: E7 (sổ thiếu một mục «dựng từ» làm lệnh kiểm sổ của công cụ đỏ với 'design/component-registry.json is not what src/components gives' và 'FiltersRow differs')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.tool_is_release
    layer: backend-effect
    paths: [tools/design-assembly/**, design/tool-stamp.json, _acceptance/upgrade-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'tool: tools/design-assembly is the plugin's version 0.1.0, 27 files, tree 4f5d87992942; the stamp says the same', trong đó mã cây ghim là mã plugin ghi cho bản 0.1.0 ở cột tool của releases.json. Chiều đỏ: E6 (bản sao thêm một byte vào check.mjs → 'differs from the plugin's version 0.1.0: 27 files'; thêm một tệp → '28 files'; dấu ghi 0.0.9 → 'the stamp says version 0.0.9, not 0.1.0'; dấu ghi mã toàn số 0 → 'the stamp's tree 000000000000 is not the tree of version 0.1.0'; không dấu → 'no stamp at design/tool-stamp.json')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.register_gains_parts
    layer: backend-effect
    paths: [design/component-registry.json, _acceptance/upgrade-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'register: 3 parts added (Filters: FiltersAdvanced; FiltersRow: FilterChip FiltersBuilder), nothing else changed in 291 components'. Chiều đỏ: E7 (sổ trước khi lên đời → 'parts not added: Filters.FiltersAdvanced FiltersRow.FilterChip FiltersRow.FiltersBuilder'; hàng lọc mất bộ dựng lọc → 'parts not added: FiltersRow.FiltersBuilder'; ô lọc đổi level → 'changed beyond the parts: FilterChip (level)'; ô lọc bị bỏ → 'components added or removed: FilterChip')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.upgrade_changes
    layer: backend-effect
    paths: [design/**, tools/design-assembly/**, _acceptance/upgrade-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'upgrade commit: changed exactly 8 files, the six tool files, the register and the stamp'. Chiều đỏ: E8 (danh sách có thêm design/theme.json → 'changed outside the upgrade: design/theme.json'; danh sách thiếu dấu → 'not changed by the upgrade: design/tool-stamp.json')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.component_register
    layer: backend-effect
    paths: [design/component-registry.json, tests/design-registry.test.ts, tools/design-assembly/**]
    expected: "exit 0; mọi bài của tests/design-registry.test.ts đạt, 0 bài hỏng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-5
    executor: script
    cmd: config:executors.script.proof_gate_real
    layer: backend-effect
    paths: [tools/proof_gate/**, design/component-registry.json, design/so-khoi.yaml]
    expected: "exit 0; dòng 'proof-gate: mọi màn đang mở đã chứng minh đúng lối', chạy trên kho ở HEAD, đọc sổ linh kiện thật"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-2
    executor: script
    cmd: config:executors.script.upgrade_measures_two_way
    layer: backend-effect
    paths: [_acceptance/upgrade-design-assembly-tool/rang/**, tools/design-assembly/**, design/tool-stamp.json]
    expected: "exit 0; sáu bài đạt, 0 hỏng. Bài 'tool-tree' xanh trên kho và đỏ ở năm ca phá; bài 'release-ledger' xanh ở commit ghim và đỏ ở ba ca phá; mỗi ca một thông điệp ghim của ma trận đầu tệp"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-3
    executor: script
    cmd: config:executors.script.upgrade_measures_two_way
    layer: backend-effect
    paths: [_acceptance/upgrade-design-assembly-tool/rang/**, tools/design-assembly/**, design/component-registry.json]
    expected: "exit 0; bài 'register-gains-parts' xanh trên kho và đỏ ở bốn ca phá; bài lệnh kiểm sổ của công cụ xanh trên kho, đỏ khi hàng lọc mất bộ dựng lọc với 'is not what src/components gives' và 'FiltersRow differs'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-4
    executor: script
    cmd: config:executors.script.upgrade_measures_two_way
    layer: backend-effect
    paths: [_acceptance/upgrade-design-assembly-tool/rang/**]
    expected: "exit 0; bài 'upgrade-changes' xanh trên kho và đỏ ở hai ca phá: 'changed outside the upgrade: design/theme.json' và 'not changed by the upgrade: design/tool-stamp.json'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-2
    executor: script
    cmd: config:executors.script.release_ledger_matches
    layer: backend-effect
    paths: [_acceptance/upgrade-design-assembly-tool/rang/**]
    expected: "exit 0; dòng 'release ledger: version 0.1.0 at 34a7938 names tool tree 4f5d87992942, the one pinned here', đọc từ sổ phát hành của kho design-assembly ở commit ghim. Chiều đỏ: E6 (thư mục không phải kho → 'cannot read'; sổ ghi mã khác → 'names tool tree ffffffffffff, not 4f5d87992942'; sổ không có bản → 'no version 0.1.0 at 34a7938')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-6
    executor: script
    cmd: config:executors.script.branch_changes_only_upgrade
    layer: backend-effect
    paths: ["**"]
    expected: "exit 0; dòng 'branch: <n> files changed, all of them the upgrade's or this record's' với n lớn hơn 8, chạy trên nhánh trước khi gộp. Chiều đỏ: E12 (thêm design/tokens.json hoặc mk/design-assembly.mk → 'changed outside the upgrade and this record: <tệp>')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-6
    executor: script
    cmd: config:executors.script.upgrade_measures_two_way
    layer: backend-effect
    paths: [_acceptance/upgrade-design-assembly-tool/rang/**]
    expected: "exit 0; bài 'branch-changes' xanh trên kho, đỏ ở hai ca phá ('changed outside the upgrade and this record: design/tokens.json', '… mk/design-assembly.mk'), và danh sách rỗng in 'nothing between main and HEAD to compare (merged already)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
