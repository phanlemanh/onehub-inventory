<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canh cây công cụ sau khi gộp · tool-guard-choice</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · upgrade-design-assembly-tool</p>
    <h1>Canh cây công cụ sau khi gộp</h1>

    <svg viewBox="0 0 1264 504" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Connectors first (behind nodes) ===== -->

      <!-- Root → A (accent, machine's recommendation) -->
      <path d="M 280 192 L 296 192 Q 304 192 304 184 L 304 116 Q 304 108 312 108 L 328 108"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Root → B -->
      <path d="M 280 216 L 296 216 Q 304 216 304 224 L 304 292 Q 304 300 312 300 L 328 300"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- A → its two consequences -->
      <path d="M 568 96 L 584 96 Q 592 96 592 88 L 592 76 Q 592 68 600 68 L 616 68"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 568 120 L 584 120 Q 592 120 592 128 L 592 140 Q 592 148 600 148 L 616 148"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- B → its two consequences -->
      <path d="M 568 288 L 584 288 Q 592 288 592 280 L 592 268 Q 592 260 600 260 L 616 260"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 568 312 L 584 312 Q 592 312 592 320 L 592 332 Q 592 340 600 340 L 616 340"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- A consequences → A outcome -->
      <path d="M 896 68 L 912 68 Q 920 68 920 76 L 920 92 Q 920 100 928 100 L 944 100"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 896 148 L 912 148 Q 920 148 920 140 L 920 124 Q 920 116 928 116 L 944 116"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- B consequences → B outcome -->
      <path d="M 896 260 L 912 260 Q 920 260 920 268 L 920 280 Q 920 288 928 288 L 944 288"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 896 340 L 912 340 Q 920 340 920 332 L 920 320 Q 920 312 928 312 L 944 312"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===== Nodes ===== -->

      <!-- Root: the situation at merge -->
      <rect x="40" y="172" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="172" width="240" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="160" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sau khi gộp: kho chạy công cụ</text>
      <text x="160" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bản 0.1.0, có dấu phiên bản</text>

      <!-- Branch A (focal: machine's recommendation) -->
      <rect x="328" y="76" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="76" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="336" y="84" width="104" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="388" y="96" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A · MÁY KHUYÊN</text>
      <text x="448" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhận tới lần lên đời sau</text>

      <!-- Branch B -->
      <rect x="328" y="268" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="268" width="240" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="336" y="276" width="24" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="348" y="288" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">B</text>
      <text x="448" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chép bước cổng mới ngay</text>

      <!-- A consequence 1 -->
      <rect x="616" y="40" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="40" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="756" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng kiểm của kho</text>
      <text x="756" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không canh cây công cụ</text>

      <!-- A consequence 2 -->
      <rect x="616" y="120" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="120" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="756" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lệnh status và upgrade của plugin</text>
      <text x="756" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đọc dấu khi được gọi</text>

      <!-- B consequence 1 -->
      <rect x="616" y="232" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="232" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="756" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thay đổi thêm ở cổng kiểm</text>
      <text x="756" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">(vùng hạng cao nhất)</text>

      <!-- B consequence 2 -->
      <rect x="616" y="312" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="312" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="756" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thêm một tiêu chí,</text>
      <text x="756" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lượt chấm dài hơn</text>

      <!-- A outcome -->
      <rect x="944" y="80" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="944" y="80" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="1084" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bước cổng vào kho cùng bản</text>
      <text x="1084" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plugin biết ghi nó</text>

      <!-- B outcome -->
      <rect x="944" y="272" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="944" y="272" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="1084" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sửa tay một tệp công cụ</text>
      <text x="1084" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">làm cổng đỏ ngay</text>

      <!-- ===== Note line under the figure ===== -->
      <text x="40" y="412" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">AC-2 chứng minh cây công cụ đúng bản 0.1.0 tại lúc gộp, ở cả hai nhánh.</text>

      <!-- ===== Legend strip ===== -->
      <line x1="40" y1="440" x2="1224" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="40" y="476" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="64" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tình huống lúc gộp</text>

      <rect x="200" y="476" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="224" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>

      <rect x="360" y="476" width="16" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="384" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh còn lại</text>

      <rect x="504" y="476" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="528" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hệ quả của nhánh</text>

      <rect x="664" y="476" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="688" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm tới</text>
    </svg>
  </div>
</body>
</html>
