  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    paths: [src/components/candidate/record-panel.tsx, src/components/candidate/data-region.tsx, src/modules/listings/ui/**]
    steps:
      - "Use the dev server at the URL given (lane D, port 3483); if it does not answer, start it from the repo root with npx next dev -p 3483 -H 127.0.0.1 (never port 3470, never while a suite command is running), note its PID and stop only that PID when done"
      - "At 1440x900, light: open {url}/inventory, click the fifth unit code in the «Căn» column → screenshot evidence/ho-so-1440-sang.png"
      - "Same at 1440x900, dark (emulate prefers-color-scheme dark) → screenshot evidence/ho-so-1440-toi.png"
      - "Same at 1024x768, light → screenshot evidence/ho-so-1024-sang.png"
      - "Same at 1024x768, dark → screenshot evidence/ho-so-1024-toi.png"
      - "Same at 414x896, light → screenshot evidence/ho-so-414-sang.png"
      - "Same at 414x896, dark → screenshot evidence/ho-so-414-toi.png"
      - "Same at 360x800, light → screenshot evidence/ho-so-360-sang.png"
      - "Same at 360x800, dark → screenshot evidence/ho-so-360-toi.png"
    expected: "tám ảnh: ở 1440 và 1024 hồ sơ nổi trên phần phải các dòng, dưới thanh công cụ; thanh công cụ của bảng (ô tìm, số dòng) và thanh trên của App Shell không bị che, hồ sơ có tên «<mã căn> · <toà>», nút Trước, Sau, Đóng, thẻ căn (mã căn và giá một dòng, nơi và huy hiệu trạng thái, ba thông số) rồi tám trường; ở 414 và 360 hồ sơ phủ toàn màn, đầu là thẻ căn; không chữ chồng chữ; ảnh tối đọc được"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E11
    criterion: AC-10
    executor: judgment
    inputs: [_acceptance/ho-so-can/evidence/ho-so-1440-sang.png, _acceptance/ho-so-can/evidence/ho-so-1440-toi.png, _acceptance/ho-so-can/evidence/ho-so-1024-sang.png, _acceptance/ho-so-can/evidence/ho-so-360-sang.png, _acceptance/ho-so-can/evidence/ho-so-360-toi.png, _acceptance/ho-so-can/design.md]
    question: "Năm ảnh Bảng hàng có hồ sơ một căn đang mở có khớp mục «Đặc tả UX» và «Sống chung với hàng 2a» của design.md không: ở 1440 và 1024 hồ sơ nổi trên phần phải các dòng, ô tìm, số dòng và thanh trên không bị che, cột Căn và Toà còn thấy; ở 360 hồ sơ toàn màn, đầu là thẻ căn có mã căn, giá, nơi, trạng thái và ba thông số; chữ không chồng chữ và ảnh tối đọc được?"
    evidence_required: [verdict, rationale]

