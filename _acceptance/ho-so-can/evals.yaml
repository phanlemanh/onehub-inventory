  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.e2e
    paths: [src/components/candidate/record-panel.tsx, src/modules/listings/ui/**, tests/e2e/ho-so-can.spec.ts]
    expected: "exit 0; axe trên /inventory với hồ sơ một căn đang mở ở 1440 và 360, sáng và tối (4 lượt quét, đếm trong tệp), không vi phạm mức serious hay critical; ca đối chứng bỏ tên của hộp hồ sơ (gỡ aria-labelledby) cho thông điệp axe có mã 'aria-dialog-name'"
