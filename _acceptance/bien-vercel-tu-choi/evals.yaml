schema_version: 1
feature_slug: bien-vercel-tu-choi
# Kế hoạch đo, viết trước khi viết mã.
#
# Tên ca: mỗi ca của tools/deploy/deploy.test.ts mang tiền tố đúng mã eval của nó (vd «E1 · staging · ...»), để đầu ra
# của vitest gọi tên được từng ô.
#
# Máy giả: máy API Vercel giả trong tools/deploy/deploy.test.ts nhận câu trả lời theo ô cho từng lời gọi (ctx.vercelReply:
# get, post — mỗi lời gọi một trạng thái và một thân, thân là đối tượng hay chuỗi thô). Mặc định là khuôn tài liệu Vercel:
# lần đọc 200 `{ envs: [...] }`, lần ghi 201 `{ created: [sáu đối tượng {key,type,value,target} chép từ thân gửi],
# failed: [] }`. Ca đỏ và ca xanh dùng chung máy giả, mỗi ca đỏ chỉ đổi một ô. Máy giả ghi lại thân nó đã trả
# (ctx.served) để ca E2 đo được đối chứng nguồn.
#
# Ma trận ô (mỗi ô × staging, production; mọi ô đỏ: đúng một dòng ĐỎ, rồi «DỪNG ở bien — tên miền không đổi», thoát khác
# 0, 0 lần gọi vercel, tên miền vẫn dpl_cu; không ô nào để giá trị bí mật ở dòng in — expectNoMarker).
# Mọi ô E1, E2: created đủ sáu (điều kiện chung), chỉ failed đổi.
#   E1-a  failed: AUTH_SECRET (key, code ENV_CONFLICT), RESEND_API_KEY (key, không code)
#           → «Vercel từ chối ghi biến AUTH_SECRET (ENV_CONFLICT), RESEND_API_KEY»
#   E1-b  failed: RESEND_API_KEY chỉ có envVarKey             → «Vercel từ chối ghi biến RESEND_API_KEY»
#   E1-c  failed: AUTH_SECRET, mục không tên, RESEND_API_KEY   → «Vercel từ chối ghi biến AUTH_SECRET, không rõ tên, RESEND_API_KEY»
#   E1-d  failed: AUTH_SECRET hai lần                          → «Vercel từ chối ghi biến AUTH_SECRET»
#   E1-e  failed: AUTH_SECRET với code «bad code; x»           → «Vercel từ chối ghi biến AUTH_SECRET» (mã lạ khuôn không in)
#   E2    failed: AUTH_SECRET, RESEND_API_KEY, DATABASE_URL, mỗi mục value = giá trị gửi, message chứa giá trị
#           → «Vercel từ chối ghi biến AUTH_SECRET, RESEND_API_KEY, DATABASE_URL»
#   E3 — theo Hỏi-2:
#     «đủ sáu» (khuyến nghị): năm ô đỏ
#       created thiếu DATABASE_URL, APP_ENV  → «Vercel không xác nhận đã ghi biến DATABASE_URL, APP_ENV»
#       created [] · không có created · created là đối tượng không key · thân không phải JSON
#                                            → «Vercel không xác nhận đã ghi biến DATABASE_URL, AUTH_SECRET, RESEND_API_KEY,
#                                               MAIL_FROM, APP_URL, APP_ENV»
#     «câu đề»: bốn ô sau đỏ như trên; ô «thiếu DATABASE_URL, APP_ENV» là ca «bien đạt».
#   E4 — theo Hỏi-1:
#     «gộp» (khuyến nghị): lần đọc là đối tượng biến đơn · envs không phải mảng · thân không phải JSON
#                                            → «Vercel trả danh sách biến không đúng khuôn», 0 lần POST
#     «không gộp»: E4 bị bỏ khỏi tệp này cùng AC-4.
#
# Chiều đỏ của hàm đo:
#   - E2: hàm thuần markerLeak (expectNoMarker gọi nó) chạy trên đầu ra và calls.log của ca E2 đã nối
#     «moc-bi-mat-AUTH_SECRET» → trả «giá trị của AUTH_SECRET lộ ra». Đối chứng nguồn: thân máy giả đã trả (ctx.served)
#     chứa «moc-bi-mat-AUTH_SECRET» ở cả error.value và error.message.
#   - E6: hàm thuần soTayFindings chạy trên nội dung thật của sổ tay đã bỏ một hàng → trả «sổ tay thiếu hàng bien: <lý do>».
#     Đối chứng dương: nội dung thật → [].
#   - Mã: mỗi ô đỏ của E1/E3/E4 có ca xanh E5 trên cùng máy giả; tháo phép kiểm khỏi bản sao len-ban.mjs thì ô đỏ thôi đỏ
#     (lượt phá-thử của task, ghi trong plan).
#
# Giới hạn đã khai của bằng chứng: máy giả chép sáu biến vào created theo tài liệu; chưa có câu trả lời thật của Vercel cho
# lần ghi đè, nên E5 không chứng được luật «đủ sáu» không đỏ nhầm trên Vercel thật (Hỏi-2).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.deploy_kiem
    layer: backend-effect
    paths: ["tools/deploy/len-ban.mjs", "tools/deploy/deploy.test.ts"]
    expected: >-
      exit 0. Có mười ca «E1 ·»: năm ô E1-a…E1-e × hai môi trường, theo ma trận ở đầu tệp. Mỗi ca: đúng dòng
      «deploy <ENV>: bien ĐỎ — <lý do>» như ma trận (so cả chuỗi), dòng cuối
      «deploy <ENV>: DỪNG ở bien — tên miền không đổi», thoát khác 0, đúng một GET và một POST tới máy API giả, 0 lần gọi
      vercel (r.vercel rỗng), tên miền vẫn dpl_cu.
      Chiều đỏ: ca E5 cùng máy giả với failed rỗng → «bien đạt».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.deploy_kiem
    layer: backend-effect
    paths: ["tools/deploy/len-ban.mjs", "tools/deploy/deploy.test.ts"]
    expected: >-
      exit 0. Có hai ca «E2 ·» (hai môi trường) và một ca «E2 · chiều đỏ». Ca môi trường: thân máy giả đã trả chứa
      «moc-bi-mat-AUTH_SECRET» ở error.value và ở error.message (đối chứng nguồn); dòng đỏ đúng
      «Vercel từ chối ghi biến AUTH_SECRET, RESEND_API_KEY, DATABASE_URL»; markerLeak trên đầu ra chuẩn, đầu ra lỗi và
      calls.log trả null.
      Chiều đỏ: cùng đầu ra và calls.log, nối «moc-bi-mat-AUTH_SECRET» → markerLeak trả «giá trị của AUTH_SECRET lộ ra».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.deploy_kiem
    layer: backend-effect
    paths: ["tools/deploy/len-ban.mjs", "tools/deploy/deploy.test.ts"]
    expected: >-
      exit 0. Theo câu trả lời của Hỏi-2 ghi trong decisions.jsonl:
      «đủ sáu» — mười ca «E3 ·» (năm ô × hai môi trường), mỗi ca đúng dòng
      «deploy <ENV>: bien ĐỎ — Vercel không xác nhận đã ghi biến <tên>» như ma trận, tên theo thứ tự DATABASE_URL,
      AUTH_SECRET, RESEND_API_KEY, MAIL_FROM, APP_URL, APP_ENV;
      «câu đề» — tám ca đỏ (bốn ô × hai môi trường) như trên, và hai ca «E3 ·» thiếu hai biến → «bien đạt».
      Mọi ca đỏ dừng như E1, 0 lần gọi vercel, tên miền vẫn dpl_cu.
      Chiều đỏ: ca E5 cùng máy giả với created đủ sáu → «bien đạt».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.deploy_kiem
    layer: backend-effect
    paths: ["tools/deploy/len-ban.mjs", "tools/deploy/deploy.test.ts"]
    expected: >-
      exit 0. Có sáu ca «E4 ·», ba ô × hai môi trường. Mỗi ca: đúng dòng
      «deploy <ENV>: bien ĐỎ — Vercel trả danh sách biến không đúng khuôn», dòng cuối «DỪNG ở bien — tên miền không đổi»,
      đúng một GET và 0 POST tới máy API giả, 0 lần gọi vercel, tên miền vẫn dpl_cu.
      Chiều đỏ: ca E5 cùng máy giả với envs là mảng → «bien đạt». (Eval này chỉ có khi Hỏi-1 trả «gộp».)
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.deploy_kiem
    layer: backend-effect
    paths: ["tools/deploy/len-ban.mjs", "tools/deploy/deploy.test.ts", "tools/deploy/kiem-nhanh.mjs"]
    expected: >-
      exit 0. Có hai ca «E5 ·» (hai môi trường): máy giả mặc định trả lần ghi 201 với created sáu đối tượng
      {key,type,value,target} và failed rỗng; lệnh in «bien đạt» và chín dòng đạt tới «xong <commit>» (expectGreen).
      Không ca nào của tệp còn để máy giả trả «{"created":[]}» cho lần ghi trong đường xanh. Mọi ca khác của
      tools/deploy (xanh, ma trận bước đỏ, lùi bản, rollback, smoke, dat-khoa) vẫn pass: vitest báo 0 failed.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.deploy_kiem
    layer: backend-effect
    paths: ["docs/van-hanh/dua-ban-len.md", "tools/deploy/deploy.test.ts", "tools/deploy/len-ban.mjs"]
    expected: >-
      exit 0. Ca «E6 ·» pass: soTayFindings trên docs/van-hanh/dua-ban-len.md trả [] — mục «Đỏ thì làm gì» có hàng bắt
      đầu «| `bien`» chứa từng lý do «Vercel từ chối ghi biến <tên>», «Vercel không xác nhận đã ghi biến <tên>», và (khi
      Hỏi-1 trả «gộp») «Vercel trả danh sách biến không đúng khuôn». Chiều đỏ: cùng nội dung tệp, bỏ hàng «Vercel từ chối
      ghi biến» → soTayFindings trả đúng [«sổ tay thiếu hàng bien: Vercel từ chối ghi biến <tên>»].
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6b
    criterion: AC-6
    executor: judgment
    inputs: ["docs/van-hanh/dua-ban-len.md", "_acceptance/bien-vercel-tu-choi/contract.md"]
    question: >-
      Đọc mục «Đỏ thì làm gì» của docs/van-hanh/dua-ban-len.md như một người vận hành chưa biết kho, với contract.md làm ý
      định. (1) Mỗi hàng `bien` mới (Vercel từ chối ghi biến · Vercel không xác nhận đã ghi biến · Vercel trả danh sách biến
      không đúng khuôn, hàng cuối chỉ khi hợp đồng còn AC-4) có nói việc cần làm tiếp không, và có nói bản chưa dựng, tên
      miền không đổi không? (2) Có hàng mới nào bảo người vận hành in, dán hay gửi giá trị của một khoá không? (3) Có hàng
      mới nào bảo xoá hay sửa biến trên Vercel không? (4) Lời có theo tiếng của người vận hành, không có tên hàm hay tên
      trường JSON nào ngoài chính dòng đỏ không?
    evidence_required: [run_id, verifier, verified_at, verdict, rationale]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.check
    layer: backend-effect
    expected: exit 0.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
