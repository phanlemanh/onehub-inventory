<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Bước bien đọc câu trả lời của Vercel</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;background:#f5f5f5;color:#2d3142;font-family:'Geist',system-ui,sans-serif}
.frame{width:100%;max-width:1100px}
.eyebrow{margin-bottom:.5rem;color:#4f5d75;font:500 .66rem 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase}

<body>
<main class="frame">
<p class="eyebrow">Sơ đồ luồng · bien-vercel-tu-choi</p>
<h1>Bước bien đọc câu trả lời của Vercel</h1>
<svg viewBox="0 0 1040 992" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Bước bien đọc câu trả lời của Vercel</title>
<desc id="d">Luồng chính đi từ đọc danh sách biến, qua bốn câu hỏi, tới dựng bản. Mỗi nhánh đỏ dẫn tới một nút chung: dừng, bản chưa dựng, tên miền không đổi. Hỏi-1 và Hỏi-2 chờ chủ kho.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- ===== connectors (drawn first) ===== -->
<!-- main column -->
<path d="M340 88 V120" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<path d="M340 216 V256" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<path d="M340 352 V392" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

<path d="M340 576 V616" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<path d="M340 712 V752" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<path d="M340 800 V840" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<!-- red branches: question -> red node -->
<path d="M452 168 H560" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
<path d="M452 304 H560" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
<path d="M452 528 H560" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
<path d="M452 664 H560" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
<!-- red node -> DỪNG -->
<path d="M800 168 H856" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>

<path d="M800 528 H856" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
<path d="M800 664 H856" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>

<!-- ===== branch labels (masked, 8px gap) ===== -->
<!-- right exits: label above the line -->
<rect x="484" y="140" width="44" height="20" rx="2" fill="#f5f5f5"/>
<text x="506" y="154" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">không</text>
<rect x="492" y="276" width="28" height="20" rx="2" fill="#f5f5f5"/>
<text x="506" y="290" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">có</text>
<rect x="492" y="500" width="28" height="20" rx="2" fill="#f5f5f5"/>
<text x="506" y="514" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">có</text>
<rect x="484" y="636" width="44" height="20" rx="2" fill="#f5f5f5"/>
<text x="506" y="650" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">thiếu</text>
<!-- down exits: label to the right of the line -->
<rect x="348" y="224" width="28" height="20" rx="2" fill="#f5f5f5"/>
<text x="352" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">có</text>
<rect x="348" y="360" width="44" height="20" rx="2" fill="#f5f5f5"/>
<text x="352" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">không</text>
<rect x="348" y="584" width="44" height="20" rx="2" fill="#f5f5f5"/>
<text x="352" y="598" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">không</text>
<rect x="348" y="720" width="28" height="20" rx="2" fill="#f5f5f5"/>
<text x="352" y="734" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">đủ</text>

<!-- ===== main column nodes ===== -->
<!-- step: read -->
<rect x="220" y="40" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="220" y="40" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc danh sách biến của Vercel</text>

<!-- Hỏi-1: Có danh sách biến? -->
<polygon points="340,120 452,168 340,216 228,168" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="340" y="156" fill="#2e5aa8" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
<text x="340" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có danh sách biến?</text>

<!-- Có biến cấm? -->
<polygon points="340,256 452,304 340,352 228,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có biến cấm?</text>

<!-- step: write -->
<rect x="220" y="392" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="220" y="392" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi sáu biến</text>

<polygon points="340,480 452,528 340,576 228,528" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel từ chối biến nào?</text>

<!-- Hỏi-2: Vercel xác nhận đủ sáu? -->
<polygon points="340,616 452,664 340,712 228,664" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="340" y="652" fill="#2e5aa8" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2</text>
<text x="340" y="672" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel xác nhận đủ sáu?</text>

<!-- step: bien đạt -->
<rect x="220" y="752" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="220" y="752" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="780" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bien đạt</text>

<!-- end: Dựng bản -->
<rect x="260" y="840" width="160" height="48" rx="24" fill="#f5f5f5"/>
<rect x="260" y="840" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="340" y="868" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dựng bản</text>

<!-- ===== red nodes ===== -->
<rect x="560" y="140" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="560" y="140" width="240" height="56" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.60)" stroke-width="1"/>
<text x="680" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">danh sách biến không đúng khuôn</text>
<text x="680" y="182" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">0 lần ghi</text>

<rect x="560" y="280" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="560" y="280" width="240" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.60)" stroke-width="1"/>
<text x="680" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">biến cấm &lt;tên&gt;</text>

<rect x="560" y="504" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="560" y="504" width="240" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.60)" stroke-width="1"/>
<text x="680" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">từ chối ghi biến &lt;tên&gt; (&lt;mã&gt;)</text>

<rect x="560" y="640" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="560" y="640" width="240" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.60)" stroke-width="1"/>
<text x="680" y="668" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không xác nhận đã ghi biến &lt;tên&gt;</text>

<!-- ===== shared stop node (focal) ===== -->
<rect x="856" y="136" width="144" height="560" rx="8" fill="#f5f5f5"/>
<rect x="856" y="136" width="144" height="560" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="928" y="396" fill="#ba4513" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" letter-spacing="0.04em">DỪNG</text>
<text x="928" y="420" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">bản chưa dựng,</text>
<text x="928" y="436" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">tên miền không đổi</text>

<!-- ===== callout beside Hỏi-2 ===== -->
<text x="196" y="628" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">chưa có câu trả lời</text>
<text x="196" y="648" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">thật của Vercel —</text>
<text x="196" y="668" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">ca xanh không</text>
<text x="196" y="688" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">chứng được</text>

<circle cx="228" cy="664" r="2" fill="#2d3142"/>

<!-- ===== legend ===== -->
<line x1="40" y1="920" x2="1000" y2="920" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="40" y="940" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

<rect x="40" y="956" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="72" y="966" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

<polygon points="132,962 144,956 156,962 144,968" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="164" y="966" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi của bước</text>

<polygon points="276,962 288,956 300,962 288,968" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="308" y="966" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hỏi-1, Hỏi-2: chờ chủ kho</text>

<line x1="460" y1="962" x2="488" y2="962" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<rect x="644" y="956" width="24" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.60)" stroke-width="1"/>
<text x="676" y="966" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lý do đỏ</text>

<text x="792" y="966" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Luồng chính</text>
</svg>
</main>
