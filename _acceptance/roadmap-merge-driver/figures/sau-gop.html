<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K1: sau mỗi lần gộp nhánh chính</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      border-top: 1px solid rgba(45,49,66,0.12);
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">K1 · Flowchart · AC-1 · AC-2 · AC-3 · AC-4</p>
    <h1>Gộp nhánh chính vào nhánh PR khi hai bên cùng vẽ lại LO-TRINH.html</h1>

    <svg viewBox="0 0 960 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowchart: việc phải làm sau mỗi lần gộp nhánh chính vào nhánh PR">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="664" fill="#f5f5f5"/>

      <!-- Connectors first, so nodes sit above them -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2">
        <!-- start → decision -->
        <line x1="280" y1="88" x2="280" y2="112" marker-end="url(#arrow)"/>
        <!-- decision «có» → clean merge -->
        <line x1="280" y1="224" x2="280" y2="264" marker-end="url(#arrow)"/>
        <!-- clean merge → redraw -->
        <line x1="280" y1="312" x2="280" y2="344" marker-end="url(#arrow)"/>
        <!-- redraw → commit -->
        <line x1="280" y1="400" x2="280" y2="432" marker-end="url(#arrow)"/>
        <!-- decision «chưa» → conflict -->
        <line x1="400" y1="168" x2="600" y2="168" marker-end="url(#arrow)"/>
        <!-- conflict → set up, merge again -->
        <line x1="720" y1="196" x2="720" y2="264" marker-end="url(#arrow)"/>
      </g>
      <!-- commit → check green (the destination) -->
      <line x1="280" y1="480" x2="280" y2="512" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Branch labels -->
      <rect x="288" y="236" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="300" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="480" y="146" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CHƯA</text>

      <!-- Start (oval) -->
      <rect x="160" y="32" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="160" y="32" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="280" y="56" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">git merge origin/main</text>
      <text x="280" y="74" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hai bên cùng vẽ lại LO-TRINH.html</text>

      <!-- Decision (diamond) -->
      <polygon points="280,112 400,168 280,224 160,168" fill="#f5f5f5"/>
      <polygon points="280,112 400,168 280,224 160,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản kéo có driver?</text>
      <text x="280" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đã chạy make setup</text>

      <!-- «có» 1: clean merge -->
      <rect x="160" y="264" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="264" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gộp sạch, giữ trang của nhánh</text>

      <!-- «có» 2: redraw -->
      <rect x="160" y="344" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="344" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vẽ lại</text>
      <text x="280" y="386" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">product-map.mjs --root .</text>

      <!-- «có» 3: commit -->
      <rect x="160" y="432" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="432" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit</text>

      <!-- «có» 4: check green (end oval, focal) -->
      <rect x="160" y="512" width="240" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="160" y="512" width="240" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="280" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">product-map --check</tspan> xanh</text>

      <!-- «chưa» 1: conflict -->
      <rect x="600" y="140" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="140" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Xung đột ở <tspan font-family="'Geist Mono', monospace" font-weight="500">LO-TRINH.html</tspan></text>
      <text x="720" y="182" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">như hôm nay</text>

      <!-- «chưa» 2: set up, merge again (end oval) -->
      <rect x="600" y="264" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="600" y="264" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="720" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace" font-weight="500">make setup</tspan> rồi gộp lại</text>

      <!-- Margin notes -->
      <line x1="600" y1="368" x2="600" y2="476" stroke="#bfc0c0" stroke-width="1"/>
      <text x="616" y="380" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GHI CHÚ BÊN LỀ</text>
      <text x="616" y="408" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Trang PR trên GitHub vẫn báo xung đột:</text>
      <text x="616" y="428" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">GitHub không chạy driver của máy.</text>
      <text x="616" y="464" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Lời dạy nằm ở <tspan font-family="'Geist Mono', monospace" font-style="normal" font-size="11">docs/START-HERE.md</tspan>.</text>

      <!-- Legend: horizontal strip at the bottom -->
      <line x1="40" y1="600" x2="920" y2="600" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="40" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <text x="920" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TIÊU CHÍ · AC-1 · AC-2 · AC-3 · AC-4</text>

      <rect x="40" y="632" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="642" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <rect x="208" y="632" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="642" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="312,638 324,632 336,638 324,644" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="642" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <rect x="440" y="632" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="472" y="642" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Đích của nhánh «có»</text>
    </svg>

    <p class="colophon">roadmap-merge-driver · Cổng Phạm vi · dòng sổ 3, 4 · sau-gop</p>
  </div>
</body>
</html>
