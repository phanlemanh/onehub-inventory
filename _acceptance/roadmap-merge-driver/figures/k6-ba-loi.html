<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2: K6 đi lối nào</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      border-top: 1px solid rgba(45,49,66,0.12);
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-2 · Ba lối song song · AC-6</p>
    <h1>K6 đi cùng vòng này, tách vòng, hay chủ kho tự áp?</h1>

    <svg viewBox="0 0 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ba lối song song cho Hỏi-2: K6 đi cùng vòng này, tách vòng riêng, hay chủ kho tự áp">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="544" fill="#f5f5f5"/>

      <!-- Connectors first: the question drops into each lane -->
      <line x1="176" y1="104" x2="176" y2="144" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="480" y1="104" x2="480" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="784" y1="104" x2="784" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- The question -->
      <rect x="40" y="32" width="880" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="32" width="880" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="52" y="44" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="76" y="56" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2</text>
      <text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đưa <tspan font-family="'Geist Mono', monospace" font-weight="500">_acceptance/**/rang/**</tspan> ra khỏi phạm vi quét CodeQL</text>
      <text x="480" y="84" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">bằng bốn dòng trong <tspan font-family="'Geist Mono', monospace" font-size="9">.github/workflows/security.yml</tspan></text>

      <!-- Lane A: recommended by the machine (focal) -->
      <rect x="40" y="144" width="272" height="216" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="144" width="272" height="216" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="56" y="156" width="132" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="122" y="168" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI A · MÁY KHUYÊN</text>
      <text x="56" y="204" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Đi cùng vòng này</text>
      <line x1="56" y1="224" x2="296" y2="224" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="56" y="244" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">máy áp đúng bản vá chủ kho duyệt</text>
      <line x1="56" y1="256" x2="296" y2="256" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="56" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">1 PR</text>
      <line x1="56" y1="288" x2="296" y2="288" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="56" y="308" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">2 lượt chạy trọn bộ kiểm</text>
      <line x1="56" y1="320" x2="296" y2="320" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="56" y="340" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist Mono', monospace">AC-6</text>

      <!-- Lane B -->
      <rect x="344" y="144" width="272" height="216" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="144" width="272" height="216" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="360" y="156" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="384" y="168" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI B</text>
      <text x="360" y="204" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Tách vòng riêng</text>
      <line x1="360" y1="224" x2="600" y2="224" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="360" y="244" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">2 PR</text>
      <line x1="360" y1="256" x2="600" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="360" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">4 lượt chạy trọn bộ kiểm</text>
      <line x1="360" y1="288" x2="600" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="360" y="308" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">thêm 1 lượt duyệt</text>

      <!-- Lane C -->
      <rect x="648" y="144" width="272" height="216" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="144" width="272" height="216" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="664" y="156" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="688" y="168" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI C</text>
      <text x="664" y="204" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Chủ kho tự áp</text>
      <line x1="664" y1="224" x2="904" y2="224" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="664" y="244" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">chủ kho commit bốn dòng</text>
      <line x1="664" y1="256" x2="904" y2="256" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="664" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">máy chỉ đo</text>

      <!-- Common to all three lanes -->
      <rect x="40" y="400" width="880" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="400" width="880" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cả ba lối: bốn cảnh báo chỉ đóng ở lần quét kế trên <tspan font-family="'Geist Mono', monospace" font-weight="500">main</tspan></text>

      <!-- Legend: horizontal strip at the bottom -->
      <line x1="40" y1="480" x2="920" y2="480" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="40" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="40" y="512" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="72" y="522" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Lối máy khuyên</text>

      <rect x="200" y="512" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="522" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Câu hỏi · lối khác</text>

      <rect x="376" y="512" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="408" y="522" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Chung cho cả ba lối</text>
    </svg>

    <p class="colophon">roadmap-merge-driver · Cổng Phạm vi · dòng sổ 7 · k6-ba-loi</p>
  </div>
</body>
</html>
