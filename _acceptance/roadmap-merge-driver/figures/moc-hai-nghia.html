<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1: «mốc» là mốc nào</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      border-top: 1px solid rgba(45,49,66,0.12);
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · Hai lối cạnh nhau · AC-5</p>
    <h1>«Mốc» là mốc của kit hay bản minor của repo-setup?</h1>

    <svg viewBox="0 0 960 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hai lối cạnh nhau cho Hỏi-1: mốc là mốc của kit nghiệm thu hay bản minor của repo-setup">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="472" fill="#f5f5f5"/>

      <!-- Connectors first: the question drops into each lane -->
      <line x1="252" y1="104" x2="252" y2="144" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="708" y1="104" x2="708" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- The question -->
      <rect x="40" y="32" width="880" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="32" width="880" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="52" y="44" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="76" y="56" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
      <text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«gom theo mốc, trừ bản vá chữa lỗi kho đang vấp»</text>
      <text x="480" y="84" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mốc là gì?</text>

      <!-- Lane A: recommended by the machine (focal) -->
      <rect x="40" y="144" width="424" height="144" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="144" width="424" height="144" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="56" y="156" width="132" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="122" y="168" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI A · MÁY KHUYÊN</text>
      <text x="56" y="204" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Mốc của kit nghiệm thu (3.1, 3.2…)</text>
      <line x1="56" y1="224" x2="448" y2="224" stroke="rgba(235,108,54,0.30)" stroke-width="0.8"/>
      <text x="56" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">một vòng nâng repo-setup đi cùng dịp kho nhận mốc kit,</text>
      <text x="56" y="268" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">lấy bản mới nhất lúc đó</text>

      <!-- Lane B -->
      <rect x="496" y="144" width="424" height="144" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="144" width="424" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="512" y="156" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="536" y="168" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI B</text>
      <text x="512" y="204" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Bản minor của repo-setup (0.11.0, 0.12.0…)</text>
      <line x1="512" y1="224" x2="904" y2="224" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="512" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">nhịp theo công cụ, có thể dày hơn</text>

      <!-- Common to both lanes -->
      <rect x="40" y="328" width="880" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="328" width="880" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chung cho cả hai: bản vá chữa lỗi kho đang vấp thì nâng ngay</text>

      <!-- Legend: horizontal strip at the bottom -->
      <line x1="40" y1="408" x2="920" y2="408" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="40" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <text x="920" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TIÊU CHÍ · AC-5</text>

      <rect x="40" y="440" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="72" y="450" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Lối máy khuyên</text>

      <rect x="200" y="440" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="232" y="450" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Câu hỏi · lối khác</text>

      <rect x="376" y="440" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="408" y="450" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Chung cho cả hai lối</text>
    </svg>

    <p class="colophon">roadmap-merge-driver · Cổng Phạm vi · dòng sổ 6 · moc-hai-nghia</p>
  </div>
</body>
</html>
