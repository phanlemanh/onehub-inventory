<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ nào phải có khối Vai × Màn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.25;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · phan-loai-ho-so</p>
    <h1>Hồ sơ nào phải có khối Vai × Màn</h1>

    <svg viewBox="0 0 1280 784" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', system-ui, sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (behind nodes) ===== -->
      <g stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
        <line x1="480" y1="64" x2="480" y2="96"/>     <!-- start → D1 -->
        <line x1="304" y1="148" x2="256" y2="148"/>   <!-- D1 không → L1 -->
        <line x1="480" y1="200" x2="480" y2="244"/>   <!-- D1 có → D2 -->
        <line x1="620" y1="288" x2="704" y2="288"/>   <!-- D2 không → D3 -->
        <line x1="1016" y1="288" x2="1048" y2="288"/> <!-- D3 có → L2 -->
        <line x1="860" y1="340" x2="860" y2="376"/>   <!-- D3 không → L3 -->
        <line x1="480" y1="332" x2="480" y2="468"/>   <!-- D2 có mục → D4 -->
        <line x1="592" y1="512" x2="760" y2="512"/>   <!-- D4 có → D5 -->
        <line x1="960" y1="512" x2="1048" y2="512"/>  <!-- D5 có → L4 -->
        <line x1="860" y1="556" x2="860" y2="600"/>   <!-- D5 không → L5 -->
        <line x1="480" y1="556" x2="480" y2="600"/>   <!-- D4 không rỗng → step -->
        <line x1="320" y1="628" x2="272" y2="628"/>   <!-- step → L6 -->
        <line x1="480" y1="656" x2="480" y2="704"/>   <!-- step → L7 -->
      </g>

      <!-- ===== Arrow labels (masked, 8px gap from stroke) ===== -->
      <g font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#636b80" text-anchor="middle" letter-spacing="0.06em">
        <rect x="260" y="124" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="280" y="136">không</text>

        <rect x="488" y="212" width="20" height="16" rx="2" fill="#f5f5f5"/>
        <text x="498" y="224">có</text>

        <rect x="640" y="264" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="662" y="276">không</text>

        <rect x="1020" y="264" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1032" y="276">có</text>

        <rect x="868" y="348" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="888" y="360">không</text>

        <rect x="488" y="392" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="512" y="404">có mục</text>

        <rect x="664" y="488" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="676" y="500">có</text>

        <rect x="992" y="488" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1004" y="500">có</text>

        <rect x="868" y="568" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="888" y="580">không</text>

        <rect x="488" y="568" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="522" y="580">không rỗng</text>
      </g>

      <!-- ===== Nodes ===== -->
      <g font-size="12" text-anchor="middle">

        <!-- Start -->
        <rect x="368" y="24" width="224" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="368" y="24" width="224" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="48" fill="#2d3142" font-weight="600">Hồ sơ trong _acceptance</text>

        <!-- D1 -->
        <polygon points="480,96 656,148 480,200 304,148" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="144" fill="#2d3142" font-weight="600">surfaces có ui/web/web-ui,</text>
        <text x="480" y="160" fill="#2d3142" font-weight="600">hoặc khai screens?</text>

        <!-- L1 -->
        <rect x="32" y="120" width="224" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="32" y="120" width="224" height="56" rx="20" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="144" y="144" fill="#2d3142" font-weight="600">Không đòi khối</text>
        <text x="144" y="160" fill="#4f5d75">(không đếm vào vòng chạm màn)</text>

        <!-- D2 -->
        <polygon points="480,244 620,288 480,332 340,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="292" fill="#2d3142" font-weight="600">Có mục ## Vai × Màn?</text>

        <!-- D3 -->
        <polygon points="860,236 1016,288 860,340 704,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="860" y="284" fill="#2d3142" font-weight="600">Đã đóng</text>
        <text x="860" y="300" fill="#2d3142" font-weight="600">(signed-off, machine-cleared)?</text>

        <!-- L2 -->
        <rect x="1048" y="264" width="216" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="1048" y="264" width="216" height="48" rx="20" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="1156" y="292" fill="#2d3142" font-weight="600">Trước khối: xanh, đếm riêng</text>

        <!-- L3 (ĐỎ) -->
        <rect x="772" y="376" width="176" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="772" y="376" width="176" height="48" rx="20" fill="rgba(198,40,40,0.08)" stroke="#c62828" stroke-width="1.4"/>
        <text x="860" y="404" fill="#b71c1c" font-weight="600">ĐỎ: thiếu khối</text>

        <!-- D4 -->
        <polygon points="480,468 592,512 480,556 368,512" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="516" fill="#2d3142" font-weight="600">screens rỗng?</text>

        <!-- D5 -->
        <polygon points="860,468 960,512 860,556 760,512" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="860" y="516" fill="#2d3142" font-weight="600">Có dòng lý do?</text>

        <!-- L4 -->
        <rect x="1048" y="488" width="216" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="1048" y="488" width="216" height="48" rx="20" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="1156" y="516" fill="#2d3142" font-weight="600">xanh, đếm “không khai màn”</text>

        <!-- L5 (ĐỎ) -->
        <rect x="796" y="600" width="128" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="796" y="600" width="128" height="48" rx="20" fill="rgba(198,40,40,0.08)" stroke="#c62828" stroke-width="1.4"/>
        <text x="860" y="628" fill="#b71c1c" font-weight="600">ĐỎ</text>

        <!-- Step -->
        <rect x="320" y="600" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="600" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="624" fill="#2d3142" font-weight="600">Kiểm đủ ô: cột = bốn vai, dòng = screens,</text>
        <text x="480" y="640" fill="#2d3142" font-weight="600">ô mở đầu được/chặn/không liên quan</text>

        <!-- L6 (ĐỎ) -->
        <rect x="32" y="600" width="240" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="32" y="600" width="240" height="56" rx="20" fill="rgba(198,40,40,0.08)" stroke="#c62828" stroke-width="1.4"/>
        <text x="152" y="624" fill="#b71c1c" font-weight="600">Thiếu: ĐỎ,</text>
        <text x="152" y="640" fill="#b71c1c" font-weight="600">gọi tên hồ sơ, màn, vai</text>

        <!-- L7 -->
        <rect x="380" y="704" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="380" y="704" width="200" height="48" rx="20" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="480" y="732" fill="#2d3142" font-weight="600">Đủ: xanh, đếm “đủ ô”</text>
      </g>
    </svg>
  </div>
</body>
</html>
