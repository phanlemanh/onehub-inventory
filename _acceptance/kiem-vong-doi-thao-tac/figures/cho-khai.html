<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỗ khai vòng đời</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Geist", system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: "Geist Mono", monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: "Instrument Serif", serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em;
         line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · So hai lối</p>
    <h1>Khai vòng đời thao tác ở đâu</h1>
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first -->
      <line x1="260" y1="144" x2="260" y2="184" stroke="#eb6c36" stroke-width="1"/>
      <line x1="740" y1="144" x2="740" y2="184" stroke="#4f5d75" stroke-width="1"/>
      <line x1="380" y1="248" x2="380" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="620" y1="248" x2="620" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <!-- Column headers -->
      <text x="100" y="48" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LỐI A · THEO CÂU BẬT</text>
      <rect x="276" y="36" width="56" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="304" y="48" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">KHUYÊN</text>
      <text x="580" y="48" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LỐI B · SỔ RIÊNG</text>
      <line x1="500" y1="32" x2="500" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>

      <!-- A1 -->
      <rect x="100" y="80" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="80" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="116" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">SỔ MÀN</text>
      <text x="116" y="124" fill="#2d3142" font-size="12" font-weight="600">Mỗi màn kê những thứ nó hiện</text>
      <text x="116" y="136" fill="#4f5d75" font-size="9">ví dụ Bảng hàng: Căn, Chủ căn, Bộ lọc đã lưu</text>

      <!-- A2 focal -->
      <rect x="100" y="184" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="184" width="320" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="116" y="208" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">MÔ HÌNH NGHIỆP VỤ</text>
      <text x="116" y="228" fill="#2d3142" font-size="12" font-weight="600">Vòng đời khai một lần, ở chính thứ ấy</text>
      <text x="116" y="240" fill="#4f5d75" font-size="9">thêm · xem · sửa · gỡ — dùng chung cho mọi màn</text>

      <text x="100" y="284" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Căn hiện ở ba màn → khai một lần</text>

      <!-- B1 -->
      <rect x="580" y="80" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="580" y="80" width="320" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="596" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">SỔ VÒNG ĐỜI RIÊNG</text>
      <text x="596" y="124" fill="#2d3142" font-size="12" font-weight="600">Mỗi cặp màn × thứ khai bốn ô</text>
      <text x="596" y="136" fill="#4f5d75" font-size="9">không chạm sổ màn, không chạm mô hình nghiệp vụ</text>

      <!-- B2 -->
      <rect x="580" y="184" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="580" y="184" width="320" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="596" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">KÉO THEO</text>
      <text x="596" y="228" fill="#2d3142" font-size="12" font-weight="600">Thêm một danh sách màn thứ hai</text>
      <text x="596" y="240" fill="#4f5d75" font-size="9">phải có luật chặn nó lệch khỏi sổ màn</text>

      <text x="640" y="284" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Căn hiện ở ba màn → khai ba lần</text>

      <!-- Common check -->
      <rect x="260" y="340" width="480" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="340" width="480" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
      <text x="276" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">PHÉP KIỂM · CHUNG CẢ HAI LỐI</text>
      <text x="276" y="384" fill="#2d3142" font-size="12" font-weight="600">Máy đọc mã màn, đỏ khi màn hiện một thứ chưa khai</text>
      <text x="276" y="400" fill="#4f5d75" font-size="9">nguồn máy thấy: tên trường trong mã màn + bảng nút của màn</text>

      <text x="500" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PHỦ TIÊU CHÍ AC-1 · AC-2 · AC-3</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="960" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="120" y="476" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="484" fill="#4f5d75" font-size="9">Lối máy khuyên</text>
      <rect x="260" y="476" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="484" fill="#4f5d75" font-size="9">Chỗ khai</text>
      <rect x="380" y="476" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="400" y="484" fill="#4f5d75" font-size="9">Hệ quả · phép kiểm</text>
    </svg>
  </div>
</body>
</html>
