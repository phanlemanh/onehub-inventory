<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng đời theo vai</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Geist", system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: "Geist Mono", monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: "Instrument Serif", serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em;
         line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-4 · Hai nhánh</p>
    <h1>Xét vòng đời theo từng vai đến đâu</h1>
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first -->
      <path d="M 500 116 L 500 152 L 318 152 Q 310 152 310 160 L 310 188" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 500 152 L 762 152 Q 770 152 770 160 L 770 188" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 310 248 L 310 284 L 178 284 Q 170 284 170 292 L 170 320" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <path d="M 310 284 L 442 284 Q 450 284 450 292 L 450 320" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <line x1="770" y1="248" x2="770" y2="320" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root -->
      <rect x="380" y="56" width="240" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="56" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="82" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Một vai mở được màn hiện thứ X</text>
      <text x="500" y="100" fill="#4f5d75" font-size="9" text-anchor="middle">vai giữ cửa vào của màn</text>

      <!-- Branch L (recommended) -->
      <rect x="190" y="188" width="240" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="190" y="188" width="240" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="198" y="196" width="56" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="226" y="208" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">KHUYÊN</text>
      <text x="310" y="228" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Đỏ ở ô xem</text>
      <text x="310" y="240" fill="#4f5d75" font-size="9" text-anchor="middle">mở được màn thì phải xem được</text>

      <!-- Branch R -->
      <rect x="650" y="188" width="240" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="650" y="188" width="240" height="60" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="770" y="214" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Đỏ ở mọi ô</text>
      <text x="770" y="230" fill="#4f5d75" font-size="9" text-anchor="middle">thêm, xem, sửa, gỡ đều xét theo vai</text>

      <!-- Leaf L1 -->
      <rect x="40" y="320" width="260" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="320" width="260" height="92" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="56" y="344" fill="#2d3142" font-size="12" font-weight="600">Ô xem: vai phải xem được X</text>
      <text x="56" y="364" fill="#4f5d75" font-size="9">Không xem được thì kê vai bị chặn,</text>
      <text x="56" y="378" fill="#4f5d75" font-size="9">kèm hàng sẽ làm hoặc «không» có chữ duyệt</text>
      <text x="56" y="398" fill="#2d3142" font-size="9" font-weight="600">Thiếu thì đỏ</text>

      <!-- Leaf L2 -->
      <rect x="320" y="320" width="260" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="320" width="260" height="92" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="336" y="344" fill="#2d3142" font-size="12" font-weight="600">Thêm · sửa · gỡ: theo bảng quyền</text>
      <text x="336" y="364" fill="#4f5d75" font-size="9">Vai của mỗi ô đã qua cổng 9a và 9e,</text>
      <text x="336" y="378" fill="#4f5d75" font-size="9">không xét lại ở đây</text>
      <text x="336" y="398" fill="#2d3142" font-size="9" font-weight="600">Chỉ in ở báo cáo, không đỏ</text>

      <!-- Leaf R -->
      <rect x="640" y="320" width="260" height="92" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="320" width="260" height="92" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="656" y="344" fill="#2d3142" font-size="12" font-weight="600">Mọi ô: vai bị chặn phải kê</text>
      <text x="656" y="364" fill="#4f5d75" font-size="9">Mỗi vai không làm được một ô</text>
      <text x="656" y="378" fill="#4f5d75" font-size="9">phải kê ra, kèm chữ duyệt</text>
      <text x="656" y="398" fill="#2d3142" font-size="9" font-weight="600">Lần đầu: 26 ô phải khai</text>

      <text x="500" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PHỦ TIÊU CHÍ AC-8</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="960" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="120" y="476" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="484" fill="#4f5d75" font-size="9">Nhánh máy khuyên</text>
      <rect x="260" y="476" width="14" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="484" fill="#4f5d75" font-size="9">Lựa chọn</text>
      <rect x="380" y="476" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="400" y="484" fill="#4f5d75" font-size="9">Hệ quả</text>
    </svg>
  </div>
</body>
</html>
