schema_version: 1
feature_slug: kiem-vong-doi-thao-tac
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [design/screens.yaml, tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'man-khai-hien' xanh trên kho thật (mọi màn staff/public và khung có khoá hien; proto, proto-bo-nut không bị đòi); hai ca phá trên bản sao đỏ đúng câu ghim: xoá khoá hien của sent → 'sent: thieu khoa hien'; hien của members thêm 'Khach' → 'members: hien Khach khong phai thuc the'; đối chứng: bản sao chưa phá cho --check exit 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [design/screens.yaml, ontology/actions.yaml, src/app/**, src/modules/**/ui/**, src/components/**, tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'may-thay-man-hien' khẳng định --json trên kho thật cho tập suy ra = bảng viết trước: khung {SavedView, Listing, Unit}; today {}; inventory {Listing, Unit, ListingOwner, SavedView}; sent {ShareLink}; contacts {Contact}; tuy-chinh-san {CompanyLabel, CompanyValueAlias, CustomField, ImportTemplate, PendingUnit, Listing, Unit}; sign-in {}; members {Member} (số màn được so = 8: bảy màn người dùng và khung); ba ca phá trên bản sao đỏ đúng câu: bỏ ShareLink khỏi hien của sent → 'sent: hien ShareLink ma chua khai (truong)'; bỏ Member khỏi hien của members → 'members: hien Member ma chua khai (nut listMembers)'; thêm một tệp vào màn sent chứa chuỗi \"Contact.fullName\" được trang nhập → 'sent: hien Contact ma chua khai (truong)'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [ontology/entities/**, tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'du-bon-o' xanh trên kho thật (mọi thực thể có trong hien của một màn có vong_doi đủ them, xem, sua, go); bốn ca phá trên bản sao đỏ đúng câu: xoá khối vong_doi của ShareLink → 'ShareLink: thieu vong_doi'; xoá ô sua của Member → 'Member: thieu o sua'; ô xem của SavedView viết cả co lẫn khong → 'SavedView.xem: o phai la co, hang hoac khong'; đối chứng: ô them của Listing 'co createListing' kèm hang 12 (dự kiến) xanh; ô rieng.gop của Contact rỗng → 'Contact.gop: o phai la co, hang hoac khong'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [ontology/actions.yaml, ontology/entities/**, design/screens.yaml, tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'o-co-tro-nut-that' xanh trên kho thật; năm ca phá trên bản sao đỏ đúng câu: gỡ dòng removeListing khỏi ontology/actions.yaml → 'Listing.go: thao tac removeListing khong co trong bang quyen' (ca của câu bật); ô them của Member trỏ listMembers → 'Member.them: listMembers la query, o nay can create'; ô go của SavedView trỏ removeContact (nút chỉ ở màn Liên hệ, màn không hiện SavedView) → 'SavedView.go: removeContact khong la nut o man nao hien SavedView'; bỏ hang của ô them của Listing → 'Listing.them: createListing con du kien, thieu hang'; thêm hang 10 vào ô them của Member (inviteMember đang chạy) → 'Member.them: inviteMember dang chay, bo hang'; đối chứng: ô xem của Member trỏ listMembers (query, không phải nút) vẫn xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [docs/plan/lo-trinh.json, _acceptance/*/decisions.jsonl, ontology/entities/**, tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'o-hang-va-khong-co-can-cu' xanh trên kho thật; sáu ca phá trên bản sao đỏ đúng câu: ô hang trỏ '99z' → 'ShareLink.them: hang 99z khong co trong lo trinh'; bỏ ly_do của ô hang → 'ShareLink.them: hang 16 thieu ly_do'; bỏ lý do của ô khong → 'ShareLink.sua: khong thieu ly do'; bỏ duyet → 'ShareLink.sua: khong thieu duyet'; duyet trỏ 'kiem-vong-doi-thao-tac#d-khong-co' → 'ShareLink.sua: duyet kiem-vong-doi-thao-tac#d-khong-co khong co trong so'; duyet trỏ một dòng máy viết không decided_by → 'ShareLink.sua: duyet <ref> khong co decided_by'; duyet trỏ một dòng stage S1 có decided_by → 'ShareLink.sua: duyet <ref> khong phai dong cong'; sổ có một dòng hỏng (không phải JSON) cạnh dòng được trỏ thì vẫn xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'chay-tren-ban-sao-nong' xanh: bản sao chỉ gồm các tệp phép kiểm đọc, không có .git, cho --check exit 0 và in 'vong-doi: du o'; ca 'khong-goi-git': mã nguồn lifecycle.py không chứa 'subprocess' hay chuỗi 'git ' (ca phá thêm một dòng 'import subprocess' vào bản sao tệp → bài quét đỏ 'lifecycle.py: goi tien trinh ngoai'); ca 'don-thu-muc-tam': sau afterAll mọi thư mục tạm bài tạo không còn trên đĩa"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: script
    cmd: config:executors.script.check
    paths: ["**"]
    expected: "exit 0 — make check xanh, bài vong-doi-thao-tac nằm trong make test"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [ontology/entities/**, _acceptance/kiem-vong-doi-thao-tac/decisions.jsonl, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'bang-da-duyet' so mọi ô vong_doi trong kho với bảng viết trước trong bài (chép từ bảng Hỏi-3 đã duyệt — 12 thực thể, 55 ô); bảy chỗ thiếu thật của RS2 khẳng định từng chỗ: Listing.rieng.sua_ngoai_gia hàng 3g, Listing.rieng.nhan hàng 18a, Listing.rieng.doi_nguoi_giu hàng 18a, Contact.xem hàng 13a, Contact.rieng.gop hàng 13a, ShareLink.go hàng 18, ListingOwner.go hàng 13; mọi ô khong có duyet trỏ dòng sổ gate1 của hồ sơ này mang decided_by"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.vong_doi
    paths: [ontology/actions.yaml, design/screens.yaml, ontology/entities/**, tools/coverage_matrix/lifecycle.py, tests/vong-doi-thao-tac.test.ts]
    expected: "exit 0; ca 'xem-theo-vai' xanh trên kho thật, ma trận viết trước vai mở được × màn (khung, inventory, sent, tuy-chinh-san, members, contacts) khớp --json; hai ca phá trên bản sao: bỏ khai chan CompanyAdmin ở ô xem của Listing → 'Listing.xem: CompanyAdmin mo duoc inventory ma khong xem duoc'; đổi vao của members thành null → 'Member.xem: ListAgent mo duoc members ma khong xem duoc'; đối chứng: members với vao listMembers xanh; ca 'bao-cao-theo-vai' chạy --report: exit 0; mục Member có ô them 'inviteMember' với Quản trị sàn 'toàn sàn' và ba vai 'chặn'; mục SavedView ô go 'removeView' với ba vai 'của tôi' và Quản trị sàn 'chặn'; mục ShareLink ô go in hàng 18 và lý do; bản sao có vong_doi lỗi thì --report vẫn exit 0 còn --check exit 1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
