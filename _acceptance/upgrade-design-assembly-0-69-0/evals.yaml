schema_version: 1
feature_slug: upgrade-design-assembly-0-69-0
# Ma trận viết trước (dữ liệu ở rang/matrix.mjs, mọi phép đo đọc nó).
#   Nhánh rời main ở 1ea13196 (cha thứ nhất d47869ac dùng cho ca phá main cũ). Commit lên đời 7174ab43: 31 tệp (25 tệp
#     công cụ, bước cổng, design/theme.json, dấu phiên bản, tests/e2e/floating-parts.spec.ts, eslint.config.js,
#     tests/ci-ban-sao-nong.test.ts). Commit nhật ký 78124335: một tệp wiki/log/.
#   Bản đích 0.69.0: cây 0f6ddbdf348d9c36ed7cac07c2cfd1972200df31, 51 tệp; mk/design-assembly.mk
#     a9af3d808fc7f156d659ada3f6528cfe3482264c (sổ phát hành và mẫu của thư mục bản 0.69.0 trong bộ nhớ đệm plugin).
#   Cổng: 22 quyết định giữ bởi 33 phép kiểm (30 ở 1ea13196); độ tất định 57/69 (22 held, 35 claimed); 69 quyết định cùng
#     trạng thái với công cụ 0.36.1 trên sổ của 1ea13196. make check: 2663 đạt, 2 bỏ qua; 294 linh kiện.
#   Bản sao nông dựng như db/scripts/ci-thu.sh; origin là kho trung gian chia đối tượng với kho này, main ở 1ea13196.
#   Lint: tệp công cụ tools/design-assembly/contract.mjs, tệp thử src/lib/format/hook-probe.ts.
#   choose-first: tệp thử src/components/candidate/probe-badge.tsx giữ ProbeBadge.
#   Cặp hai chiều: two-way.mjs (phép đo nhanh) và shallow-two-way.mjs (bản sao nông). Mỗi ca phá ghim một thông điệp,
#     kê ở `expected` của từng eval.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: ["tools/**", "design/**", "tests/**", "mk/**", "src/**", "eslint.config.js"]
    expected: "exit 0; đầu ra có các dòng 'design-assembly: 22 decisions held by 33 checks, each seen failing on a changed copy', 'component manifest: design/component-registry.json is up to date (294 components)', 'determinism: 57/69 = 83%' và dòng số bài ghim ở ma trận (cây hiện tại 'Tests  2663 passed | 2 skipped (2665)'). Chiều đỏ của dòng cổng: E3"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/gate-lines.mjs
    long_running: 5
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/**", "_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; dòng 'gate: the gate holds 22 decisions by 33 checks; determinism rate 57/69, 22 held and 35 claimed'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/two-way.mjs --only gate-lines
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**", "design/theme.json"]
    expected: "exit 0; bài 'gate-lines' xanh trên bản sao không đổi và đỏ khi design/theme.json của bản chép mất một phép kiểm, với 'gate: the gate did not say: design-assembly: 22 decisions held by 33 checks, each seen failing on a changed copy'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-3
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/tool-tree.mjs
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/tool-stamp.json", "mk/design-assembly.mk", "_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; dòng 'tool: tools/design-assembly is the plugin's version 0.69.0, 51 files, tree 0f6ddbdf348d; the stamp says the same; mk/design-assembly.mk is the template's; the installed plugin 0.69.0 names that tree in its release ledger and its templates hold it'. Chiều đỏ: E5"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-3
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/two-way.mjs --only tool-tree
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**", "tools/design-assembly/**", "design/tool-stamp.json", "mk/design-assembly.mk"]
    expected: "exit 0; bài 'tool-tree' đỏ ở năm ca: một tệp công cụ đổi → 'differs from the plugin's version 0.69.0'; dấu ghi 0.36.1 → 'the stamp says version 0.36.1, not 0.69.0'; bước cổng khác mẫu → 'is not the plugin's gate step'; sổ phát hành của plugin không có bản → 'the installed plugin's release ledger has no version 0.69.0'; không có thư mục plugin → 'cannot read'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-4
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/decision-states.mjs
    long_running: 5
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/**", "_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; dòng 'states: the tool at HEAD and the 0.36.1 tool, each on its own ledger, give each of the 69 decisions the same state; both say 57/69'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-4
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/two-way.mjs --only decision-states
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; bài 'decision-states' xanh như nó là và đỏ khi phía 0.36.1 đọc design/theme.json của 1ea13196 không có phép kiểm của raw-table, với 'states: raw-table is held with the tool at HEAD, not with the 0.36.1 tool'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-5
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/shallow-alone.mjs
    long_running: 5
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/**", "mk/design-assembly.mk", "_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; dòng 'alone: make design-assembly green on a fresh depth-1 clone of <sha> with origin main at 1ea13196; choose-first alone fetched main and read its base; decision-sheet and owner-calls each said main was fetched from origin; the clone left main at 1ea13196'. Chiều đỏ: E9"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-5
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/shallow-two-way.mjs
    long_running: 10
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**", "tools/design-assembly/**"]
    expected: "exit 0; bài 'shallow-alone: red when origin has no main' đạt: phép đo đỏ với 'alone: make design-assembly exit 2', 'alone: decision-sheet did not say main was fetched from origin' và 'alone: choose-first read no base on the clone', mỗi hàng decision-sheet và owner-calls có MỘT dòng mang cả tên hàng lẫn 'origin has neither main nor master'; và bài 'shallow-alone: red when origin main is older' đạt: main của kho trung gian ở d47869ac thì phép đo đỏ với 'alone: the clone left main at d47869ac'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-6
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/change-list.mjs
    layer: backend-effect
    paths: ["**"]
    expected: "exit 0; dòng 'changes: the upgrade commit changes its 31 files; the log commit changes its 1 file; the branch changes nothing beyond the upgrade and this record' (hoặc, khi đã gộp, 'the branch is in origin/main already, so only the commits were compared'). Chiều đỏ: E11"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-6
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/two-way.mjs --only change-list
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; bài 'change-list' xanh trên nhánh như nó là và khi đã gộp, đỏ ở mười hai ca: commit lên đời đổi thêm một tệp → 'upgrade commit changed outside the list: design/decisions.yaml'; commit lên đời thiếu một tệp → 'upgrade commit did not change: design/tool-stamp.json'; commit nhật ký đổi thêm một tệp → 'log commit changed outside the list: design/theme.json'; nhánh đổi thêm một tệp → 'branch changed beyond the upgrade and this record: Makefile'; nhánh đổi một tệp sổ → 'branch changed beyond the upgrade and this record: design/decisions.yaml'; nhánh đổi hồ sơ của việc khác → 'branch changed beyond the upgrade and this record: _acceptance/du-lieu-mau/contract.md'; bản đồ sản phẩm đổi một chữ, một chữ số trên dòng của việc khác, hay số đếm nấc «Đã giao» → 'PRODUCT-MAP.md is not what the records at HEAD draw'; trang lộ trình đổi một chữ số trên hàng khác hay cạnh chữ «chưa có» → 'LO-TRINH.html is not what the records at HEAD draw'; trang lộ trình đổi một chữ số trong tóm tắt của hàng 1 → 'LO-TRINH.html changed the summary of row 1, the one part the redraw does not compare'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-7
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/lint-scope.mjs
    long_running: 3
    layer: backend-effect
    paths: ["eslint.config.js", "tools/design-assembly/**", "_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; dòng 'lint: tools/design-assembly/contract.mjs has no react-hooks/rules-of-hooks error; src/lib/format/hook-probe.ts and tools/hook-probe.mjs, which call a use-named function from a plain function, each have one'. Chiều đỏ: E13"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E13
    criterion: AC-7
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/two-way.mjs --only lint-scope
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**", "eslint.config.js"]
    expected: "exit 0; bài 'lint-scope' xanh như nó là; đỏ khi bỏ chỗ tắt luật, với 'lint: tools/design-assembly/contract.mjs: 1 react-hooks/rules-of-hooks error(s)'; đỏ khi chỗ tắt luật phủ mọi tệp, với 'lint: src/lib/format/hook-probe.ts: react-hooks/rules-of-hooks is not an error there'; đỏ khi chỗ tắt luật phủ cả tools/, với 'lint: tools/hook-probe.mjs: react-hooks/rules-of-hooks is not an error there'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E14
    criterion: AC-8
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/choose-first.mjs
    long_running: 5
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/**", "_acceptance/upgrade-design-assembly-0-69-0/rang/**"]
    expected: "exit 0; dòng 'choose-first: on a clone of <sha> with main at 1ea13196, the gate is green, adding src/components/candidate/probe-badge.tsx with no intake row turns it red (src/components/candidate/probe-badge.tsx holds ProbeBadge, a component this branch adds with no row of the intake ledger), and an intake row for it made from design/intake/bang-nhieu-dong.yaml turns it green again'. Chiều đỏ: E15"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E15
    criterion: AC-8
    executor: script
    cmd: node _acceptance/upgrade-design-assembly-0-69-0/rang/two-way.mjs --only choose-first
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-69-0/rang/**", "design/theme.json"]
    expected: "exit 0; bài 'choose-first' xanh như nó là, và đỏ khi design/theme.json không có phép kiểm choose-first, với 'choose-first: the gate let src/components/candidate/probe-badge.tsx through (exit 0)'; và đỏ khi dòng sổ nhận khối trỏ tệp khác, với 'choose-first: the gate stayed red with an intake row for src/components/candidate/other-badge.tsx'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
