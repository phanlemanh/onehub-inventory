schema_version: 1
feature_slug: danh-muc-reui
# Các eval dùng reui_catalog_test chạy vitest với reporter verbose: mỗi ca in tên, tên ca mở đầu bằng mã eval
# ("E2 ·", "E3 ·"…). Mỗi eval khai trước danh sách ca và số ca đạt chính xác; người chấm đếm theo tên.
# Mọi ca đỏ dựng trên bản sao trong thư mục tạm: chép tools/reui_catalog và design/reui-catalog.json thật,
# nối node_modules bằng symlink, phá đúng một chỗ, gọi lệnh của BẢN SAO bằng đường tuyệt đối từ một thư mục khác
# bản sao. Mỗi ca dùng bản sao khẳng định `git status --porcelain -- tools/reui_catalog design/reui-catalog.json`
# của kho thật vẫn rỗng sau ca.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.reui_catalog_offline
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; lệnh sinh lại chạy hai lần dưới bộ chặn mạng, git diff trên tệp danh mục rỗng, in 'reui catalog regenerated twice offline, identical to commit'; đối chứng rằng bộ chặn thật sự chặn nằm ở E8 (4 ca 'E8 · blocker')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**]
    expected: "exit 0; đúng 3 ca 'E2 ·' đạt: 'E2 · intact copy regenerates and checks green' (đối chứng dương, cùng bản sao), 'E2 · flipped byte in llms-full.txt is refused' và 'E2 · flipped byte in llms.txt is refused' — mỗi ca đỏ khẳng định lệnh sinh lại và lệnh kiểm đều thoát 1, thông điệp chứa đúng 'snapshot hash mismatch: <tệp>', tệp danh mục của bản sao không đổi byte nào"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; đúng 4 ca 'E3 ·' đạt: 'E3 · committed catalog has 678 blocks, 27 components, 1264 examples and the pin' (đếm mục thật bằng counts và bằng pin.json), 'E3 · missing block row stops the build' ('count mismatch: Application: App Shell declares 36, read 35'), 'E3 · missing component row stops the build' ('count mismatch: ReUI Primitives declares 27, read 26'), 'E3 · unreadable item line stops the build' ('unreadable item line <số dòng>'); ba ca đỏ khẳng định không ghi tệp danh mục"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; đúng 5 ca 'E4 ·' đạt, mỗi ca chạy tra.mjs như tiến trình con dưới bộ chặn mạng: 'E4 · kanban lists 10 ranked items with the pin date' (dòng đầu 'ReUI catalog pinned <ngày trong pin.json>', đúng 10 dòng kết quả, kết quả đầu '@reui/kanban'), 'E4 · same query twice gives the same output', 'E4 · --loai block lists only blocks', 'E4 · --json returns name, kind, category, title, url', 'E4 · no match exits 1 with the pin date' (in 'không có mục nào khớp «zzqxw»' và ngày ghim)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.reui_catalog_check
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; in 'snapshot hashes match pin', 'catalog identical to regenerated', 'findable by name: 1969/1969', 'findable by title: 1969/1969 within top 10', 'forbidden: 0'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; đúng 3 ca 'E5 ·' đạt trên cùng một bản sao: 'E5 · every entry is findable' (đối chứng dương, 1969 mục), 'E5 · entry unreachable by name is red' (sửa tên trong danh mục của bản sao thành một tên mà tra không ra chính nó; --check thoát 1 với 'not findable by name: <tên>'), 'E5 · entry pushed out of top 10 by title is red' (chèn 10 mục cùng nhóm và tiêu đề trước mục đích; --check thoát 1 với 'not findable by title: <tên>')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; đúng 11 ca 'E6 ·' đạt; ca 'E6 · matrix has 9 injections' khẳng định ma trận viết trước có đúng 9 phần tử; 'E6 · committed catalog and snapshots are clean' (đối chứng dương); 9 ca đỏ, mỗi ca một bản sao bị chèn đúng một thứ, --check thoát 1 với thông điệp ghim: trường 'source' ('forbidden field in <tên mục>: source'), trường 'files' ('forbidden field in <tên mục>: files'), dấu ba backtick, 'import x from \"y\"', 'export default', 'Bearer', 'REUI_LICENSE' (mỗi thứ 'forbidden in <tên mục>: <thứ>'), dấu ba backtick trong snapshot/llms-full.txt và 'Bearer' trong snapshot/llms.txt (mỗi thứ 'forbidden in snapshot <tệp> line <số>: <thứ>')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**]
    expected: "exit 0; đúng 2 ca 'E7 ·' đạt trên bản sao, nguồn mới dựng bằng cách chép ảnh chụp thật rồi sửa: 'E7 · refresh --from reports added and removed' (thêm khối 'app-shell-999' vào App Shell và sửa số khai thành 37, bớt 'c-accordion-1' và sửa số khai thành 10; dưới bộ chặn mạng lệnh thoát 0, in 'added: app-shell-999' và 'removed: c-accordion-1', pin.json của bản sao mang SHA-256 bằng băm tính lại của tệp nguồn mới, danh mục của bản sao có app-shell-999 và không có c-accordion-1), 'E7 · refresh refuses a source with forbidden text' (nguồn mới có dấu ba backtick; lệnh thoát 1, ảnh chụp, pin.json và danh mục của bản sao giữ nguyên byte)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.test.unit
    paths: [tools/reui_catalog/**, design/reui-catalog.json]
    expected: "exit 0; bộ kiểm của kho chạy tệp tools/reui_catalog/catalog.test.mjs, tệp ấy đạt đủ 33 ca, 0 bỏ qua (số ca của tệp khác 33 thì eval KHÔNG đạt); trong đó 4 ca 'E8 · blocker' cho thấy bộ chặn mạng ném 'network blocked' với fetch, http.get, https.request (gọi qua import có tên của ESM) và net.connect"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [tools/reui_catalog/README.md]
    question: "Một agent chưa biết danh mục chỉ đọc tệp này. Tệp có nói đủ ba điều không: (1) lệnh tra danh mục ReUI tại máy và cách lọc theo loại; (2) câu nào chép vào bằng chứng khi tra không ra, gồm cả ngày ghim; (3) khi nào và bằng lệnh nào thì ghim lại, và ghim lại cần mạng. Có điều nào tệp tự mâu thuẫn hoặc để agent phải đoán không?"
    expected: "PASS khi cả ba điều được nói rõ và tệp không tự mâu thuẫn; việc lệnh có chạy thật không do E10 đo"
    evidence_required: [run_id, verdict, judges, verified_at]

  - id: E10
    criterion: AC-9
    executor: script
    cmd: config:executors.script.reui_catalog_test
    paths: [tools/reui_catalog/**]
    expected: "exit 0; đúng 1 ca 'E10 · README commands run as documented' đạt: trích mọi dòng lệnh trong khối bash của README, chạy từng dòng dưới bộ chặn mạng từ gốc kho (dòng có --refresh chạy trên bản sao với --from, dòng --refresh không --from thì kiểm đúng chú thích 'cần mạng' mà không chạy), mỗi dòng thoát đúng mã README ghi; câu bằng chứng README dạy chép trùng từng chữ với đầu ra của tra 'zzqxw' sau khi thay ngày ghim"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
