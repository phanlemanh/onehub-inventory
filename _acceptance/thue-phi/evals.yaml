    question: "Cột «Về tay» có đứng ngay sau «Giá chào», đọc như cột tiền, hàng Bao phí 3 tỷ hiện 2,88 tỷ, hàng Không bao phí bằng Giá chào, hàng thiếu thì trống; khi bật, cột Điều kiện phí có hiện «Bao phí» / «Không bao phí»; ở 1440 cột Về tay có thấy ngay mà không phải cuộn ngang không?"
    expected: "Mọi khung khớp, Về tay thấy ngay ở 1440"
    evidence_required: [run_id, screenshot, observed, verdict]

