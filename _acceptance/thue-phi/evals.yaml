    question: "Cột thứ hai của App Shell có mục Thuế phí cạnh các phần của Tuỳ chỉnh của sàn mà vai này vốn đọc được; phần có ba dòng không ô sửa, không nút Lưu, có dòng «Chỉ Quản trị sàn đổi được thuế phí», và công tắc nhìn rõ là không bấm được?"
    expected: "Khung khớp ở cả sáng và tối"
    evidence_required: [run_id, screenshot, observed, verdict]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.thue_phi_ontology
    paths: [ontology/**, src/generated/**, src/app/(app)/inventory-sample-rows.ts]
    expected: "exit 0; ca 'listing-co-dieu-kien-phi' (Listing.feeInclusion hai giá trị Included, Excluded, own, có ở glossary và labels), 'nhan-tu-bang-nhan' (FeeSchedule, PersonalIncomeTax, RegistrationFee, BrokerageFee, NetToSeller, FeeInclusion, FeeIncluded, FeeExcluded có nhãn; không mang tên RESO) và 'mau-du-ba-loai' (hàng mẫu có ≥1 Included, ≥1 Excluded, ≥1 thiếu điều kiện, ≥1 Included Giá chào 3.000.000.000, ≥1 thiếu Giá chào; năm assert, mỗi assert ghim tên loại) có mặt và ok. Chiều đỏ: xoá giá trị Excluded ở bản sao labels → 'nhan-tu-bang-nhan' đỏ nêu «FeeExcluded»; bỏ hàng 3 tỷ khỏi bản sao hàng mẫu → 'mau-du-ba-loai' đỏ nêu «3.000.000.000»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.thue_phi_ontology
    paths: [src/modules/listings/ui/**, src/app/(app)/inventory/**, src/modules/company-config/index.ts]
    expected: "exit 0; ca 'cot-ve-tay-sau-gia-chao' (cột Về tay ngay sau Giá chào, hiện sẵn), 'dieu-kien-phi-an-san' (cột Điều kiện phí có trong menu Cột, ẩn sẵn), 've-tay-theo-muc' (bảng viết trước bốn hàng × hai mức: 2,88 tỷ / 2,91 tỷ / bằng giá / trống) và 'sap-nhu-tien' có mặt và ok. Chiều đỏ: pha-thu-muc-cung đỏ với «ve-tay-theo-muc: 2,88 tỷ»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6-e2e
    criterion: AC-6
    executor: script
    layer: backend-effect
    cmd: config:executors.script.thue_phi_e2e
    paths: [src/modules/company-config/**, src/modules/listings/ui/**, src/app/**, tests/e2e-db/thue-phi.spec.ts]
    expected: "exit 0; ca 'dat-muc-roi-bang-hang-doi' ở bốn khổ: Quản trị A lưu môi giới 2, tắt Lệ phí trước bạ qua màn; Đầu chủ A mở Bảng hàng thấy 2,88 tỷ ở hàng Bao phí 3 tỷ; Quản trị đổi về 1; Đầu chủ mở lại thấy 2,91 tỷ; Đầu chủ B thấy 2,895 tỷ; ở 1440 với cột thứ hai mở, ô Về tay của hàng đầu nằm trọn trong khung nhìn (boundingBox phải ≤ bề rộng vùng cuộn) khi chưa cuộn ngang; 'vai-khac-chi-doc' và 'axe-sang-toi' (phần Thuế phí và Bảng hàng, sáng và tối, 0 lỗi) có mặt và ok"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6-ui
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    target: http://127.0.0.1:3485/inventory
    paths: [src/modules/listings/ui/**, src/app/(app)/inventory/**]
    steps:
