    expected: "exit 0; ca 'hai-san-6-o' đủ 6 ô (hai sàn × API đọc, API ghi, truy vấn thẳng): B đọc ra mặc định, không thấy, không sửa dòng của A. Chiều đỏ: pha-thu-bo-loc-san đỏ với «hai-san-6-o: B thấy A»"
