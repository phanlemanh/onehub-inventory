schema_version: 1
feature_slug: thue-phi
# Ma trận viết trước:
#   AC-1: 4 tập con khoản luật × 4 số khoản riêng (0, 1, 2, 5) × 4 tỉ lệ (0, 100, 250, 500 phần vạn) = 64 ô trên 3 tỷ Bao phí, mỗi ô một assert so số
#         đồng viết tay; thêm 5 ca biên (Không bao phí, 1 đồng, chưa giá, chưa điều kiện, mặc định = 2.895.000.000);
#         hằng 28 và 5 ghim — bảng co lại cũng đỏ. Hàm kiểm mức: 6 ca sai viết trước (-10, 510, 125, 0 khoản, khoản lạ,
#         thiếu trường), mỗi ca ghim tên khoản trong lỗi.
#   AC-4: 4 vai × 2 thao tác (đọc, ghi) = 8 ô ở API và 8 ô ở cơ sở dữ liệu; hằng 8 ghim.
#   AC-7: 2 sàn × 3 lối (API đọc, API ghi, truy vấn thẳng) = 6 ô.
# Bài và ca (tên ca là thông điệp ghim):
#   src/modules/company-config/fee-schedule.test.ts: ve-tay-28-o · ve-tay-bien · kiem-muc-6-ca
#   src/modules/company-config/ui/fee-part.test.tsx: ba-dong-dung-thu-tu · theo-luat-khong-o-sua · nguon-da-doi ·
#     luu-khoa-khi-sai · chi-doc-khi-khong-quyen · tra-ve-mac-dinh
#   tests/db/thue-phi.db.test.ts (Postgres dãy N): luu-mot-dong · sai-khong-ghi · vai-8-o-api · vai-8-o-db · hai-san-6-o
#   tests/thue-phi-ontology.test.ts: listing-co-dieu-kien-phi · nhan-tu-bang-nhan · mau-du-ba-loai
#   tests/thue-phi-cot.test.ts: cot-ve-tay-sau-gia-chao · dieu-kien-phi-an-san · ve-tay-theo-muc · sap-nhu-tien
#   tests/e2e-db/thue-phi.spec.ts (Postgres dãy N, bốn khổ): dat-muc-roi-bang-hang-doi · vai-khac-chi-doc · axe-sang-toi
# Cặp phá thử (bản sao; ca tương ứng phải đỏ với thông điệp ghim):
#   pha-thu-tru-khoan-tat (netToSeller trừ cả khoản đang tắt)        → «ve-tay-bang-viet-truoc: [brokerageFee] 0»
#   pha-thu-lam-tron-len (Math.round thay Math.floor)                → «ve-tay-bien: 1 đồng»
#   pha-thu-bo-kiem-buoc (bỏ kiểm bước 10 phần vạn)                  → «kiem-muc-9-ca: 125»
#   pha-thu-mo-ghi-vai (setFeeSchedule mở cho TeamLead ở bản sao)    → «vai-8-o-db: TeamLead ghi»
#   pha-thu-bo-loc-san (đọc bỏ company_id ở bản sao)                 → «hai-san-6-o: B thấy A»
#   pha-thu-doc-so (parseFloat đọc «1,5»)                           → «doc-so-kieu-viet: 1,5»
#   pha-thu-muc-cung (Bảng hàng dùng mặc định thay mức của sàn)      → «ve-tay-theo-muc: 2,88 tỷ»
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.thue_phi
    paths: [src/modules/company-config/**]
    expected: "exit 0; ca 've-tay-bang-viet-truoc' duyệt đủ bảng viết trước (4 tập con khoản luật × 4 số khoản riêng × 4 tỉ lệ = 64 ô; số ô in ra = 64), mỗi ô đúng số đồng viết tay; 've-tay-bien' đủ 5 ca, mặc định 3 tỷ Bao phí = 2.895.000.000; 'kiem-muc-9-ca' đủ 9 ca viết trước (-10, 510, 125, tên rỗng, tên 41 ký tự, tên trùng, khoản riêng thứ sáu, tổng 10,1%, không khoản nào bật), mỗi lỗi nêu đúng khoản. Chiều đỏ: pha-thu-tru-khoan-tat đỏ với «ve-tay-bang-viet-truoc: [brokerageFee] 0»; pha-thu-lam-tron-len đỏ với «ve-tay-bien: 1 đồng»; pha-thu-bo-kiem-buoc đỏ với «kiem-muc-9-ca: 125»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.thue_phi
    paths: [src/modules/company-config/ui/**]
    expected: "exit 0; ca 'ba-dong-dung-thu-tu', 'theo-luat-khong-o-sua', 'nguon-da-doi', 'vi-du-theo-muc-dang-go' có mặt và ok: ba dòng đúng thứ tự; dòng ví dụ cho 3 tỷ hiện 2,895 tỷ ở mặc định, 2,88 tỷ khi gõ môi giới 2 và tắt Lệ phí trước bạ (chưa Lưu, đếm PUT = 0); hai dòng đầu không có ô sửa tỉ lệ, dòng Phí môi giới mang «Đã đổi · [Tên] · 14/11/2026». Chiều đỏ: đổi thứ tự hằng ba khoản ở bản sao → 'ba-dong-dung-thu-tu' đỏ nêu «Lệ phí trước bạ»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2-ui
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    target: http://127.0.0.1:3485/tuy-chinh-san?phan=thue-phi
    paths: [src/modules/company-config/ui/**, src/app/(app)/tuy-chinh-san/**]
    steps:
      - "With the lane N dev server on port 3485 and lane N Postgres, sign in as the sample CompanyAdmin of the sample company whose brokerage is set to 1,5, open the target at 1440 and 1024 wide, light and dark"
      - "Save one frame per size and mode as _acceptance/thue-phi/evidence/E2-<khổ>-<sang|toi>.png"
    question: "Phần Thuế phí có đúng ba dòng theo thứ tự Thuế thu nhập cá nhân, Lệ phí trước bạ, Phí môi giới; mỗi dòng một công tắc bật; hai dòng đầu ghi «theo luật» và không có ô sửa; dòng Phí môi giới hiện 1,5% và «Đã đổi · [Tên] · ngày», hai dòng kia «Mặc định»; phần nằm đúng chỗ ở cột thứ hai của App Shell trong màn Tuỳ chỉnh của sàn? Nêu khổ và chế độ màu nào lệch."
    expected: "Mọi khung khớp; chữ đọc được ở cả sáng và tối"
    evidence_required: [run_id, screenshot, observed, verdict]

  - id: E3
    criterion: AC-3
    executor: script
    layer: backend-effect
    cmd: config:executors.script.thue_phi_db
    paths: [src/modules/company-config/**, src/app/api/v1/company/**, db/migrations/**]
    expected: "exit 0; ca 'luu-mot-dong' (PUT mức môi giới 200, tắt registrationFee → 200; GET trả đúng mức; đọc bằng vai chủ: đúng một dòng của sàn, updated_by là Quản trị mẫu; PUT trả về mặc định một khoản → khoản ấy về mặc định) và 'sai-khong-ghi' (ba thân viết trước: môi giới 600, 125, tắt cả ba → 400 nêu đúng khoản; số dòng và nội dung dòng trước = sau, 3 × 2 assert) có mặt và ok. Chiều đỏ: ghi trước rồi kiểm ở bản sao → 'sai-khong-ghi' đỏ nêu «600»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3-unit
    criterion: AC-3
    executor: test
    cmd: config:executors.test.thue_phi
    paths: [src/modules/company-config/ui/**]
    expected: "exit 0; ca 'luu-khoa-khi-sai' (môi giới 6, 1,25, tắt cả ba → Lưu khoá, lý do gắn đúng dòng), 'doc-so-kieu-viet' (gõ «1,5» → Lưu mở, một lần bấm Lưu gửi đúng một PUT mang brokerage 150; đếm lời gọi = 1) và 'tra-ve-mac-dinh' có mặt và ok. Chiều đỏ: đọc ô bằng parseFloat ở bản sao → 'doc-so-kieu-viet' đỏ với «1,5»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3-ui
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    target: http://127.0.0.1:3485/tuy-chinh-san?phan=thue-phi
    paths: [src/modules/company-config/ui/**]
    steps:
      - "With the lane N dev server on port 3485, sign in as the sample CompanyAdmin of a company on the default schedule, open the target at 1440 light"
      - "Type «6» in Phí môi giới, save _acceptance/thue-phi/evidence/E3-sai.png; set it to «1,5», turn off Lệ phí trước bạ, press Lưu, save _acceptance/thue-phi/evidence/E3-luu.png; reload, save _acceptance/thue-phi/evidence/E3-tai-lai.png"
    question: "Với 6, lý do có nằm ngay dưới ô Phí môi giới và Lưu có khoá không; sau Lưu có thông báo «Đã lưu thuế phí» và dòng Phí môi giới mang «Đã đổi»; sau tải lại có còn 1,5% và Lệ phí trước bạ tắt không?"
    expected: "Ba khung khớp"
    evidence_required: [run_id, screenshot, observed, verdict]

  - id: E4
    criterion: AC-4
