    layer: backend-effect
    cmd: config:executors.script.thue_phi_db
    paths: [src/modules/company-config/**, src/app/api/v1/company/**, db/migrations/**, ontology/actions.yaml]
    expected: "exit 0; ca 'vai-8-o-api' và 'vai-8-o-db' duyệt đủ 8 ô mỗi ca (bốn vai × đọc, ghi; số ô in ra = 8): chỉ CompanyAdmin ghi được; ba vai kia PUT → 403 và ghi thẳng dưới vai ứng dụng bị luật vai chặn, dòng không đổi; cả bốn vai đọc được. Chiều đỏ: pha-thu-mo-ghi-vai đỏ với «vai-8-o-db: TeamLead ghi»"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4-unit
    criterion: AC-4
    executor: test
    cmd: config:executors.test.thue_phi
    paths: [src/modules/company-config/ui/**, ontology/actions.yaml]
    expected: "exit 0; ca 'chi-doc-khi-khong-quyen' có mặt và ok: với ba vai không có setFeeSchedule, phần không có ô sửa, không nút Lưu, có dòng «Chỉ Quản trị sàn đổi được thuế phí»; bảng quyền sinh có readFeeSchedule bốn vai và setFeeSchedule chỉ CompanyAdmin"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4-ui
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    target: http://127.0.0.1:3485/tuy-chinh-san?phan=thue-phi
    paths: [src/modules/company-config/ui/**]
