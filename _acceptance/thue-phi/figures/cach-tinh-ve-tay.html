<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cách tính tiền về tay</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#636b80}
body{margin:0;padding:32px 24px;background:var(--paper);color:var(--ink);font-family:'Geist',sans-serif}
.eyebrow{font:500 9px 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin:0 0 8px}
h1{font:400 1.75rem 'Instrument Serif','Lora',serif;margin:0 0 20px}
svg{width:100%;max-width:1072px;height:auto;display:block}
</style></head><body>
<p class="eyebrow">Hỏi-1 · Điều kiện phí cho từng hàng</p>
<h1>Cách tính tiền về tay</h1>
<svg viewBox="0 0 1072 488" xmlns="http://www.w3.org/2000/svg" font-family="'Geist',sans-serif">
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- connectors first -->
<path d="M168 300 H216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M300 252 V176 Q300 168 308 168 H496" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M380 300 H496" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M300 348 V372 Q300 380 308 380 H496" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M780 168 H816" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M640 84 V120" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M930 200 V228" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>

<!-- branch labels (masked, 6-10px gap above line) -->
<rect x="364" y="144" width="72" height="16" rx="2" fill="#f5f5f5"/>
<text x="400" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">Bao phí</text>
<rect x="388" y="276" width="104" height="16" rx="2" fill="#f5f5f5"/>
<text x="440" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">Không bao phí</text>
<rect x="336" y="340" width="112" height="28" rx="2" fill="#f5f5f5"/>
<text x="392" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">Thiếu giá hay</text>
<text x="392" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">thiếu điều kiện</text>

<!-- start -->
<rect x="24" y="276" width="144" height="48" rx="24" fill="#f5f5f5"/>
<rect x="24" y="276" width="144" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="96" y="304" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Giá chào của hàng</text>

<!-- decision -->
<polygon points="300,252 380,300 300,348 220,300" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="300" y="304" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Điều kiện phí</text>

<!-- aux box -->
<rect x="500" y="12" width="280" height="72" rx="6" fill="#f5f5f5"/>
<rect x="500" y="12" width="280" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="640" y="36" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mức thuế phí của sàn</text>
<text x="640" y="54" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Quản trị sàn đặt ở</text>
<text x="640" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Tuỳ chỉnh của sàn › Thuế phí</text>

<!-- deduct (focal) -->
<rect x="500" y="124" width="280" height="88" rx="6" fill="#f5f5f5"/>
<rect x="500" y="124" width="280" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="640" y="148" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Trừ các khoản đang bật</text>
<text x="640" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Thuế TNCN 2%</text>
<text x="640" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Lệ phí trước bạ 0,5%</text>
<text x="640" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Phí môi giới (sàn đặt, mặc định 1%)</text>

<!-- outcomes -->
<rect x="820" y="136" width="220" height="64" rx="6" fill="#f5f5f5"/>
<rect x="820" y="136" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="930" y="172" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Về tay = Giá chào × (1 − tổng)</text>

<rect x="820" y="232" width="220" height="40" rx="6" fill="#f5f5f5"/>
<rect x="820" y="232" width="220" height="40" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="930" y="256" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif','Lora',serif" text-anchor="middle">Ví dụ: 3 tỷ, mặc định → 2,895 tỷ</text>

<rect x="500" y="276" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="500" y="276" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="620" y="304" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Về tay = Giá chào</text>

<rect x="500" y="356" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="500" y="356" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="620" y="384" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Về tay trống</text>

<!-- legend -->
<line x1="24" y1="432" x2="1048" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="24" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
<line x1="120" y1="452" x2="156" y2="452" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<text x="168" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">Luồng tính</text>
<line x1="280" y1="452" x2="316" y2="452" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="328" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">Nhánh Bao phí</text>
<line x1="460" y1="452" x2="496" y2="452" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
<text x="508" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">Nguồn mức / ví dụ</text>
</svg>
</body></html>
