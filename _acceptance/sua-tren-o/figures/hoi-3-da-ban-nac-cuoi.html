<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đã bán là nấc cuối và khoá</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:2.5rem 1.5rem}
.frame{max-width:1200px;margin:0 auto}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif','Lora',serif;font-size:2rem;font-weight:400;line-height:1.25;margin-bottom:.25rem}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Hỏi-3 · sua-tren-o</p>

<rect x="688" y="272" width="224" height="56" rx="6" fill="#f5f5f5"/>
