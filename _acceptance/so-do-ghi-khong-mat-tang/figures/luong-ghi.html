<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng lệnh ghi số đo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · hàng 1l · lệnh ghi số đo</p>
    <h1>Bản số đo cũ hỏng thì lệnh dừng, không ghi đè</h1>

    <svg viewBox="0 0 960 848" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (drawn first, behind nodes) ===== -->
      <!-- spine -->
      <line x1="400" y1="72" x2="400" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="200" x2="400" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="320" x2="400" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="440" x2="400" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="560" x2="400" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="656" x2="400" y2="704" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- D1 không → dựng từ sổ chạy -->
      <line x1="304" y1="152" x2="232" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- dựng từ sổ chạy → ghi bản mới -->
      <path d="M136 184 V720 Q136 728 144 728 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- decisions → DỪNG -->
      <line x1="496" y1="272" x2="640" y2="272" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="496" y1="392" x2="640" y2="392" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="496" y1="512" x2="640" y2="512" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- three DỪNG → shared note (bracket rail) -->
      <path d="M920 272 H936" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M920 392 H936" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M920 512 H936" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M936 272 V636 Q936 644 928 644 H920" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- Branch labels (masked, gap ≥6px from the line) -->
      <rect x="248" y="132" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="268" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="412" y="206" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÓ</text>
      <rect x="412" y="326" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐƯỢC</text>
      <rect x="412" y="446" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="455" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÓ</text>
      <rect x="412" y="574" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="583" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐÚNG</text>

      <rect x="548" y="252" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="261" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <rect x="548" y="372" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="381" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <rect x="548" y="492" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="501" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAI</text>

      <!-- ===== Nodes ===== -->
      <!-- Start: chạy ghi -->
      <rect x="320" y="24" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="320" y="24" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chạy ghi</text>

      <!-- D1: có bản số đo cũ? -->
      <polygon points="400,104 496,152 400,200 304,152" fill="#f5f5f5"/>
      <polygon points="400,104 496,152 400,200 304,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">có bản</text>
      <text x="400" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">số đo cũ?</text>

      <!-- D2: đọc được? -->
      <polygon points="400,224 496,272 400,320 304,272" fill="#f5f5f5"/>
      <polygon points="400,224 496,272 400,320 304,272" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đọc được?</text>

      <!-- D3: là JSON? -->
      <polygon points="400,344 496,392 400,440 304,392" fill="#f5f5f5"/>
      <polygon points="400,344 496,392 400,440 304,392" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">là JSON?</text>

      <!-- D4: đúng hình dạng? -->
      <polygon points="400,464 496,512 400,560 304,512" fill="#f5f5f5"/>
      <polygon points="400,464 496,512 400,560 304,512" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đúng</text>
      <text x="400" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hình dạng?</text>

      <!-- Step: dựng từ sổ chạy + --phan -->
      <rect x="40" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dựng từ sổ chạy</text>
      <text x="136" y="168" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">+ --phan</text>

      <!-- Step: giữ tầng cũ, --phan thắng -->
      <rect x="300" y="600" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="600" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="624" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">giữ tầng cũ</text>
      <text x="400" y="644" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace">--phan</tspan> thắng</text>

      <!-- End: ghi bản mới (thoát 0) -->
      <rect x="300" y="704" width="200" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="300" y="704" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="512" y="720" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="530" y="732" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-5</text>
      <text x="400" y="726" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ghi bản mới</text>
      <text x="400" y="742" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">thoát 0</text>

      <!-- STOP 1: không đọc được -->
      <rect x="640" y="236" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="236" width="280" height="72" rx="6" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1.4"/>
      <rect x="648" y="244" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="666" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-1</text>
      <text x="780" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DỪNG · thoát 1</text>
      <text x="780" y="292" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">khong doc duoc</text>

      <!-- STOP 2: không phải JSON -->
      <rect x="640" y="356" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="356" width="280" height="72" rx="6" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1.4"/>
      <rect x="648" y="364" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="666" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-2</text>
      <text x="780" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DỪNG · thoát 1</text>
      <text x="780" y="412" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">khong phai JSON</text>

      <!-- STOP 3: sai hình dạng -->
      <rect x="640" y="476" width="280" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="476" width="280" height="72" rx="6" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1.4"/>
      <rect x="648" y="484" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="666" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-3</text>
      <text x="780" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DỪNG · thoát 1</text>
      <text x="780" y="532" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle"><tspan font-family="'Geist Mono', monospace">sai hinh dang</tspan> + chỗ sai</text>

      <!-- Shared note for the three stops (focal) -->
      <rect x="640" y="600" width="280" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="600" width="280" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="648" y="608" width="36" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="666" y="620" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AC-4</text>
      <text x="696" y="620" fill="#ba4513" font-size="10" font-family="'Geist', sans-serif">Cả ba nút DỪNG</text>
      <text x="656" y="644" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">không ghi đè</text>
      <text x="656" y="662" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">gỡ: khôi phục từ git, hoặc xoá tệp</text>
      <text x="656" y="678" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">rồi khai lại bằng <tspan font-family="'Geist Mono', monospace">--phan</tspan></text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="792" x2="920" y2="792" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="820" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="132" y="810" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="820" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <polygon points="284,808 296,816 284,824 272,816" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="304" y="820" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi về bản cũ</text>

      <rect x="408" y="810" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="820" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <rect x="488" y="810" width="24" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1.4"/>
      <text x="520" y="820" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Dừng, không ghi tệp nào</text>

      <rect x="656" y="810" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="688" y="820" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lời chung của ba nút dừng</text>

      <text x="920" y="820" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-n: tiêu chí</text>
    </svg>
  </div>
</body>
</html>
