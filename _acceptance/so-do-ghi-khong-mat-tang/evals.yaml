schema_version: 1
feature_slug: so-do-ghi-khong-mat-tang
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.unit
    paths: [tools/round_metrics/**]
    expected: "exit 0; bài 'ghi dừng khi bản cũ không đọc được' trong tools/round_metrics/round-metrics.test.ts đạt: đối chứng dương trước trên cùng hồ sơ — bản cũ do chính ghi sinh thì ghi thoát 0; rồi thay so-do-vong.json bằng một thư mục, ghi không --phan và ghi --phan r1=bo-cuc đều thoát 1, stderr chứa 'so-do-vong.json', 'khong doc duoc', 'khong ghi de', 'git' và '--phan', không chứa 'Traceback', và thư mục vẫn rỗng; ca chmod 000 cùng hai cách gọi, cùng khẳng định và băm tệp không đổi, chạy khi tiến trình không phải root (dưới root bài bỏ qua có tên)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.unit
    paths: [tools/round_metrics/**]
    expected: "exit 0; bài 'ghi dừng khi bản cũ không phải JSON' đạt: ma trận viết trước 3 nội dung (chuỗi rác, tệp rỗng, byte 0xff 0xfe) × 2 cách gọi (không --phan, --phan r1=bo-cuc), bài khẳng định số ô bằng 6; mỗi ô thoát 1, stderr chứa 'so-do-vong.json', 'khong phai JSON', 'khong ghi de', 'git' và '--phan', băm tệp trước và sau bằng nhau"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.unit
    paths: [tools/round_metrics/**]
    expected: "exit 0; bài 'ghi dừng khi bản cũ sai hình dạng' đạt: bản gốc lấy từ đầu ra của một lần ghi thật, mỗi dạng sửa đúng một chỗ; ma trận viết trước 9 dạng (goc, thieu luot, luot, muc, thieu vong, vong, thieu tang, tang, tang la: mau-sac) × 2 cách gọi, bài khẳng định số ô bằng 18; mỗi ô thoát 1, stderr có một dòng khớp nguyên dòng regex 'sai hinh dang: <nhãn của dạng>' và không có dòng 'sai hinh dang: ' nào mang nhãn của tám dạng còn lại, stderr chứa 'so-do-vong.json', 'khong ghi de', 'git' và '--phan', băm tệp trước và sau bằng nhau"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.unit
    paths: [tools/round_metrics/**]
    expected: "exit 0; bài 'ghi: xoá bản hỏng thì dựng lại' đạt: với một mẫu của mỗi nhóm hỏng (thư mục, chuỗi rác, gốc là mảng), ghi thoát 1, rồi xoá chỗ ấy và ghi --phan r1=bo-cuc thoát 0, bản mới có r1 mang 'bo-cuc' và chua_phan rỗng; các ô dừng của E1, E2, E3 đã khẳng định 'khong ghi de', 'git' và '--phan'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.unit
    paths: [tools/round_metrics/**]
    expected: "exit 0; bài 'ghi: bản cũ lành vẫn đi như cũ' đạt: ma trận viết trước 3 trạng thái (vắng, hợp lệ có r1=trang-thai-hanh-vi do chính ghi sinh, hợp lệ luot rỗng) × 2 cách gọi, bài khẳng định số ô bằng 6; mỗi ô thoát 0; không --phan: r1 mang 'trang-thai-hanh-vi' ở ô có tầng, chua_phan ['r1'] ở hai ô kia; có --phan r1=bo-cuc: r1 mang đúng ['bo-cuc'] ở cả ba ô; và mọi bài có sẵn của tệp vẫn đạt; make test thoát 0"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
