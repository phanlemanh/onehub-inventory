schema_version: 1
feature_slug: bo-o-tim-cua-vung
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.unit
    paths: [src/components/candidate/**, tests/grid.test.tsx, tests/behavior.test.tsx]
    expected: "exit 0; tests/grid.test.tsx dựng DataRegion qua ma trận viết trước 7 trạng thái vùng (có dòng, đang lọc, không khớp, đang tải, trống, lỗi, không đủ quyền) hằng 7 — ở mỗi trạng thái: queryAllByRole('searchbox') rỗng, không phần tử nào có placeholder 'Gõ để tìm' hay aria-label 'Tìm trong vùng'; ở hai trạng thái có dòng thanh công cụ có số dòng và các nút của 2a (đối chứng dương); ca phá vẽ lại một ô type=search trong thanh công cụ (bản sao RegionToolbar có ô tìm) và khẳng định thông điệp 'region still has a search box: <trạng thái>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-1
    executor: script
    cmd: config:executors.script.e2e
    paths: [src/components/candidate/**, tools/e2e_templates/**, tests/e2e/grid.spec.ts]
    expected: "exit 0; bộ bài sinh từ sổ màn chạy ở bốn khổ (1440, 1024, 414, 360) và in danh sách màn đã chạy, BẰNG tập viết trước {inventory, sent} (hằng 2) — màn sent chưa có vùng trên cây thì bài ĐỎ 'sent chua co vung', không xanh; mỗi ca vùng khẳng định region(page).getByRole('searchbox') đếm 0 (ca 'o-tim-vang'); tests/e2e/grid.spec.ts: ma trận 2 chủ đề × 4 khổ hằng 8 không có ô tìm; ca phá của bộ chèn một input type=search vào vùng và đỏ với 'o-tim-vang: con o tim'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.design.ui_check
    paths: [src/components/candidate/**, "src/app/(app)/inventory/**", "src/app/(app)/sent/**"]
    steps:
      - "Use the dev server at the URL given (lane K, port 3481); if it does not answer, start it from the repo root with PORT=3481 npm run dev (never port 3470, never while a suite command is running), note its PID and stop only that PID when done"
      - "Navigate {url}/inventory at 1440x900, light → screenshot evidence/E3-inventory-1440-sang.png; dark (emulate prefers-color-scheme dark) → evidence/E3-inventory-1440-toi.png"
      - "Navigate {url}/inventory at 360x800, light → screenshot evidence/E3-inventory-360-sang.png; dark → evidence/E3-inventory-360-toi.png"
      - "Navigate {url}/sent at 1440x900, light → screenshot evidence/E3-sent-1440-sang.png; dark → evidence/E3-sent-1440-toi.png"
      - "Navigate {url}/sent at 360x800, light → screenshot evidence/E3-sent-360-sang.png; dark → evidence/E3-sent-360-toi.png"
      - "Navigate {url}/inventory at 1440x900, light; type khong-co-dong-nao into the filter box under the first column header (label 'Lọc cột Căn') → screenshot evidence/E3-inventory-khong-khop-1440-sang.png"
      - "Navigate {url}/inventory at 360x800, dark; type khong-co-dong-nao into the filter box 'Lọc cột Căn' → screenshot evidence/E3-inventory-khong-khop-360-toi.png"
    expected: "ảnh chụp Bảng hàng và Đã gửi ở 1440 và 360, sáng và tối (8 khung) trên bản đã dựng: thanh công cụ không có ô tìm; có số dòng, Nhóm theo Toà (Bảng hàng), Cột, Toàn màn hình; hàng ô lọc dưới tiêu đề theo Hỏi-1; thêm khung trạng thái 'Không có dòng nào khớp' ở 1440 sáng và 360 tối"
    evidence_required: [screenshot, observed, verifier, verified_at]

  - id: E4
    criterion: AC-2
    executor: script
    cmd: config:executors.script.man_mau
    paths: [tools/e2e_templates/**]
    expected: "exit 0; tools/e2e_templates/e2e-templates.test.ts: ca 'loc-dau-cot' dùng pickNeedle trên cột đầu (chuỗi có dòng khớp ở ≥2 khung và nhiều hơn một khung), gõ vào ô lọc của cột đầu, so tập dòng hiện (đọc bằng cuộn cả vùng) với tập tính độc lập như tập nhiều phần tử, và số 'x / y dòng' bằng số dòng khớp; ba ca phá — 'go mot dong khop', 'chi con khung dau', 'them mot dong khong khop' — mỗi ca đỏ với đúng thông điệp ghim 'loc-dau-cot: bo sot dong khop — ' hoặc 'loc-dau-cot: hien dong khong khop — ' (hằng 3 ca phá, cặp xanh/đỏ trên cùng lưới mẫu)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-2
    executor: test
    cmd: config:executors.test.unit
    paths: [src/components/candidate/**, tests/grid-sheet.test.tsx]
    expected: "exit 0; tests/grid-sheet.test.tsx: filterRows không còn nhận chữ tìm (kiểu hàm có ba tham số dữ liệu: dòng, cột, lọc); ma trận viết trước 6 ca lọc ô đầu cột (chữ ở Căn, chữ ở Toà, số khoảng ở Giá chào, ngày khoảng, trạng thái chọn nhiều, hai ô chồng) hằng 6 — mỗi ca so mã căn với tập tính độc lập trên dữ liệu nguồn; chân bảng 'x / 60 dòng' đúng số; ca phá cho ô lọc chỉ lọc dòng đang vẽ và khẳng định 'column filter missed rows outside the window'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-3
    executor: test
    cmd: config:executors.test.unit
    paths: [src/components/candidate/**, tests/grid-sheet.test.tsx, tests/grid.test.tsx]
    expected: "exit 0; khối 'no match': gõ 'zzz-khong-co' vào ô lọc Căn → thân bảng có tiêu đề 'Không có dòng nào khớp' và câu giải thích BẰNG nguyên văn câu của dòng ST-inventory-khong-khop trong design.md của hồ sơ, lấy từ nhãn (không chứa 'tìm'), nút 'Xoá lọc'; thanh công cụ và hàng ô lọc còn; document.activeElement là ô lọc Căn và giá trị còn 'zzz-khong-co'; sửa riêng ô ấy về '' thì 60 dòng hiện lại; bấm 'Xoá lọc' với hai ô lọc đang bật thì cả hai ô rỗng và 60 dòng; ca phá 'Xoá lọc' chỉ xoá một ô và khẳng định 'clear left a filter on: <cột>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-4
    executor: test
    cmd: config:executors.test.unit
    paths: [src/components/candidate/**, tests/grid-sheet.test.tsx]
    expected: "exit 0 (theo lối chủ kho chọn ở Hỏi-1; khuyến nghị 'luôn hiện'): ma trận viết trước 3 cách mở vùng (không lọc sẵn, lọc sẵn bằng initialFilters, góc nhìn initialView có lọc) hằng 3 — ở mỗi cách hàng ô lọc dưới tiêu đề có mặt ngay lần vẽ đầu và không có nút 'Lọc'; ca phá trả lại công tắc ẩn hàng ô lọc và khẳng định 'filter row hidden on open'. Lối 'sau nút Lọc': cùng ma trận, không lọc sẵn thì hàng ẩn và nút 'Lọc' có, hai cách còn lại thì hàng hiện"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-5
    executor: script
    cmd: config:executors.script.e2e
    paths: [src/components/candidate/**, tests/e2e/sheet.spec.ts]
    expected: "exit 0; tests/e2e/sheet.spec.ts ở 360 và 414 (hằng 2 khổ): hàng ô lọc nằm dưới tiêu đề (boundingBox của ô lọc Căn có top ≥ bottom của tiêu đề Căn), cuộn ngang vùng tới cột Giá chào thì ô lọc của nó vào khung và có chiều rộng ≥ 11ch, gõ vào ô lọc Căn thì số dòng ở chân bảng giảm đúng như ở 1440; ca phá đặt hàng ô lọc position fixed ngoài vùng cuộn và khẳng định 'filter row does not scroll with the grid'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-6
    executor: test
    cmd: config:executors.test.unit
    paths: [src/components/candidate/**, src/modules/listings/ui/**, tests/grid-saved-view.test.tsx]
    expected: "exit 0; tests/grid-saved-view.test.tsx: khoá của EMPTY_VIEW và của mọi cách xem onViewChange báo BẰNG đúng tập ['filters','grouped','hidden','sort'] (so tập, hằng 4); ma trận cách xem viết trước 5 ca (chỉ lọc, chỉ sắp, chỉ nhóm, chỉ ẩn cột, đủ bốn) hằng 5 so mã căn, nhóm, cột với kết quả tính độc lập; initialView mang thêm khoá 'query' từ dữ liệu cũ thì bị bỏ qua (bảng 60 dòng, không lọc theo chữ ấy); thân yêu cầu lưu do lớp gọi API của Bảng hàng dựng không có khoá 'query'; ca phá đưa lại khoá query vào cách xem và khẳng định 'view carries search text'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-6
    executor: script
    cmd: config:executors.script.goc_nhin_e2e
    layer: backend-effect
    paths: [src/components/candidate/**, src/modules/listings/**, "src/app/(app)/inventory/**", tests/e2e-db/goc-nhin.spec.ts]
    expected: "exit 0; tests/e2e-db/goc-nhin.spec.ts trên Postgres dãy K: ca 'saved view round trip' giữ nguyên ba đường mở (cột thứ hai, tải lại, phiên khác — hằng 3) và thay khẳng định 'ô tìm trống' bằng 'vùng không có ô tìm'; yêu cầu POST/PATCH /api/v1/saved-views bắt được trong bài có thân không chứa khoá 'query'; dòng saved_view đọc bằng vai quản trị của bài có đúng bốn khoá; ca 'old address': mở /inventory?q=0905&query=0905 (tham số chữ tìm của địa chỉ cũ) thì bảng đủ 60 dòng, mọi ô lọc rỗng và không yêu cầu nào mang 'query'; ca phá đọc lại tham số ấy vào lọc và khẳng định 'old search param filtered rows'; ca phá gửi kèm 'query' và khẳng định cửa trả 400 (luật của 2c giữ nguyên)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-7
    executor: test
    cmd: config:executors.test.unit
    paths: [design/states.md, design/behaviors.md, design/patterns/luoi.md, ontology/entities/SavedView.yaml, ontology/glossary.md, wiki/entities/saved-view.md, tests/khong-o-tim.test.ts]
    expected: "exit 0; tệp mới tests/khong-o-tim.test.ts đọc danh sách tệp viết trước (design/states.md, design/behaviors.md, design/patterns/luoi.md, ontology/entities/SavedView.yaml, ontology/glossary.md, wiki/entities/saved-view.md — hằng 6): design/states.md có dòng bảng 'Không có dòng nào khớp' với 'Xoá lọc' và không còn 'Tìm không ra'; danh sách chuỗi cấm viết sẵn ở đây, không để bài tự khai — 'Tìm không ra', 'ô tìm', 'Gõ để tìm', 'Tìm trong vùng', 'the search text', 'search box', 'lưu chữ tìm', 'giữ chữ tìm' (hằng 8 chuỗi × 6 tệp = 48 ô, mỗi ô một dòng kết quả; ngoại lệ duy nhất là câu khẳng định 'không gồm chữ tìm' nguyên văn ở glossary và saved-view.md, khai từng dòng); khẳng định dương: CHANGELOG.md và wiki/log.md mỗi tệp có một dòng chứa 'migration 011' và 'chữ tìm'; design/patterns/luoi.md có câu nói tìm ở ô ⌘K của thanh trên; ca phá chép tệp vào thư mục tạm, chèn lại câu 'the search text' vào SavedView.yaml và khẳng định 'stale search wording in ontology/entities/SavedView.yaml'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-7
    executor: judgment
    inputs: [design/states.md, design/behaviors.md, design/patterns/luoi.md, ontology/entities/SavedView.yaml, wiki/log.md, CHANGELOG.md]
    question: "Đọc bốn tệp. (1) Ma trận trạng thái có gọi trạng thái vùng là 'Không có dòng nào khớp' và vẫn bắt buộc 'Xoá lọc' không? (2) Khuôn Lưới có nói lọc bằng ô dưới tiêu đề cột và tìm ở ô ⌘K của thanh trên App Shell, không còn nói vùng có ô tìm không? (3) Mô tả Góc nhìn có còn câu nào nói góc nhìn giữ chữ tìm không? (4) Nhật ký chung (wiki/log.md) có một dòng ghi rằng góc nhìn bỏ chữ tìm theo lời chốt của chủ kho 2026-11-13 và migration 011 đã dọn chữ ấy khỏi góc nhìn cũ không? (5) Nhật ký thay đổi (CHANGELOG.md) có dòng tương tự không? (6) Bảng hành vi (design/behaviors.md) có còn câu nào nói vùng có ô tìm hay hành vi của ô tìm không? Trả PASS chỉ khi (1), (2), (4), (5) đúng và (3), (6) là không."
    expected: "PASS khi bốn điều trong câu hỏi đều đạt"
    evidence_required: [verdict, rationale, verifier, verified_at]

  - id: E13
    criterion: AC-8
    executor: script
    cmd: config:executors.script.man_mau
    paths: [tools/e2e_templates/**]
    expected: "exit 0; tools/e2e_templates/e2e-templates.test.ts: danh sách id ca vùng BẰNG tập viết trước (không còn 'tim', có 'loc-dau-cot' và 'khong-khop'); ca 'khong-khop' mang state 'Không có dòng nào khớp' và tên ấy có trong design/states.md (bài đọc tệp); recipes.ts không còn xuất NO_SEARCH_CASE và suite.ts không đọc nó (bài đọc nguồn hai tệp, mỗi tệp một khẳng định); với một sổ màn mẫu có hai màn Lưới (inventory, sent) bộ sinh ra đủ mọi ca vùng cho CẢ HAI màn, không ca nào bị bỏ qua (đếm ca = số ca vùng × 2); ca phá thêm lại một danh sách miễn cho sent và khẳng định 'sent skips a region case: loc-dau-cot'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
    criterion: AC-9
    executor: script
    cmd: config:executors.script.check
    paths: [tests/**, tools/e2e_templates/**, src/**]
    expected: "exit 0; make check xanh toàn kho sau khi viết lại: không bài nào bị xoá hay đánh dấu skip/only so với nhánh chính (bài đếm của kho), mọi bài đơn vị và kiểm khuôn đạt"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-9
    executor: judgment
    inputs: [_acceptance/bo-o-tim-cua-vung/doi-bai-kiem.md, tools/e2e_templates/recipes.ts, tests/grid.test.tsx, tests/grid-sheet.test.tsx, tests/grid-saved-view.test.tsx]
    question: "Tệp đầu là bảng đối chiếu mỗi khẳng định cũ nhắc ô tìm (tệp, tên ca, câu khẳng định cũ) với khẳng định mới (tệp, tên ca, câu khẳng định mới). Mỗi dòng: khẳng định mới có đo cùng điều trên ô lọc đầu cột (cùng tập dòng, cùng số, cùng thông điệp lỗi tương ứng) hoặc thành khẳng định 'không có ô tìm' không, hay nó yếu hơn (bỏ một vế, đổi so tập thành so có mặt, bỏ ca phá)? Có dòng nào ghi 'xoá' hay 'bỏ qua' mà không có khẳng định thay không? Với các dòng trỏ tới bốn tệp bài kiểm kèm theo, đọc ca mới trong tệp ấy và đối chiếu với câu khẳng định mới mà bảng ghi: có khớp không? Trả PASS chỉ khi không dòng nào yếu hơn, không dòng nào bị xoá không thay và mọi dòng trỏ tới bốn tệp đều khớp với ca thật."
    expected: "PASS khi mọi dòng đối chiếu giữ nguyên độ chặt"
    evidence_required: [verdict, rationale, verifier, verified_at]

  - id: E16
    criterion: AC-10
    executor: test
    cmd: config:executors.test.proof_gate
    paths: [tools/proof_gate/**, design/so-khoi.yaml]
    expected: "exit 0; tools/proof_gate/proof-gate-0023.test.ts dựng kho git tạm có commit thật: cặp lành (commit thêm đúng tệp, ngày khai bằng ngày commit, trước commit tạo sổ khối) xanh (đối chứng dương); ma trận phá viết trước 4 ca hằng 4 — commit không có → mã 'so-mien-commit-khong-co', commit không thêm tệp của khối → 'so-mien-commit-khong-tao-tep', ngày khai khác ngày commit → 'so-mien-ngay-lech', commit sau ngày sổ khối ra đời → 'so-mien-sau-luat' — mỗi ca gọi tên khối; ca bản sao nông theo Hỏi-2 trên kho tạm nhân bản --depth 1 (khuyến nghị b: công cụ lấy phần lịch sử còn thiếu — commit khai, cha của nó và lịch sử của tệp sổ khối — rồi kiểm; lấy không được thì đỏ 'so-mien-khong-lay-duoc-commit'); hai ca phá thêm trên bản sao nông: không xác định được commit tạo sổ khối thì đỏ 'so-mien-khong-ro-ngay-luat' (không lấy ngày của commit gốc ghép), commit khai không có cha thì không được coi mọi tệp là 'được thêm' — đỏ 'so-mien-khong-co-cha' khi không lấy được cha; chạy công cụ trên chính kho thì cặp FormDialog xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E17
    criterion: AC-7
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/luoi.md", "src/app/(app)/inventory/**/*.tsx", "src/app/(app)/sent/**/*.tsx", "src/app/(app)/contacts/**/*.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm luoi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E18
    criterion: AC-9
    executor: script
    cmd: config:executors.script.doi_bai_kiem
