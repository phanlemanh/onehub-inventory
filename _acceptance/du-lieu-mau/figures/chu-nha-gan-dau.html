<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chủ nhà gắn đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Điểm quyết định · Hỏi-1 · Dữ liệu mẫu</p>
    <h1>Chủ nhà gắn với Lần chào hay với Căn</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ column separator ============ -->
      <line x1="500" y1="24" x2="500" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- ============ COLUMN A (x0 = 24) ============ -->
      <!-- header -->
      <rect x="24" y="28" width="112" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="40" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A · KHUYẾN NGHỊ</text>
      <text x="24" y="68" fill="#2d3142" font-size="16" font-weight="600">Chủ nhà gắn với Lần chào</text>

      <!-- zones -->
      <rect x="24" y="88" width="464" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
      <rect x="32" y="92" width="288" height="16" rx="2" fill="#f5f5f5"/>
      <text x="40" y="104" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DANH MỤC CĂN DÙNG CHUNG · KHÔNG THUỘC SÀN</text>

      <rect x="24" y="248" width="464" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
      <rect x="32" y="252" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="40" y="264" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SÀN MẪU</text>

      <!-- arrows (before boxes) -->
      <line x1="136" y1="184" x2="136" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="144" y="220" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="148" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐƯỢC CHÀO THÀNH</text>

      <line x1="312" y1="320" x2="216" y2="320" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="228" y="296" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="264" y="308" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LÀ CHỦ CỦA</text>

      <!-- nodes -->
      <rect x="56" y="128" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="128" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="160" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">Căn</text>

      <rect x="56" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="324" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">Lần chào</text>

      <rect x="312" y="288" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="288" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="384" y="316" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">Liên hệ</text>
      <text x="384" y="336" fill="#4f5d75" font-size="12" text-anchor="middle">mang số điện thoại</text>

      <!-- notes -->
      <circle cx="28" cy="416" r="3" fill="#2d3142"/>
      <text x="40" y="420" fill="#2d3142" font-size="12" font-weight="500">Quan hệ đã có trong ontology</text>
      <circle cx="28" cy="440" r="3" fill="#4f5d75"/>
      <text x="40" y="444" fill="#4f5d75" font-size="12">Liên hệ chủ nhà của mỗi sàn nằm gọn trong sàn đó</text>

      <!-- ============ COLUMN B (x0 = 512) ============ -->
      <!-- header -->
      <rect x="512" y="28" width="24" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="524" y="40" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">B</text>
      <text x="512" y="68" fill="#2d3142" font-size="16" font-weight="600">Chủ nhà gắn với Căn, trong phạm vi sàn</text>

      <!-- zones -->
      <rect x="512" y="88" width="464" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
      <rect x="520" y="92" width="288" height="16" rx="2" fill="#f5f5f5"/>
      <text x="528" y="104" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DANH MỤC CĂN DÙNG CHUNG · KHÔNG THUỘC SÀN</text>

      <rect x="512" y="248" width="464" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
      <rect x="520" y="252" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="528" y="264" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SÀN MẪU</text>

      <!-- arrows (before boxes) -->
      <line x1="624" y1="184" x2="624" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="632" y="220" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="636" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐƯỢC CHÀO THÀNH</text>

      <path d="M 872,288 V 164 Q 872,156 864,156 H 704" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-ink)"/>
      <rect x="728" y="116" width="112" height="32" rx="2" fill="#f5f5f5"/>
      <text x="784" y="128" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LÀ CHỦ CỦA</text>
      <text x="784" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRONG PHẠM VI SÀN</text>

      <!-- nodes -->
      <rect x="544" y="128" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="128" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="624" y="160" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">Căn</text>

      <rect x="544" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="624" y="324" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">Lần chào</text>

      <rect x="800" y="288" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="288" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="872" y="316" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">Liên hệ</text>
      <text x="872" y="336" fill="#4f5d75" font-size="12" text-anchor="middle">mang số điện thoại</text>

      <!-- notes -->
      <circle cx="516" cy="416" r="3" fill="#2d3142"/>
      <text x="528" y="420" fill="#2d3142" font-size="12" font-weight="500">Quan hệ mới, phải đổi ontology</text>
      <circle cx="516" cy="440" r="3" fill="#4f5d75"/>
      <text x="528" y="444" fill="#4f5d75" font-size="12">Danh mục dùng chung không giữ liên hệ riêng của sàn</text>

      <!-- ============ legend strip ============ -->
      <line x1="24" y1="472" x2="976" y2="472" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <line x1="108" y1="496" x2="136" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="148" y="500" fill="#4f5d75" font-size="12">quan hệ đã có</text>

      <line x1="260" y1="496" x2="288" y2="496" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-ink)"/>
      <text x="300" y="500" fill="#4f5d75" font-size="12">quan hệ mới</text>

      <line x1="404" y1="496" x2="432" y2="496" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="444" y="500" fill="#4f5d75" font-size="12">đường khuyến nghị</text>

      <text x="976" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TIÊU CHÍ LIÊN QUAN · AC-6 · AC-7 · AC-8</text>
    </svg>
  </div>
</body>
</html>
