schema_version: 1
feature_slug: du-lieu-mau
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/catalog/**, src/modules/listings/**, src/modules/contacts/**, tests/sample-data.test.ts]
    expected: "exit 0; tests/sample-data.test.ts đạt; ca 'AC-1' dựng sàn mẫu hai lần qua cửa index.ts của ba mô-đun, lần một đặt process.env.TZ='UTC', lần hai 'Asia/Ho_Chi_Minh', so JSON.stringify từng byte bằng nhau và cả hai băm SHA-256 bằng hằng ghim trong bài kiểm; chiều đỏ cùng vật: một bản sao đổi giá một lần chào cho băm khác hằng ghim, bài kiểm khẳng định băm khác"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/catalog/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-2' khẳng định ma trận viết trước: đúng ba tên dự án (Vinhomes Ocean Park 1, Vinhomes Ocean Park 2 – The Empire, Vinhomes Ocean Park 3 – The Crown), toà Ocean Park 1 đúng tập {S1.01, S1.02, S1.03, S1.05}; checkSampleCatalog trên vật lành trả 0 lỗi; mọi căn readUnitCode(unitCode(căn)) ra đúng toà, tầng, trục; chiều đỏ trên bản sao: hai căn chung mã → 'mã căn trùng: <mã>', căn có tầng lệch mã → 'mã căn lệch thuộc tính: <mã>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/listings/**, src/modules/catalog/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-3': đúng 60 lần chào, đếm theo trạng thái đúng Active 24, Incomplete 8, Pending 7, Hold 7, Closed 7, Withdrawn 7; checkSampleListings trên vật lành trả 0 lỗi; chiều đỏ trên bản sao, mỗi bản phá một chỗ, ghim thông điệp: bỏ một trạng thái → 'thiếu trạng thái: Hold', Closed mất giá chốt → 'Closed thiếu giá hoặc ngày chốt: <mã>', Withdrawn mất lý do → 'Withdrawn thiếu lý do: <mã>', hai lần chào chung căn → 'hai lần chào chung căn: <upi>', tên toà lệch căn → 'lần chào lệch căn: <mã>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/catalog/**, src/modules/listings/**, src/modules/contacts/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-4': số bản ghi từng loại bằng hằng viết trước (sàn 1, căn 432, lần chào 60, liên kết căn 60, liên hệ 50, liên kết chủ 60); ba hàm kiểm nhãn (catalog, listings, contacts) trên vật lành trả 0 lỗi; chiều đỏ trên sáu bản sao, mỗi loại một bản: tên sàn bỏ '[MAU]' → 'thiếu nhãn MAU: sàn <mã>', upi một căn bỏ 'mau' → 'thiếu nhãn MAU: căn <upi>', mã một lần chào đổi tiền tố → 'thiếu nhãn MAU: lần chào <mã>', mã một liên kết căn đổi tiền tố → 'thiếu nhãn MAU: liên kết căn <mã>', tên một liên hệ bỏ '· MAU' → 'thiếu nhãn MAU: liên hệ <mã>', mã một liên kết chủ đổi tiền tố → 'thiếu nhãn MAU: liên kết chủ <mã>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/catalog/**, src/modules/listings/**, src/modules/contacts/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-5': checkNoRealData trên toàn sàn mẫu (mọi chuỗi của căn, lần chào, liên hệ, hai loại liên kết) trả 0 lỗi và đếm đúng 53 số mẫu tách từ phones, mỗi số khớp ^0900 000 0\\d\\d$; chiều đỏ trên bản sao, mỗi bản một chỗ, thông điệp mang loại và mã bản ghi: phones của một liên hệ thành '0912 345 678' → 'số không đúng dạng mẫu: liên hệ <mã>', số viết liền '0912345678' trong tên liên hệ → 'số không đúng dạng mẫu: liên hệ <mã>', chữ số toàn khổ '０９１２３４５６７８' trong tên toà của một căn → 'số không đúng dạng mẫu: căn <upi>', tên liên hệ không mở đầu '[Tên]' → 'tên không mang nhãn mẫu: liên hệ <mã>'; đối chứng dương: uuid, upi, mốc giờ ISO, mã căn 'S1.05-1208' không bị báo"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/contacts/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-6': checkLinkCases trên sàn mẫu trả 0 lỗi; chiều đỏ trên bốn bản sao, mỗi bản bỏ đúng một ca, ghim tên ca: 'thiếu ca: một chủ nhiều căn', 'thiếu ca: một căn nhiều chủ', 'thiếu ca: vừa chủ vừa khách', 'thiếu ca: căn chưa có chủ'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/contacts/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-7': chọn chủ nhà có từ hai lần chào, gọi updatePhones với '0900 000 099'; với MỌI mã lần chào của người đó ownersOf trả liên hệ mang số mới; quét mọi lần chào trong kho, không lần nào còn đọc ra số cũ; mọi liên hệ khác giữ nguyên phones; không bản ghi căn, lần chào hay liên kết nào có khoá 'phones' hay chuỗi khớp '0900 000'; chiều đỏ: một kho phá thử chép số vào liên kết (khử chuẩn hoá) thì bài kiểm cùng khuôn báo lần chào còn đọc số cũ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.unit
    paths: [src/modules/catalog/**, src/modules/listings/**, src/modules/contacts/**, tests/sample-data.test.ts]
    expected: "exit 0; ca 'AC-8' nối ba mô-đun chỉ qua '@/modules/<tên>' (cửa index.ts): checkSampleLinks trả 0 lỗi; chiều đỏ trên bản sao: liên kết căn trỏ upi không có → 'liên kết căn trỏ căn không có: <upi>', liên kết chủ trỏ lần chào không có → 'liên kết chủ trỏ lần chào không có: <mã>', liên kết chủ trỏ liên hệ không có → 'liên kết chủ trỏ liên hệ không có: <mã>', một liên hệ mang mã sàn khác → 'bản ghi khác sàn: liên hệ <mã>', một liên kết chủ mang mã sàn khác → 'bản ghi khác sàn: liên kết chủ <mã>', một liên kết căn mang mã sàn khác → 'bản ghi khác sàn: liên kết căn <mã>'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.check
    paths: [ontology/entities/Contact.yaml, src/generated/**, src/modules/catalog/**, src/modules/listings/**, src/modules/contacts/**]
    expected: "exit 0; make check xanh, gồm kiểm ontology ('src/generated/ontology.ts is up to date'), kiểm ranh giới mô-đun (0 lỗi) và bài kiểm; src/generated/ontology.ts có nguyên dòng '  phones?: string;' trong interface Contact và dòng '  Contact: [\"fullName\", \"phones\"],'; bài kiểm khai dữ liệu liên hệ mẫu bằng 'satisfies readonly Contact[]' với Contact nhập từ src/generated/ontology.ts nên typecheck trong make check bắt mọi lệch kiểu"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
