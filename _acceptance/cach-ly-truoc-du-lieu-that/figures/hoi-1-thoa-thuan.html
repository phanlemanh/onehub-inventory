<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi 1 · Bảng thoả thuận</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi 1 · AC-7 · AC-8</p>
    <h1>Bảng thoả thuận: tám loại hay sáu loại?</h1>

    <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first -->
      <path d="M 480 104 L 480 124 Q 480 132 472 132 L 168 132 Q 160 132 160 140 L 160 160" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 480 104 L 480 160" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 480 124 Q 480 132 488 132 L 792 132 Q 800 132 800 140 L 800 160" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 160 216 L 160 248" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 480 216 L 480 248" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 800 216 L 800 248" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root -->
      <rect x="272" y="32" width="416" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="32" width="416" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="280" y="40" width="64" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="312" y="52" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HIỆN TẠI</text>
      <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mô hình nghiệp vụ: 8 loại thoả thuận</text>
      <text x="480" y="92" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Bảng: 6 loại + 2 luật mô hình chưa ghi</text>

      <!-- Option A (máy khuyên) -->
      <rect x="16" y="160" width="288" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="160" width="288" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="24" y="168" width="92" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="70" y="180" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">A · MÁY KHUYÊN</text>
      <text x="160" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng nhận đủ 8 loại, mô hình ghi 2 luật</text>

      <!-- Option B -->
      <rect x="336" y="160" width="288" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="336" y="160" width="288" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="344" y="168" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="352" y="180" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">B</text>
      <text x="480" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mô hình rút về 6 loại</text>

      <!-- Option C -->
      <rect x="656" y="160" width="288" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="160" width="288" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="664" y="168" width="16" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="672" y="180" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">C</text>
      <text x="800" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gỡ 2 luật khỏi bảng</text>

      <!-- Consequences -->
      <rect x="16" y="248" width="288" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="248" width="288" height="64" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="160" y="276" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Hàng nhập bằng AI và xác nhận danh mục</text>
      <text x="160" y="292" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">lưu được ngay; không nới chốt nào</text>

      <rect x="336" y="248" width="288" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="336" y="248" width="288" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="480" y="276" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Rẻ hôm nay;</text>
      <text x="480" y="292" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">hai hàng sau phải mở lại mô hình</text>

      <rect x="656" y="248" width="288" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="656" y="248" width="288" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="800" y="276" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Đúng chữ quyết định 0014;</text>
      <text x="800" y="292" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">nới một chốt trước khi có dữ liệu thật</text>

      <!-- Legend -->
      <line x1="16" y1="344" x2="944" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="16" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ THÍCH</text>
      <rect x="16" y="376" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="40" y="386" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Máy khuyên</text>
      <rect x="144" y="376" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="386" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối chọn</text>
      <rect x="256" y="376" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="280" y="386" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hệ quả</text>
    </svg>
  </div>
</body>
</html>
