schema_version: 1
feature_slug: cach-ly-truoc-du-lieu-that
# Ma trận viết trước.
#   Bộ chạy cách ly (db/scripts/cach-ly.sh) sau hàng 7a: 29 ca, mỗi ca in «ok <ca>» đúng một lần ở bản lành.
#     19 ca cũ của hàng 7 giữ nguyên tên.
#     5 ca SQL mới (db/tests/cach-ly.sql): a-ghi-duoc-dong-cua-minh, vai-api-khong-quyen-nguy-hiem,
#       vai-api-chi-cham-bang-co-luat, dang-xem-khong-vuot-luat, ham-dac-quyen-trong-danh-sach
#     5 ca phá mới (db/tests/pha-thu/<tệp>.sql), ca → tệp → dòng ghim:
#       pha-thu-ghi-bi-chan: ghi-bi-chan → «HỎNG a-ghi-duoc-dong-cua-minh»
#       pha-thu-quyen-nguy-hiem: cap-xoa-sach → «HỎNG vai-api-khong-quyen-nguy-hiem: public.agreements TRUNCATE»,
#         cap-trigger-public → «HỎNG vai-api-khong-quyen-nguy-hiem: public.companies TRIGGER»
#       pha-thu-bang-khong-luat: bang-schema-khac → «HỎNG vai-api-chi-cham-bang-co-luat: kho_ngoai.listings_mau»,
#         bang-public-khong-cot-san → «HỎNG vai-api-chi-cham-bang-co-luat: public.bang_tra_cuu_mau»
#       pha-thu-dang-xem-vuot: dang-xem-thuong → «HỎNG dang-xem-khong-vuot-luat: public.agreements_tat_ca»,
#         dang-xem-vat-chat → «HỎNG dang-xem-khong-vuot-luat: public.agreements_dem»
#       pha-thu-ham-dac-quyen: ham-dac-quyen-public → «HỎNG ham-dac-quyen-trong-danh-sach: public.dem_moi_thoa_thuan»,
#         ham-trigger-dac-quyen → «HỎNG ham-dac-quyen-trong-danh-sach: public.ghi_vet_thoa_thuan»
#     Dòng tổng của bản lành: «cach-ly: 29 ca đạt, vai quy_hang_app».
#   Danh sách hàm đặc quyền viết tay (10, chủ quy_hang_identity, schema app): login_request_code, login_verify_code,
#     member_invite, member_list, member_roles, member_set_roles, session_companies, session_end, session_read,
#     session_set_company.
#   Bài quét một cửa, luật 3 (src/modules/identity/one-door.test.ts) — ma trận 9 dạng, mỗi dạng một dòng trong một tệp
#     phá: set local role · RESET ROLE · set role xuống dòng · set session authorization · reset all · discard all ·
#     set_config( · set local app.company_id · set app.user_id.
#   Bài kiểm cơ sở dữ liệu (tests/db/cach-ly.db.test.ts): 3 enum (kind 8 giá trị theo Hỏi-1, direction 2, status 3) so
#     bằng tập; 2 ràng buộc ứng luật (agreements_never_source, agreements_internal_stays); 4 ca phá.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cach_ly_c
    paths: [db/migrations/**, db/tests/**, db/scripts/**]
    expected: "exit 0; dưới vai quy_hang_app với sàn A: insert một thoả thuận company_id = A trả row_count 1, update counterparty của thoả thuận A trả row_count 1, đọc lại thấy dòng mới và giá trị mới; in 'ok a-ghi-duoc-dong-cua-minh' đúng một lần. Chiều đỏ cùng fixture: tệp phá ghi-bi-chan (revoke insert on agreements from quy_hang_app) làm bộ kiểm in 'HỎNG a-ghi-duoc-dong-cua-minh' và bộ chạy in 'ok pha-thu-ghi-bi-chan'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cach_ly_c
    paths: [db/migrations/**, db/tests/**, db/scripts/**]
    expected: "exit 0; ca quét mọi bảng, dạng xem ở mọi schema trừ pg_catalog, information_schema, pg_toast bằng has_table_privilege('quy_hang_app', oid, …) cho TRUNCATE, TRIGGER, REFERENCES (gồm quyền qua PUBLIC và vai mẹ), in số quan hệ đã quét và 'ok vai-api-khong-quyen-nguy-hiem'; 'truncate agreements' dưới vai quy_hang_app lỗi 'permission denied for table agreements'. Chiều đỏ: tệp phá cap-xoa-sach (grant truncate on agreements to quy_hang_app) in 'HỎNG vai-api-khong-quyen-nguy-hiem: public.agreements TRUNCATE'; tệp phá cap-trigger-public (grant trigger on companies to public) in 'HỎNG vai-api-khong-quyen-nguy-hiem: public.companies TRIGGER'; bộ chạy in 'ok pha-thu-quyen-nguy-hiem'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cach_ly_c
    paths: [db/migrations/**, db/tests/**, db/scripts/**]
    expected: "exit 0; ca liệt mọi quan hệ relkind r, p, f ở mọi schema không phải hệ thống mà quy_hang_app có SELECT, INSERT, UPDATE hoặc DELETE; mỗi quan hệ có relrowsecurity và relforcerowsecurity; has_schema_privilege CREATE sai ở mọi schema; USAGE trên schema identity sai; in số bảng (3 ở bản lành: agreements, companies, company_members) và 'ok vai-api-chi-cham-bang-co-luat'. Chiều đỏ: bang-schema-khac (schema kho_ngoai, bảng listings_mau có company_id, không bật luật, grant usage và select cho quy_hang_app) in 'HỎNG vai-api-chi-cham-bang-co-luat: kho_ngoai.listings_mau'; bang-public-khong-cot-san in 'HỎNG vai-api-chi-cham-bang-co-luat: public.bang_tra_cuu_mau'; bộ chạy in 'ok pha-thu-bang-khong-luat'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.cach_ly_c
    paths: [db/migrations/**, db/tests/**, db/scripts/**]
    expected: "exit 0; ca liệt mọi quan hệ relkind v, m mà quy_hang_app có SELECT; dạng xem v phải có reloptions chứa security_invoker=true (hoặc on); không có m nào; in 'ok dang-xem-khong-vuot-luat — 0 dạng xem' ở bản lành. Đối chứng dương trong cùng ca: trong một giao dịch, vai chủ tạo dạng xem agreements_doi_chung with (security_invoker = true) trên agreements, cấp select cho quy_hang_app, hàm kiểm của ca trả rỗng và đếm 1 dạng xem; rollback. Chiều đỏ: dang-xem-thuong (create view agreements_tat_ca as select * from agreements, grant cho quy_hang_app) in 'HỎNG dang-xem-khong-vuot-luat: public.agreements_tat_ca'; dang-xem-vat-chat (materialized view agreements_dem) in 'HỎNG dang-xem-khong-vuot-luat: public.agreements_dem'; bộ chạy in 'ok pha-thu-dang-xem-vuot'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cach_ly_c
    paths: [db/migrations/**, db/tests/**, db/scripts/**]
    expected: "exit 0; tập hàm prosecdef ở mọi schema không phải hệ thống mà has_function_privilege('quy_hang_app', oid, 'EXECUTE') đúng, hợp với hàm trigger prosecdef của trigger trên bảng vai chạm được, bằng đúng danh sách 10 hàm viết tay trong ca (schema app, chủ quy_hang_identity), mỗi hàm có proconfig chứa search_path; ca khẳng định đếm 10 và in 'ok ham-dac-quyen-trong-danh-sach — 10 hàm'. Chiều đỏ: ham-dac-quyen-public (hàm security definer public.dem_moi_thoa_thuan chủ postgres, execute mặc định cho PUBLIC) in 'HỎNG ham-dac-quyen-trong-danh-sach: public.dem_moi_thoa_thuan'; ham-trigger-dac-quyen (hàm trigger security definer public.ghi_vet_thoa_thuan, execute bị thu khỏi PUBLIC, gắn trigger after insert trên agreements) in 'HỎNG ham-dac-quyen-trong-danh-sach: public.ghi_vet_thoa_thuan'; bộ chạy in 'ok pha-thu-ham-dac-quyen'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.mot_cua
    paths: [src/modules/identity/one-door.test.ts, src/**]
    expected: "exit 0; bài 'src has no query outside the door' xanh trên src thật (luật 3 không nêu tệp nào); bài đối chứng: tệp sạch dùng withCompany và chuỗi có chữ 'role' trong ngữ cảnh khác ('select role from members') không bị nêu; ma trận 9 dạng của evals.yaml, mỗi dạng ở đúng một dòng của một tệp phá, scanQueries trả đúng danh sách {file, line} viết trước, so bằng toEqual (không đếm); thông điệp ghim 'mã ngoài cửa đổi vai hay đổi sàn'. Chiều đỏ là chính ma trận phá"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cach_ly_db_c
    paths: [db/migrations/**, ontology/entities/Agreement.yaml, tests/db/cach-ly.db.test.ts]
    expected: "exit 0; trên cơ sở nháp cach_ly_db_* đã áp mọi migration, tập giá trị trong ràng buộc agreements_kind_check, agreements_direction_check, agreements_status_check (đọc bằng pg_get_constraintdef) bằng tập enum kind, direction, status đọc từ ontology/entities/Agreement.yaml; insert bằng vai chủ một thoả thuận mỗi loại của mô hình đều thành công. Chiều đỏ cùng fixture: bản sao mô hình thêm loại 'loai_khong_co' làm bài so đỏ với thông điệp 'mô hình có, bảng không nhận: loai_khong_co'; cơ sở nháp có ràng buộc loại nới thêm 'loai_thua' làm bài so đỏ với 'bảng nhận, mô hình không có: loai_thua'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.cach_ly_db_c
    paths: [db/migrations/**, ontology/entities/Agreement.yaml, tests/db/cach-ly.db.test.ts]
    expected: "exit 0; các ràng buộc kiểm của agreements trừ bốn ràng buộc dạng cột (kind, direction, status, data_classes) và agreements_valid_range là đúng {agreements_never_source, agreements_internal_stays}; mỗi tên ứng với một luật trong rules của Agreement.yaml có implemented_in là db/migrations/001_nen_cong_ty.sql và tệp ấy chứa tên ràng buộc. Chiều đỏ: cơ sở nháp thêm ràng buộc agreements_them_mau làm bài đỏ với 'ràng buộc không có luật trong mô hình: agreements_them_mau'; bản sao mô hình bỏ luật của agreements_never_source làm bài đỏ với 'ràng buộc không có luật trong mô hình: agreements_never_source'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.cach_ly_c
    paths: [db/migrations/**, db/tests/**, db/scripts/**]
    expected: "exit 0; 'ok ap-hai-lan' với số dòng sổ migration bằng số tệp; 19 ca SQL (14 cũ, 5 mới), 5 ca lệnh cũ và 5 ca phá mới mỗi ca in ok đúng một lần; dòng cuối đúng 'cach-ly: 29 ca đạt, vai quy_hang_app'. Chiều đỏ của bộ chạy, ma trận viết trước, một lượt chạy trên bản sao thư mục kiểm (biến TESTS_DIR) mang ba chỗ hỏng ở ba ca khác nhau: (a) xoá tệp pha-thu/cap-trigger-public.sql → 'HỎNG pha-thu-quyen-nguy-hiem: cap-trigger-public: không dựng được bản phá'; (b) thay nội dung pha-thu/dang-xem-vat-chat.sql bằng 'select 1;' → 'HỎNG pha-thu-dang-xem-vuot: dang-xem-vat-chat: bộ kiểm vẫn xanh trên bản phá'; (c) pha-thu/ham-trigger-dac-quyen.sql lỗi cú pháp → 'HỎNG pha-thu-ham-dac-quyen: ham-trigger-dac-quyen: không dựng được bản phá'; exit khác 0 và dòng cuối không phải '29 ca đạt'. Lượt này chạy trong tests/db/cach-ly.db.test.ts (lệnh config:executors.script.cach_ly_db_c), so ba dòng bằng toEqual trên tập dòng HỎNG pha-thu-*"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: script
    cmd: config:executors.script.cach_ly_db_c
    paths: [db/scripts/cach-ly.sh, db/tests/**, tests/db/cach-ly.db.test.ts]
    expected: "exit 0; bài 'runner names every broken break file' của tests/db/cach-ly.db.test.ts chạy db/scripts/cach-ly.sh với TESTS_DIR là bản sao mang ba chỗ hỏng (a), (b), (c) của E9 và khẳng định đúng ba dòng HỎNG pha-thu-* ấy, exit khác 0; đối chứng dương cùng bài: bản sao không sửa gì cho exit 0 và dòng '29 ca đạt'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-9
    executor: script
    cmd: config:executors.script.check
    paths: ["**"]
    expected: "exit 0 — make check xanh trên cây của lượt chấm"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-6
    executor: judgment
    inputs: [_acceptance/cach-ly-truoc-du-lieu-that/contract.md, _acceptance/cach-ly-truoc-du-lieu-that/design.md]
    question: "Hợp đồng và thiết kế có nói thẳng phần nào của tám kẽ hở không đo chắc được bằng máy — câu đổi vai ghép lúc chạy, vai đăng nhập là vai chủ, luật viết lại câu và trigger sự kiện, bộ kiểm chưa chạy trên CI — thay vì ngầm coi luật quét một cửa là đóng hẳn kẽ hở đổi vai, đổi sàn không?"
    expected: "PASS khi cả bốn chỗ được nêu trong Known limits, Out of scope hoặc mục «Thứ không đo chắc bằng máy», và không câu nào nói kẽ hở K3 đã đóng hẳn"
    evidence_required: [run_id, verdict, judges, verified_at]
