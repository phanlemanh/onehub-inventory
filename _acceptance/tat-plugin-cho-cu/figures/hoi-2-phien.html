<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2: ở lại phiên hay mở phiên mới</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #636b80;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      border-top: 1px solid rgba(45,49,66,0.12);
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-2 · Hai nhánh rẽ · Phiên</p>
    <h1>Phiên này nạp hai bản kit: ở lại hay mở phiên mới?</h1>

    <svg viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cây quyết định hai nhánh cho hỏi-2">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1000" height="488" fill="#f5f5f5"/>

      <!-- Connectors first, so boxes sit above them -->
      <g fill="none" stroke="#4f5d75" stroke-width="1">
        <path d="M216 196 H256" marker-end="url(#arrow)"/>
        <path d="M312 152 V92 A8 8 0 0 1 320 84 H368" marker-end="url(#arrow)"/>
        <path d="M312 240 V300 A8 8 0 0 0 320 308 H368" marker-end="url(#arrow)"/>
        <path d="M544 84 H576" marker-end="url(#arrow)"/>
        <path d="M752 84 H784" marker-end="url(#arrow)"/>
        <path d="M544 308 H576" marker-end="url(#arrow)"/>
        <path d="M752 308 H784" marker-end="url(#arrow)"/>
      </g>

      <!-- Root: the problem (store treatment) -->
      <rect x="24" y="152" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="152" width="192" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="120" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phiên này nạp hai bản kit</text>
      <text x="120" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/feature-loop:feature-loop</text>
      <text x="120" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rơi vào 2.38.1</text>

      <!-- Decision diamond -->
      <polygon points="312,152 368,196 312,240 256,196" fill="#f5f5f5"/>
      <polygon points="312,152 368,196 312,240 256,196" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chọn nhánh</text>

      <!-- Branch labels, beside the vertical segments -->
      <rect x="228" y="110" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="302" y="122" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">MÁY KHUYÊN</text>
      <rect x="248" y="262" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="302" y="274" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">NHÁNH B</text>

      <!-- Branch A: recommended by the machine (focal) -->
      <rect x="368" y="40" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="40" width="176" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="456" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ở lại phiên này</text>

      <rect x="576" y="40" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="40" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="664" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhạc trưởng 2.38.1</text>
      <text x="664" y="96" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">văn bản trùng 3.0.0 trừ link</text>

      <rect x="784" y="40" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="40" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="872" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qua cache 3.0.0</text>
      <text x="872" y="86" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">script, workflow, tài liệu</text>
      <text x="872" y="106" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ghi Base directory vào sổ</text>

      <!-- Branch A cost -->
      <rect x="368" y="152" width="592" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="376" y="160" width="36" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="394" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">GIÁ</text>
      <text x="424" y="172" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Skill phụ nạp trong phiên này vẫn có thể rơi vào bản cũ.</text>

      <!-- Branch B: open a new session in the worktree -->
      <rect x="368" y="264" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="264" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="456" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Áp khoá tắt vào cây</text>

      <rect x="576" y="264" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="264" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="664" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Anh mở phiên mới</text>
      <text x="664" y="320" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ở worktree</text>

      <rect x="784" y="264" width="176" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="264" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="872" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chạy lại từ Cổng</text>
      <text x="872" y="320" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Phạm vi, ở phiên mới</text>

      <!-- Branch B cost -->
      <rect x="368" y="376" width="592" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="376" y="384" width="36" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="394" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">GIÁ</text>
      <text x="424" y="396" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Thêm một lượt gọi anh (trần 4); phiên mới nạp lại hồ sơ từ đĩa.</text>

      <!-- Legend: horizontal strip at the bottom -->
      <line x1="30" y1="440" x2="970" y2="440" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="30" y="464" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <polygon points="136,456 144,464 136,472 128,464" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="467" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Quyết định</text>
      <rect x="300" y="458" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="467" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bước</text>
      <rect x="420" y="458" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="448" y="467" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>
      <rect x="620" y="456" width="36" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="638" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" font-weight="500" text-anchor="middle" letter-spacing="0.08em">GIÁ</text>
      <text x="664" y="467" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Hệ quả của nhánh</text>
    </svg>

    <p class="colophon">d-20261118T144336Z-8 · tat-plugin-cho-cu</p>
  </div>
</body>
</html>
