    cmd: config:executors.script.lop_rieng_e2e
    layer: backend-effect
    paths: [src/modules/company-config/**, "src/app/(app)/tuy-chinh-san/**", src/components/templates/**, src/modules/identity/ui/**, tests/e2e-db/lop-rieng.spec.ts]
    expected: "exit 0; ca 'review screen' ở 1440: Quản trị sàn A mở màn Tuỳ chỉnh của sàn, năm phần có đúng số dòng của sàn A đọc bằng vai quản trị của bài; bảng nút viết sẵn trong bài theo _acceptance/lop-rieng-cua-san/thao-tac-nhap.yaml (5 phần × nút đầu vùng và nút «…») hằng 5 — mỗi phần đếm đúng nút đầu vùng (Thêm nhãn riêng, Thêm trường riêng, Thêm từ điển, Khớp với danh mục, không nút ở Mẫu nhập) và đúng mục của «…» (Sửa · Ngừng dùng; Ngừng dùng; Đổi tên · Ngừng dùng), không phần nào có mục chứa chữ 'Xoá'; ma trận 4 vai × 5 phần hằng 20: Đầu khách đếm 0 nút ghi ở mọi phần, ba vai kia đếm đúng bảng; «…» → 'Sửa' nhãn 'Block' thành 'Lô' → tải lại vẫn 'Lô' và Bảng hàng có tiêu đề 'Lô'; «…» → 'Ngừng dùng' trường ghi_chu → xác nhận → mục biến mất và Bảng hàng không còn cột ấy; 'Khớp với danh mục' → thông báo 'Đã khớp 1 căn, còn 0 căn chờ'; quyền bị gỡ giữa chừng → 'Không đủ quyền làm việc này'; axe không lỗi ở sáng và tối; ca phá: hiện nút Ngừng dùng ngoài PermittedAction → bộ kiểm nút của 9e đỏ 'write button outside PermittedAction'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

