  - id: E11
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    target: "Bảng hàng của sàn mẫu có nhãn riêng và hai trường riêng, khổ 1440 và 360, sáng và tối"
    steps:
      - "From the repo root, with lane R Postgres up (DB_PORT 5565), run: LOP_RIENG_ANH=1 DB_LANE=r DB_PORT=5565 npx playwright test -c playwright.db.config.ts tests/e2e-db/lop-rieng.spec.ts --project 1440 — it signs in through the shared role door, fills the sample company's layer, and writes the pictures under _acceptance/lop-rieng-cua-san/evidence/; it starts and stops its own server, never start another"
      - "Open evidence/inventory-1440.png, inventory-1440-cuoi.png (the grid scrolled to its last columns), inventory-1440-cuoi-toi.png, inventory-1440-toi.png, inventory-1024.png, inventory-414.png, inventory-360.png, inventory-360-toi.png and look at the headers and the last columns"
    paths: [src/modules/listings/ui/**, "src/app/(app)/inventory/**", src/components/candidate/**]
    expected: "Ảnh cho thấy tiêu đề 'Block' ở chỗ Toà, hai cột 'Hướng view' và 'Ghi chú' sau cột Xác nhận lúc, giá trị mẫu đọc được, cột không vỡ ở 360, tương phản đủ ở nền tối"
    evidence_required: [screenshot, observed]

