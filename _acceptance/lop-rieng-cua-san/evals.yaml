    paths: ["src/app/(app)/tuy-chinh-san/**", src/modules/company-config/**, src/components/templates/**]
    expected: "Ảnh từng khổ cho thấy cột thứ hai (ngăn trượt ở điện thoại) liệt kê năm phần, vùng Lưới với «…» cuối dòng, trạng thái rỗng nói lý do và chỉ đường nhập, không chữ đè, không cuộn ngang ngoài vùng Lưới"
    evidence_required: [screenshot, observed]

