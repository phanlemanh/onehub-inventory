<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khớp căn chờ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #636b80;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Lora', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 0.5rem; }
    .sub { color: var(--color-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình tại điểm quyết định · lớp riêng của sàn</p>
    <h1>Căn chờ khớp: tra bốn nguồn, rồi khớp vào danh mục</h1>
    <p class="sub">Hỏi-4: căn chờ khớp lúc nào · AC-5</p>

    <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane headers -->
      <text x="40" y="40" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TRA MÃ TRONG SÀN · RA CĂN Ở NGUỒN NÀO THÌ DỪNG Ở ĐÓ</text>
      <line x1="40" y1="56" x2="1160" y2="56" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="40" y="280" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">KHỚP VỚI DANH MỤC</text>
      <line x1="40" y1="296" x2="1160" y2="296" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- ===== Arrows ===== -->
      <line x1="184" y1="112" x2="230" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="112" x2="462" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="112" x2="694" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="880" y1="112" x2="926" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1020" y1="144" x2="1020" y2="190" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <line x1="248" y1="416" x2="294" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="536" y1="416" x2="574" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M640 368 V344 Q640 336 648 336 H814" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="704" y1="416" x2="814" y2="416" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M640 464 V488 Q640 496 648 496 H814" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="1032" y="160" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1036" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KHÔNG RA</text>
      <rect x="712" y="312" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="756" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG RA</text>
      <rect x="708" y="392" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="758" y="404" fill="#eb6c36" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RA ĐÚNG MỘT CĂN</text>
      <rect x="708" y="472" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="758" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RA NHIỀU CĂN</text>

      <!-- ===== Row 1: lookup order ===== -->
      <rect x="40" y="80" width="144" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="112" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sàn gõ mã căn</text>

      <g font-family="'Geist', sans-serif">
        <rect x="232" y="80" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="240" y="88" width="16" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="248" y="97" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <text x="324" y="120" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mã riêng của sàn</text>

        <rect x="464" y="80" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="472" y="88" width="16" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="480" y="97" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
        <text x="556" y="120" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mã gốc của danh mục</text>

        <rect x="696" y="80" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="88" width="16" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="712" y="97" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
        <text x="788" y="120" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bộ đọc 8 dạng</text>

        <rect x="928" y="80" width="184" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="936" y="88" width="16" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/>
        <text x="944" y="97" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
        <text x="1020" y="120" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Căn chờ khớp của sàn</text>
      </g>

      <rect x="904" y="192" width="232" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="1020" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo căn chờ khớp (hàng 11)</text>

      <!-- ===== Row 2: match flow ===== -->
      <rect x="40" y="384" width="208" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="144" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người bấm Khớp với danh mục</text>
      <text x="144" y="430" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">hoặc hàng 11 áp lần nhập</text>

      <rect x="296" y="384" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="416" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tra ba nguồn của danh mục</text>
      <text x="416" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trên mã của căn chờ</text>

      <polygon points="640,368 704,416 640,464 576,416" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="640" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ra mấy căn?</text>

      <rect x="816" y="312" width="344" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="988" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vẫn chờ</text>

      <rect x="816" y="392" width="344" height="48" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="988" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi khoá căn vào dòng của sàn</text>

      <rect x="816" y="472" width="344" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="988" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vẫn chờ, cần người</text>

      <!-- Note: shared catalog unchanged on every branch -->
      <path d="M816 536 V544 H1160 V536" fill="none" stroke="#636b80" stroke-width="1"/>
      <text x="988" y="568" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Danh mục chung không đổi dòng nào ở mọi nhánh</text>

      <!-- Legend -->
      <line x1="40" y1="592" x2="1160" y2="592" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="128" y="606" width="28" height="14" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="164" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bắt đầu / kết thúc</text>
      <rect x="296" y="606" width="28" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bước tra</text>
      <polygon points="428,604 440,613 428,622 416,613" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">rẽ nhánh</text>
      <line x1="528" y1="613" x2="560" y2="613" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="568" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">chưa ra đúng một căn</text>
      <rect x="676" y="606" width="28" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="712" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">điểm chính: căn chờ khớp và lúc khớp xong</text>
    </svg>
  </div>
</body>
</html>
