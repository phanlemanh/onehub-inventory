schema_version: 1
feature_slug: upgrade-design-assembly-0-36-2
# Ma trận viết trước (dữ liệu ở rang/matrix.mjs, mọi phép đo đọc nó).
#   Nhánh rời main ở 25f84709. b5f48f65: upgrade 0.36.2 (adapters/css-fonts.mjs, adapters/nextjs-build.mjs,
#     design/tool-stamp.json, một tệp wiki/log/). 326326dc: .claude/rules/design-assembly.md.
#   Plugin: ~/dev/design-assembly ở bdf2bcc (DA_REPO thay chỗ trong ca phá); 0.36.2, cây công cụ cc732f566b65, 44 tệp;
#     mk/design-assembly.mk 15c4208b99e2.
#   Không phụ thuộc phiên bản: 22 quyết định giữ bởi 30 phép kiểm; độ tất định 57/69; 294 linh kiện; 2607 đạt, 2 bỏ qua.
#   Dòng Type của 0.36.2 và dòng đỏ của E7 hồ sơ design-assembly-adopt-checks: ghim ở matrix.mjs.
#   Cặp hai chiều: hai-chieu.mjs, mỗi ca phá ghim một thông điệp, kê ở `expected` của từng eval.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: ["tools/**", "design/**", "tests/**", "mk/**", "src/**", ".claude/rules/**"]
    expected: "exit 0; đầu ra có 'design-assembly: 22 decisions held by 30 checks, each seen failing on a changed copy', 'component manifest: design/component-registry.json is up to date (294 components)', 'determinism: 57/69 = 83%', 'Tests  2607 passed | 2 skipped (2609)'. Chiều đỏ của dòng cổng: E2"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way gate
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**", "tools/design-assembly/**", "design/theme.json"]
    expected: "exit 0; ca 'gate' xanh trên bản chép sạch ('gate: 22 decisions held by 30 checks; determinism rate: 57/69') và đỏ khi design/theme.json mất phép kiểm radius, với 'the gate did not say: design-assembly: 22 decisions held by 30 checks'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh tool
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/tool-stamp.json", "mk/design-assembly.mk", "_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; dòng 'tool: tools/design-assembly is the plugin's version 0.36.2, 44 files, tree cc732f566b65; the stamp says the same; mk/design-assembly.mk is the template's; the plugin at bdf2bcc is 0.36.2, names that tree and its templates hold it'. Chiều đỏ: E4"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way tool
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**", "tools/design-assembly/**", "design/tool-stamp.json"]
    expected: "exit 0; ba ca 'tool' đỏ: một tệp công cụ sửa → 'differs from the plugin's version 0.36.2'; dấu ghi 0.36.1 → 'the stamp says version 0.36.1, not 0.36.2'; không đọc được kho plugin → 'cannot read the plugin's source at bdf2bcc'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh font
    layer: backend-effect
    paths: ["tools/design-assembly/**", "src/app/globals.css", "src/app/layout.tsx", "_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; dòng 'font: --font-sans is loaded via loader, file src/app/layout.tsx, loader google'. Chiều đỏ: E6"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way font
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**", "tools/design-assembly/**"]
    expected: "exit 0; ca 'font' đỏ khi adapters/nextjs-build.mjs là bản 0.36.1, với 'the load of --font-sans has via undefined, not \"loader\"'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh rules
    long_running: 5
    layer: backend-effect
    paths: [".claude/rules/design-assembly.md", "design/**", "tools/design-assembly/**", "_acceptance/design-assembly-adopt-checks/rang/**", "_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; dòng 'rules: the Type line is the one 0.36.2 writes, no line says undefined or cites design/blueprint.json; the page is the one 0.36.2's adopt writes on a copy that re-adopts typeface; E7 of design-assembly-adopt-checks is red with 'rules: 0 lines say undefined, the known defect is one' and nothing else'. Chiều đỏ: E8"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way rules
    long_running: 10
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**", ".claude/rules/design-assembly.md", "_acceptance/design-assembly-adopt-checks/rang/**"]
    expected: "exit 0; ba ca 'rules' đỏ: trang như PR 111 để lại → 'the Type line is not the one 0.36.2 writes: - Running text is set in `undefined`' và cùng trang ấy → 'E7 of the signed record did not go red with exactly 'rules: 0 lines say undefined, the known defect is one': exit 0'; một dòng thêm tay → 'the page differs from the one 0.36.2's adopt writes on a copy of HEAD'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh adopt
    long_running: 5
    layer: backend-effect
    paths: ["design/**", "src/**", "tools/design-assembly/**", "_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; dòng 'adopt: adopt 0.36.2 adds 0 rows, writes nothing, and asks only the font-source question'. Chiều đỏ: E10"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way adopt
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; ba ca 'adopt' đỏ: bản chép bỏ hàng sổ và phép kiểm typeface → 'adopt did not say (rows): rows to add: 0'; đầu ra thật của adopt thêm một câu hỏi → 'adopt asks 2 question(s), not the one font-source question'; đầu ra thật có tệp để viết → 'adopt did not say (nothing): nothing to write' (hai ca sau có đối chứng dương: đầu ra thật chưa sửa thì xanh)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh states
    long_running: 5
    layer: backend-effect
    paths: ["tools/design-assembly/**", "design/**", "_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; dòng 'states: the tool at HEAD and the 0.36.1 tool give each of the 69 decisions the same state'. Chiều đỏ: E12"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way states
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; ca 'states' đỏ khi phía 0.36.1 đọc design/theme.json không có phép kiểm raw-table, với 'raw-table is held with the tool at HEAD'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E13
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh changes
    layer: backend-effect
    paths: ["**"]
    expected: "exit 0; dòng 'changes: b5f48f65 changes 4 files, 326326dc changes 1; the branch changes <n> files, all in the matrix'. Chiều đỏ: E14"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E14
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/upgrade-design-assembly-0-36-2/rang/chay.sh two-way changes
    long_running: 5
    layer: backend-effect
    paths: ["_acceptance/upgrade-design-assembly-0-36-2/rang/**"]
    expected: "exit 0; ca 'changes' đỏ khi một commit thêm sửa src/app/layout.tsx, với 'file changed outside the matrix: src/app/layout.tsx'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
