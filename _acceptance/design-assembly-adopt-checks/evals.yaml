schema_version: 1
feature_slug: design-assembly-adopt-checks
# Ma trận viết trước: rang/matrix.mjs (commit nhánh cắt ra, tám dòng và kiểm tra mỗi dòng trỏ, hai dòng mới,
# tệp được đổi, mục của trang luật, dòng công cụ in, và các thông điệp ghim). Cặp hai chiều: rang/hai-chieu.mjs,
# 17 bài — pointers xanh trên kho và đỏ ở bốn ca phá (dòng mất check · tệp kiểm thử mất nhãn decision · theme.json mất
# mục typeface · dòng typeface mất); shape xanh trên kho và đỏ ở sáu ca phá (dòng khác đổi · dòng mất · dòng lạ thêm ·
# dòng trỏ sai kiểm tra · tệp ngoài ma trận đổi · tệp khác trong docs/ đổi); rules xanh trên kho và đỏ ở bốn ca phá
# (Controls nói cỡ khác · Type nói phông khác · thêm một dòng sai · mất một mục). Mỗi ca ghim đúng thông điệp của ma trận.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: [design/**, tools/design-assembly/**, tests/**, src/**]
    expected: "exit 0; đầu ra có dòng 'design-assembly: 22 decisions held by 30 checks, each seen failing on a changed copy'. Chiều đỏ: công cụ tự đổi một bản sao cho mỗi kiểm tra và thấy nó đỏ (vế 'each seen failing on a changed copy'); E4 đỏ khi theme.json mất mục của một dòng giữ bằng công cụ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/design-assembly-adopt-checks/rang/chay.sh pointers
    layer: backend-effect
    paths: [design/decisions.yaml, design/theme.json, tests/format.test.ts, tests/grid.test.tsx, tests/e2e/frame.spec.ts, tests/e2e/grid.spec.ts, _acceptance/design-assembly-adopt-checks/rang/**]
    expected: "exit 0; dòng 'pointers: 10 rows point at their check'. Chiều đỏ: E4 (dòng column-width mất check → 'pointers: column-width names no check, not test:tests/grid.test.tsx'; tests/format.test.ts mất nhãn → 'pointers: format-number-date → tests/format.test.ts carries no decision:format-number-date')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: bash _acceptance/design-assembly-adopt-checks/rang/chay.sh unit
    layer: backend-effect
    paths: [tests/format.test.ts, tests/grid.test.tsx, src/**]
    expected: "exit 0; mọi bài của tests/format.test.ts và tests/grid.test.tsx đạt, 0 bài hỏng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/design-assembly-adopt-checks/rang/chay.sh two-way
    layer: backend-effect
    paths: [_acceptance/design-assembly-adopt-checks/rang/**, design/decisions.yaml, design/theme.json, tests/format.test.ts, tests/grid.test.tsx, tests/e2e/frame.spec.ts, tests/e2e/grid.spec.ts]
    expected: "exit 0; 17 bài đạt, 0 hỏng: pointers xanh trên kho và đỏ ở bốn ca; shape xanh trên kho và đỏ ở sáu ca; rules xanh trên kho và đỏ ở bốn ca; mỗi ca đỏ in đúng thông điệp ghim (xem đầu tệp)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-3
    executor: script
    cmd: config:executors.script.e2e
    long_running: 30
    layer: backend-effect
    paths: [tests/e2e/**, src/**]
    expected: "exit 0; bộ kiểm thử trình duyệt đạt ở mọi cỡ màn, gồm các bài của tests/e2e/frame.spec.ts (sáng tối, điều hướng di động, màu trạng thái) và tests/e2e/grid.spec.ts (độ dày bảng)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/design-assembly-adopt-checks/rang/chay.sh shape
    layer: backend-effect
    paths: [design/decisions.yaml, _acceptance/design-assembly-adopt-checks/rang/**]
    expected: "exit 0; dòng 'shape: 8 rows gained a check, 2 rows added, no other row changed; files changed: 5' (ba sổ thiết kế, tài liệu thiết kế của hồ sơ, một dòng nhật ký wiki). Chiều đỏ: E4 (nguồn của format-number-date đổi → 'shape: row format-number-date changed beyond its check'; src/app/globals.css trong danh sách đổi → 'shape: file changed outside the matrix: src/app/globals.css'; một tệp khác trong docs/ → 'shape: file changed outside the matrix: docs/superpowers/specs/2026-11-23-other-design.md')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/design-assembly-adopt-checks/rang/chay.sh rules
    layer: backend-effect
    paths: [.claude/rules/design-assembly.md, design/theme.json, _acceptance/design-assembly-adopt-checks/rang/**]
    expected: "exit 0; dòng 'rules: Controls says 24px as design/theme.json holds; Type says headings in var(--font-sans) as design/theme.json holds; one known wrong line'. Chiều đỏ: E4 (Controls nói 20px → 'rules: Controls says 20px, design/theme.json holds 24px'; thêm một dòng sai → 'rules: 2 lines say undefined, the known defect is one'; mục Controls mất → 'rules: section Controls missing')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
