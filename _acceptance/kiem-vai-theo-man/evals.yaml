    cmd: config:executors.script.vai_man_e2e
    paths: [tests/e2e-db/**, design/vai-man-nut.md, design/screens.yaml, src/modules/identity/ui/**, src/app/**]
    expected: "exit 0; mỗi cặp được vào ở 1440 có bước '<màn> × <vai> @1440: nut' xanh (17 bước); mỗi dấu data-thao-tac đang hiện nằm trong ô của vai ấy ở bảng JSON của công cụ; bước 'members × CompanyAdmin @1440: nut' thấy đủ hai nút mo_san inviteMember và changeMemberRoles (đối chứng dương: dấu đọc được, không phải tập rỗng luôn xanh); ở cặp được vào không có nút nào, bước in 'khong nut theo quyen' thay vì im"
