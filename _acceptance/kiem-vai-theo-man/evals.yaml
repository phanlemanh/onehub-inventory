    cmd: config:executors.script.vai_man_pha_thu
    paths: [tests/e2e-db/**, src/app/(app)/members/**, src/modules/identity/ui/**, design/vai-man-nut.md]
    expected: "exit 0; lệnh phá thử in thêm dòng 'pha doi-nut-moi: do — members × CompanyAdmin @1440: thieu nut inviteMember' và cùng lượt dòng có 'thay nut readCompany khong co trong o' (bản sao đổi action=\"inviteMember\" thành action=\"readCompany\" ở trang Thành viên, không sinh lại bảng); cây gốc cùng cặp xanh"
