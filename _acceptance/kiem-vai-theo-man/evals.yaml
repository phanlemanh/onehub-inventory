    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-8
    executor: script
    cmd: config:executors.script.vai_man_pha_thu
    paths: [tests/e2e-db/**, playwright.db.config.ts, design/screens.yaml, src/app/(app)/members/**, src/components/templates/**]
    expected: "exit 0 của lệnh phá thử; lệnh dựng bản sao cây ở thư mục tạm cho mỗi bản phá, chạy đúng cặp ở khổ 1440 rồi in một dòng mỗi bản: 'pha mo-members: do — members × TeamLead @1440: mong Khong du quyen' · 'pha so-man-mo: do — members × ListAgent @1440: mong man thuong' · 'pha lo-nguoi-chung: do — members × BuyerAgent @1440: lo nguoi chung'; và dòng 'cay goc: xanh' cho cùng ba cặp trên cây chưa phá; lệnh thoát khác 0 nếu một bản phá xanh, một thông điệp lệch, hay cây gốc đỏ"
