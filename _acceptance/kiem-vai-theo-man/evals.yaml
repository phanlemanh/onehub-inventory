  - id: E11
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    paths: ["**"]
    expected: "exit 0; make check xanh — gồm tests/vai-man-so-man.test.ts trong make test và coverage-matrix đọc sổ màn có khoá vao mới không lỗi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-9
    executor: test
    cmd: config:executors.test.vai_man_nut
    paths: [tools/coverage_matrix/buttons.py, design/screens.yaml, ontology/actions.yaml, src/modules/*/ui/**, src/app/**, tests/vai-man-nut-sinh.test.ts, tests/bo-nut-vai-man.test.ts]
    expected: "exit 0; ca 'doc-giao-dien-mo-dun': trên sổ thật, mục inventory của bảng JSON có saveView, editView, removeView mang dấu tìm-thấy (đọc từ src/modules/listings/ui) và updateListing, createListing, activateListing, removeListing, viewOwnerPhone mang dấu du-kien; ca 'giu-moi-man': tập id màn của bảng = tập id của sổ màn (gồm contacts planned, proto, sign-in) — không bỏ màn nào; ca phá trên bản sao: thêm PermittedAction action=\"readCatalog\" vào trang inventory mà không khai → '--check' thoát 1 với dòng 'inventory: ma co readCatalog chua khai'; khai nut 'khongCo' cho today → 'today: nut khongCo khong co trong bang quyen'; đối chứng: cùng hai lệnh trên cây thật thoát 0; các ca cũ của tests/bo-nut-vai-man.test.ts (hàng 9e) vẫn xanh, không đổi lời"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-10
    executor: test
    cmd: config:executors.test.vai_man_nut
    paths: [tools/coverage_matrix/buttons.py, design/vai-man-nut.md, design/screens.yaml, tests/vai-man-nut-sinh.test.ts]
    expected: "exit 0; ca 'bang-du-muc': design/vai-man-nut.md có đúng một mục '## <id>' cho mỗi màn của sổ (8 hôm nay) cộng một mục '## khung' — đếm viết trước 9 mục; mỗi mục có bảng 3 cột 'Vai | Nút theo quyền | Nút không theo quyền' với 4 hàng vai; mục khung liệt ô tìm, đổi sàn, đăng xuất ở cột không theo quyền và saveView, editView, removeView ở cột theo quyền; ca 'du-kien': ô Đầu chủ của inventory chứa 'createListing (toàn sàn, dự kiến)'; ca phá: sửa tay một ô của tệp → '--check' thoát 1 'lệch bảng quyền: inventory'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E14
