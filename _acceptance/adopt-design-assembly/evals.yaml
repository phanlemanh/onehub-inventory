schema_version: 1
feature_slug: adopt-design-assembly
# Ma trận viết trước.
#   Quyết định lệnh kiểm design-assembly giữ (AC-1, AC-2) — đúng 18, theo thứ tự chữ:
#     checks-in-gate, color-contrast, color-palette, color-role, component-manifest, design-tokens, empty-state-actions,
#     ledger-shapes, no-inline-style, no-restyled-component, radius, radius-value, raw-controls, raw-table, spacing,
#     spacing-values, type-scale, type-scale-values.
#   Chín trong số đó giữ bằng luật lint của kho, chạy lại ở đây (AC-2), mỗi id = luật dòng sổ nêu:
#     color-palette=onehub-ui/no-raw-palette color-role=onehub-ui/no-hardcoded-color no-inline-style=shadcn/no-inline-styles
#     no-restyled-component=shadcn/no-restyle radius=shadcn/no-arbitrary-values raw-controls=onehub-ui/no-raw-controls
#     raw-table=onehub-ui/no-raw-table spacing=onehub-ui/no-off-scale-spacing type-scale=onehub-ui/no-arbitrary-text-size
#     Dòng in: «held: 18 — <id> …» rồi «lint re-run: 9 — <id>=<luật> …»; lệch → «held: <n>, missing <id>» ·
#     «held: <n>, extra <id>» · «lint re-run: <n>, missing <id>» · «lint re-run: <id> checks <luật>, the row names <luật>».
#   Người đọc sổ linh kiện (Coverage của hợp đồng): mk/design.mk, tools/design-assembly/, tests/design-registry.test.ts,
#     tools/proof_gate/, .claude/skills/inventory-ui/SKILL.md.
#   Sổ quyết định giữ (AC-4): mọi dòng của 1226ec5:design/decisions.yaml còn nguyên ở HEAD, trừ component-level.
#     Dòng in: «rows kept: <k> of <n>; changed: component-level»; lệch → «row changed: <id>» · «row missing: <id>».
#   Sinh lại sổ (AC-7): «registry regenerated by the design-assembly tool, identical to commit»; lệch → «old tool still
#     there» · «make gen does not write the register with the design-assembly tool» · «make check does not check the
#     register with the design-assembly tool» · «register differs after make gen».
#   Bản dựng tạm (AC-3, AC-6): thư mục tạm, mỗi mục ở gốc là đường nối về kho, trừ tệp hay thư mục mà lượt đổi.
#     AC-3, hai lượt cùng bản: cấu hình lint của kho → thoát 0; thêm mục tắt onehub-ui/no-raw-table → thoát khác 0 với
#       «raw-table: the repository's lint lets through `<table />`». Dòng cuối: «lint off: green with the repository's
#       lint, red with no-raw-table off».
#     AC-6, hai lượt cùng bản: không thêm gì → thoát 0; thêm src/components/candidate/changed-probe.tsx xuất ra
#       ChangedProbe → thoát khác 0 với «ChangedProbe is not in the file». Dòng cuối: «new component: green as committed,
#       red with ChangedProbe added».
#   Lời đáp (AC-10): «answers: AA application; rows conformance-level source-color product-type judgment; contrast 4 pairs
#     at 4.5; --onehub-blue #0246ff»; lệch → «answers: <thứ lệch>».
#   Cặp hai chiều của các kịch bản đo mới (measures.test.mjs): mỗi kịch bản một bản lành → xanh, một bản phá → đỏ, cùng bản,
#     thông điệp ghim như trên.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.check
    long_running: 30
    layer: backend-effect
    paths: [tools/**, mk/**, design/**, tests/**, eslint.config.js, src/**]
    expected: "exit 0; đầu ra có dòng 'design-assembly: 18 decisions held by <m> checks, each seen failing on a changed copy' và dòng 'component manifest: design/component-registry.json is up to date (<k> components)'. Chiều đỏ: E3 và E6 (bản dựng tạm tắt một luật lint, hoặc thêm một linh kiện, làm chính lệnh kiểm ấy đỏ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.lint_rerun
    layer: backend-effect
    paths: [design/theme.json, design/decisions.yaml, tools/design-assembly/**]
    expected: "exit 0; dòng 'held: 18 — ' kèm đúng 18 id của ma trận đầu tệp, đọc từ đầu ra '--rate' của lệnh kiểm; dòng 'lint re-run: 9 — ' kèm đúng chín cặp id=luật của ma trận, mỗi id ở trạng thái held với '(eslint:<luật>, re-run here)'. Chiều đỏ: E10 (đầu ra --rate thiếu raw-table → 'held: 17, missing raw-table'; dữ liệu trỏ raw-table tới other/rule → 'lint re-run: raw-table checks other/rule, the row names onehub-ui/no-raw-table')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.lint_rule_off
    long_running: 5
    layer: backend-effect
    paths: [tools/design-assembly/**, eslint.config.js, tools/eslint-ui/**, design/theme.json]
    expected: "exit 0; lượt một (cấu hình lint của kho) thoát 0; lượt hai (thêm mục tắt onehub-ui/no-raw-table) thoát khác 0 và đầu ra có 'raw-table: the repository's lint lets through `<table />`'; dòng cuối 'lint off: green with the repository's lint, red with no-raw-table off'. Hai lượt là cặp hai chiều trên cùng một bản dựng tạm"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.ledger_rows_kept
    layer: backend-effect
    paths: [design/decisions.yaml]
    expected: "exit 0; dòng 'rows kept: <k> of <n>; changed: component-level' với k = n - 1, và dòng 'component-level: tool:tools/design_registry.mjs -> tool:tools/design-assembly/components.mjs'. Chiều đỏ: E10 (sổ đổi một chữ ở dòng radius → 'row changed: radius'; sổ bỏ dòng wcag-aa → 'row missing: wcag-aa')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.component_register
    layer: backend-effect
    paths: [design/component-registry.json, tests/design-registry.test.ts, tools/design-assembly/**]
    expected: "exit 0; năm bài của tests/design-registry.test.ts đạt: 'has one entry per exported component, each naming its file', 'gives variants only to the component that uses them', 'lists own props and leaves out variants', 'counts both bought libraries as libraries, and the templates folder as templates', 'is up to date with the code'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.register_matches_source
    long_running: 5
    layer: backend-effect
    paths: [design/component-registry.json, src/components/**, tools/design-assembly/**]
    expected: "exit 0; dòng 'component manifest: design/component-registry.json is up to date (<k> components)'; rồi trên bản dựng tạm: lượt không thêm gì thoát 0, lượt thêm changed-probe.tsx thoát khác 0 với 'ChangedProbe is not in the file'; dòng cuối 'new component: green as committed, red with ChangedProbe added'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.register_regenerated
    long_running: 5
    layer: backend-effect
    paths: [mk/design.mk, tools/**, design/component-registry.json]
    expected: "exit 0; dòng 'registry regenerated by the design-assembly tool, identical to commit'. Chiều đỏ: E10 (bản còn tools/design_registry.mjs → 'old tool still there'; bản mk/design.mk gọi công cụ cũ ở gen-design → 'make gen does not write the register with the design-assembly tool')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.proof_gate
    layer: backend-effect
    paths: [tools/proof_gate/**, design/component-registry.json]
    expected: "exit 0; mọi bài của tools/proof_gate đạt, 0 bài hỏng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: judgment
    inputs: [.claude/skills/inventory-ui/SKILL.md, tests/design-registry.test.ts]
    question: "Mục 1 của skill (dòng bắt đầu bằng `design/component-registry.json`) có tả đúng hình dạng mà kiểu Entry và các bài trong tests/design-registry.test.ts khẳng định không: mỗi linh kiện xuất ra là một mục, có tệp, cấp, nguồn thư viện hay của kho, thuộc tính, biến thể và mặc định? Nó có còn nói tới «phần» (parts) của mỗi linh kiện như sổ cũ không?"
    expected: "PASS khi mục 1 nêu đủ sáu thứ ấy và không nói «mỗi phần»; FAIL khi thiếu một thứ hoặc còn tả sổ theo phần"
    evidence_required: [verdict, rationale]
  - id: E10
    criterion: AC-4
    executor: script
    cmd: config:executors.script.measures_two_way
    layer: backend-effect
    paths: [_acceptance/adopt-design-assembly/rang/**]
    expected: "exit 0; mỗi kịch bản đo mới có cặp bài đạt trên cùng một bản: bản lành xanh, bản phá đỏ với đúng thông điệp ghim của ma trận đầu tệp (lint-rerun: 'held: 17, missing raw-table' và 'lint re-run: raw-table checks other/rule, the row names onehub-ui/no-raw-table'; ledger-rows-kept: 'row changed: radius' và 'row missing: wcag-aa'; register-regenerated: 'old tool still there' và 'make gen does not write the register with the design-assembly tool'; owner-answers: 'answers: conformanceLevel AAA' khi bản dữ liệu ghi AAA)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-8
    executor: script
    cmd: config:executors.script.proof_gate_real
    layer: backend-effect
    paths: [tools/proof_gate/**, design/component-registry.json, design/so-khoi.yaml]
    expected: "exit 0; dòng 'proof-gate: mọi màn đang mở đã chứng minh đúng lối', chạy trên kho ở HEAD, đọc sổ linh kiện thật"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-10
    executor: script
    cmd: config:executors.script.owner_answers
    layer: backend-effect
    paths: [design/theme.json, design/decisions.yaml, src/styles/**, src/app/globals.css]
    expected: "exit 0; dòng 'answers: AA application; rows conformance-level source-color product-type judgment; contrast 4 pairs at 4.5; --onehub-blue #0246ff'; rồi lệnh kiểm design-assembly thoát 0 với color-contrast được giữ. Chiều đỏ: E10 (bản dữ liệu ghi AAA → 'answers: conformanceLevel AAA')"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E13
    criterion: AC-11
    executor: script
    cmd: config:executors.script.tokens_primary
    layer: backend-effect
    paths: [design/tokens.json, src/app/globals.css, src/styles/**]
    expected: "exit 0; dòng 'design tokens: design/tokens.json is up to date (<n> tokens)' và dòng 'primary #0246ff'. Chiều đỏ: lệnh kiểm design-assembly giữ design-tokens và mỗi lần chạy thấy nó đỏ trên bản đổi stylesheet (E1)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
