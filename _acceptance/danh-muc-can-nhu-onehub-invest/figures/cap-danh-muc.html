<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấp danh mục căn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây cấp · Hỏi-3 · AC-1, AC-3, AC-4</p>
    <h1>Danh mục căn: năm cấp nối tiếp, toà có thể đứng thẳng dưới dự án, mã gốc là bí danh</h1>

    <svg viewBox="0 0 1040 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Tier tags -->
      <text x="40" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CẤP 1</text>
      <text x="240" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CẤP 2</text>
      <text x="440" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CẤP 3</text>
      <text x="640" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CẤP 4</text>
      <text x="840" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CẤP 5</text>
      <text x="640" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NGOÀI CÂY</text>

      <!-- ===== Connectors (drawn first) ===== -->
      <!-- cha → con, chuỗi chính -->
      <line x1="200" y1="144" x2="240" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="144" x2="440" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="144" x2="640" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="144" x2="840" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nhánh phụ: Dự án → Toà khi không có phân khu -->
      <path d="M120 176 V216 Q120 224 128 224 H480 Q488 224 488 216 V176" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="236" y="232" width="136" height="16" rx="2" fill="#f5f5f5"/>
      <text x="304" y="244" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khi không có phân khu</text>

      <!-- bí danh → Toà, Trục, Căn -->
      <path d="M640 352 H560 Q552 352 552 344 V176" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow-link)"/>
      <line x1="720" y1="320" x2="720" y2="176" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow-link)"/>
      <path d="M800 352 H912 Q920 352 920 344 V176" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow-link)"/>
      <rect x="728" y="240" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="732" y="252" fill="#2e5aa8" font-size="10" font-family="'Geist', sans-serif">trỏ tới</text>

      <!-- ===== Nodes ===== -->
      <!-- Dự án -->
      <rect x="40" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dự án</text>
      <text x="120" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SubdivisionName</text>
      <text x="120" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá: slug</text>

      <!-- Phân khu (focal: cấp mới) -->
      <rect x="240" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="112" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="320" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phân khu</text>
      <text x="320" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ComplexName</text>
      <text x="320" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá: slug</text>

      <!-- Toà -->
      <rect x="440" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Toà</text>
      <text x="520" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BuildingKey</text>
      <text x="520" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá: bld_…</text>

      <!-- Trục -->
      <rect x="640" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trục</text>
      <text x="720" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mở rộng riêng</text>
      <text x="720" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">khoá: stk_…</text>

      <!-- Căn -->
      <rect x="840" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="920" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn</text>
      <text x="920" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UniversalPropertySubId</text>
      <text x="920" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unt_… · tầng dạng chữ</text>

      <!-- Mã gốc (bí danh) -->
      <rect x="640" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="320" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="720" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mã gốc (bí danh)</text>
      <text x="720" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">riêng của ta, không RESO</text>
      <text x="720" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;dự án&gt;/&lt;MÃ&gt;</text>

      <!-- Ghi chú khoá sàn: bao cả danh mục -->
      <path d="M40 412 V420 H1000 V412" fill="none" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="520" y="444" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">khoá sàn: agreement_id trên mỗi dòng (Hỏi-1)</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="1000" y2="464" stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <line x1="120" y1="484" x2="152" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="160" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">cha → con</text>
      <line x1="260" y1="484" x2="292" y2="484" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="300" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">toà đứng thẳng dưới dự án</text>
      <line x1="460" y1="484" x2="492" y2="484" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow-link)"/>
      <text x="500" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bí danh trỏ tới vật thể</text>
      <rect x="652" y="480" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="672" y="488" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">phân khu: cấp mới so với hôm nay</text>
    </svg>
  </div>
</body>
</html>
