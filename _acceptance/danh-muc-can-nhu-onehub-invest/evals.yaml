    criterion: AC-1
    executor: script
    cmd: config:executors.script.danh_muc_db_r
    paths: [db/migrations/**, tests/db/danh-muc*.ts]
    expected: "exit 0; ca 'phan-khu-con-du-an': thêm dự án, phân khu cha là dự án, toà dưới phân khu và toà thẳng dưới dự án đều thành công (đối chứng dương); ba lệnh phân khu không cha, phân khu cha là phân khu, dự án có cha đều lỗi vi phạm ràng buộc và bài ghim tên ràng buộc trong thông điệp lỗi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

