schema_version: 1
feature_slug: danh-muc-can-nhu-onehub-invest
# Ma trận viết trước.
#   Bộ đọc mã (src/modules/catalog/unit-code.test.ts) — đúng 8 dạng của invest (Hỏi-4), mỗi dạng một mã đúng → (toà, tầng, trục) và một mã
#   suýt đúng → từ chối; mã mẫu theo test của invest (pipeline/lib/ma-can-s08.test.mjs, tiền tố Q bịa):
#     gach           Q12A-17-05A  → Q12A / 17 / 05A    · suýt: Q12A-1-05A
#     cham           Q1.18.12     → Q1 / 18 / 12       · suýt: Q1.18
#     tien-to-x      QQQQQ_Q1-X24.04 → Q1 / 24 / 04    · suýt: QQQQ_Q1-X24.04
#     dinh-cham      QX102.01     → QX1 / 2 / 01       · suýt: QX102.1 (QX1020.01 khớp thật: toà QX10, tầng 20)
#     toa-cham-bon   Q6.0107.05   → Q6.01 / 7 / 05     · suýt: Q6.010.05
#     toa-cham-dinh  Q2.1715A10   → Q2.17 / 15A / 10   · suýt: Q2.17-15A10
#     dinh-lien      QX11807      → QX1 / 18 / 07      · suýt: QX1180
#     chan-de        QX101S10     → QX1 / 1 / S10      · suýt: QX101S1
#     thêm: gach Q12A-07-05A → tầng '7' (bỏ số 0 đầu). Mã mẫu cũ S1.05-1208 không thuộc dạng nào → khong-khop-khuon;
#     nó được tra nguyên văn qua bí danh (E7, E9), không tách.
#   Lý do từ chối đúng ba: ma-rong (""), khong-khop-khuon, nhieu-khuon (dựng bằng một bảng dạng giả có hai dạng trùng).
#   Tầng: nhận 7, 15A; từ chối "", 07, -1, 15-A, A15 (bảng ở DB và hàm thuần cùng một danh sách).
#   Khoá: bld_/stk_/unt_ + 26 ký tự 0-9A-HJKMNP-TV-Z; từ chối bld_ 25 ký tự, unt_…I…, blk_….
#   Chuyển mẫu: ảnh chụp danh mục cũ lấy bằng `git show <commit trước hàng>:src/modules/catalog/sample.ts` chạy qua
#   tsx — không viết tay; 432 căn, 60 upi của buildSampleListings.
#   Bảng danh mục: catalog_nodes, catalog_buildings, catalog_stacks, catalog_units, catalog_aliases (5); bảng của sàn:
#   company_catalog_aliases (trỏ toà hay căn bằng khoá ngoại, đúng một trong hai).
#   Mã riêng — bộ dữ liệu viết trước. E17 (thuần, khoá giả trong bài): sàn A «Sapphire 5» (ten) → toà S1.05;
#     «SA5-12.08» (ma) → căn S1.05-1208; «S1.05-1209» (ma) → căn S1.05-1210 — chuỗi trùng mã gốc của căn khác, trong A
#     phải ra S1.05-1210 nguồn 'san'; sàn B «SA5-12.08» → căn E1-0903. Tra: 'op1/S1.05-1208' → 'goc'; 'Q12A-17-05A' → 'doc'
#     (Q12A/17/05A); 'XYZ' → 'khong-tim-thay'. E16 (cơ sở dữ liệu, danh mục mẫu thật): sàn A «SA5-12.08» → căn
#     S1.05-1206, sàn B cùng chuỗi → căn E1-0903 (mẫu chỉ có trục 01–06, nên ví dụ cũ S1.05-1208 không có căn thật).
