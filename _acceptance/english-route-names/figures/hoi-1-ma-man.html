<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 · Mã màn cũ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Lora', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · english-route-names · Hỏi-1</p>
    <h1>Hồ sơ đã ký khai mã màn cũ thì sao?</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <!-- Sổ màn → hai bộ đọc (fanned attach points) -->
      <path d="M240 128 H264 Q272 128 272 120 V92 Q272 84 280 84 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M240 152 H264 Q272 152 272 160 V188 Q272 196 280 196 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Hai bộ đọc → điểm gộp → rẽ -->
      <path d="M496 84 H528 Q536 84 536 92 V136" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M496 196 H528 Q536 196 536 188 V144" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="540" y1="140" x2="580" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ → Qua / Đỏ -->
      <path d="M656 88 V68 Q656 60 664 60 H784" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M656 192 V212 Q656 220 664 220 H784" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="536" cy="140" r="4" fill="#2d3142"/>

      <!-- Arrow labels -->
      <rect x="692" y="36" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="724" y="48" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐÃ KÝ</text>
      <rect x="684" y="196" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="724" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐANG MỞ</text>

      <!-- Sổ màn (focal) -->
      <rect x="40" y="104" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="104" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="52" y="112" width="56" height="16" rx="2" fill="none" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
      <text x="80" y="124" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SỔ MÀN</text>
      <text x="228" y="124" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">KHUYÊN</text>
      <text x="52" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">company-layer.yaml</text>
      <text x="52" y="168" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">old_ids: [tuy-chinh-san]</text>

      <!-- Bộ đọc 1 -->
      <rect x="320" y="56" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="332" y="64" width="56" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="360" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BỘ ĐỌC</text>
      <text x="332" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">coverage_matrix</text>

      <!-- Bộ đọc 2 -->
      <rect x="320" y="168" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="332" y="176" width="56" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="360" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BỘ ĐỌC</text>
      <text x="332" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace">proof_gate</text>

      <!-- Rẽ theo trạng thái hồ sơ -->
      <polygon points="656,88 732,140 656,192 580,140" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="656" y="136" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ khai</text>
      <text x="656" y="152" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">tuy-chinh-san</text>

      <!-- Kết quả -->
      <rect x="784" y="36" width="152" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qua</text>
      <text x="860" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nhận nhờ old_ids</text>

      <rect x="784" y="196" width="152" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đỏ</text>
      <text x="860" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nêu company-layer</text>

      <!-- Lối khác -->
      <rect x="40" y="280" width="896" height="112" rx="8" fill="#ececec" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="56" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LỐI KHÁC · KHÔNG KHUYÊN</text>

      <rect x="56" y="316" width="424" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="72" y="340" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Giữ mã cũ</text>
      <text x="72" y="360" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Không đụng <tspan font-family="'Geist Mono', monospace">tools/</tspan>, nhưng còn 2 tên tệp tiếng Việt</text>

      <rect x="496" y="316" width="424" height="60" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="512" y="340" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Sửa hồ sơ đã ký</text>
      <text x="512" y="360" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Phá luật «hồ sơ đã ký không sửa»</text>

      <!-- Legend -->
      <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="128" y="452" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="160" y="461" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khuyên</text>
      <rect x="248" y="452" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="461" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bộ đọc sổ màn</text>
      <polygon points="388,458 400,452 412,458 400,464" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="461" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ theo trạng thái hồ sơ</text>
      <rect x="560" y="452" width="24" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="592" y="461" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khác</text>
      <text x="920" y="461" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-6 · AC-7</text>
    </svg>
  </div>
</body>
</html>
