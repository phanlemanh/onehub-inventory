<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-2 · Phạm vi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Lora', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · english-route-names · Hỏi-2</p>
    <h1>Từ truy vấn của Bảng hàng: tách hàng hay gộp?</h1>

    <svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Cột trái: Vòng này (khuyên) -->
      <rect x="40" y="40" width="432" height="304" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="432" height="304" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="60" y="68" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KHUYÊN · LÀM NGAY</text>
      <text x="60" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Vòng này</text>
      <line x1="60" y1="108" x2="452" y2="108" stroke="rgba(235,108,54,0.35)" stroke-width="0.8"/>

      <text x="60" y="136" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Địa chỉ màn</text>
      <text x="60" y="154" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">/tuy-chinh-san <tspan fill="#4f5d75">→ /company-layer</tspan></text>

      <text x="60" y="188" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Từ chọn phần</text>
      <text x="60" y="206" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">?phan= <tspan fill="#4f5d75">→ ?part=</tspan></text>

      <text x="60" y="240" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Bản mẫu bộ nút</text>
      <text x="60" y="258" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">/proto/bo-nut-theo-quyen <tspan fill="#4f5d75">→ /proto/permitted-actions</tspan></text>

      <text x="60" y="292" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Mã màn</text>
      <text x="60" y="310" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">tuy-chinh-san <tspan fill="#4f5d75">→ company-layer</tspan></text>
      <text x="60" y="326" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">proto-bo-nut <tspan fill="#4f5d75">→ proto-permitted-actions</tspan></text>

      <!-- Cột phải: Hàng riêng kế tiếp -->
      <rect x="488" y="40" width="432" height="304" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="508" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OUT OF SCOPE · ĐỂ SAU</text>
      <text x="508" y="92" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Hàng riêng kế tiếp</text>
      <line x1="508" y1="108" x2="900" y2="108" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="508" y="136" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Bảng hàng · 8 từ truy vấn</text>
      <g font-family="'Geist Mono', monospace" font-size="10" fill="#2d3142" text-anchor="middle">
        <rect x="508" y="148" width="48" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="532" y="162">?vai=</text>
        <rect x="564" y="148" width="48" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="588" y="162">?mau=</text>
        <rect x="620" y="148" width="40" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="640" y="162">?ma=</text>
        <rect x="668" y="148" width="48" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="692" y="162">?toa=</text>
        <rect x="724" y="148" width="60" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="754" y="162">?du-an=</text>
        <rect x="508" y="176" width="60" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="538" y="190">?ho-so=</text>
        <rect x="576" y="176" width="52" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="602" y="190">?vung=</text>
        <rect x="636" y="176" width="76" height="20" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="674" y="190">?goc-nhin=</text>
      </g>

      <text x="508" y="240" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Bản mẫu theo slug</text>
      <text x="508" y="258" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">/proto/[slug] ?quyen=</text>

      <text x="508" y="292" fill="#636b80" font-size="10" font-family="'Geist', sans-serif">Kéo theo</text>
      <text x="508" y="310" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">~20 tệp bài kiểm</text>
      <text x="508" y="326" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">tools/deploy/thu-ban-dung.sh</text>

      <!-- Legend -->
      <line x1="40" y1="372" x2="920" y2="372" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="128" y="392" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="160" y="401" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đổi trong vòng này</text>
      <rect x="288" y="392" width="24" height="12" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="401" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Tách thành hàng riêng</text>
      <text x="920" y="401" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">CONTRACT · OUT OF SCOPE</text>
    </svg>
  </div>
</body>
</html>
