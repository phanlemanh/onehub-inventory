<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-3 · Chấm</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Lora', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · english-route-names · Hỏi-3</p>
    <h1>Chấm ở đâu khi đợt điều phối đang nghỉ?</h1>

    <svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <line x1="280" y1="160" x2="312" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M376 116 V84 Q376 76 384 76 H496" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M376 204 V236 Q376 244 384 244 H496" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="720" y1="76" x2="776" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="244" x2="776" y2="244" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="408" y="52" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="440" y="64" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYÊN</text>
      <rect x="400" y="220" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="440" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI KHÁC</text>

      <!-- Bối cảnh -->
      <rect x="40" y="124" width="240" height="72" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="160" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đợt điều phối đang nghỉ</text>
      <text x="160" y="174" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Móc chặn chấm trong thư mục kho</text>

      <!-- Rẽ -->
      <polygon points="376,116 440,160 376,204 312,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chấm ở đâu?</text>

      <!-- Nhánh khuyên -->
      <rect x="496" y="40" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="40" width="224" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="512" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Chấm từ bản chép</text>
      <text x="512" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">~/dev/onehub-inventory-cham-url</text>

      <!-- Nhánh khác -->
      <rect x="496" y="216" width="224" height="56" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="512" y="248" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Chờ đợt chạy lại</text>

      <!-- Kết quả -->
      <rect x="776" y="52" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="856" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S4 chạy ngay</text>
      <rect x="776" y="220" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="856" y="248" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vòng đứng sau S3</text>

      <!-- Legend -->
      <line x1="40" y1="312" x2="920" y2="312" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <line x1="128" y1="337" x2="156" y2="337" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="164" y="340" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khuyên</text>
      <line x1="248" y1="337" x2="276" y2="337" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="284" y="340" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khác</text>
      <rect x="360" y="332" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="392" y="340" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Hệ quả</text>
      <text x="920" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">HỎI-3</text>
    </svg>
  </div>
</body>
</html>
