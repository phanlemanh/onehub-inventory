    expected: "exit 0; ca 'saved view round trip' ở 1440 trên Postgres dãy K: đăng nhập người A, dựng trên Bảng hàng cách xem của E1 bằng giao diện (gõ ô tìm, lọc hai cột, sắp Giá chào giảm, bật nhóm theo Toà, tắt hai cột), lưu tên '[MAU] Toà S1.01 đang bán'; ghi lại danh sách mã căn theo thứ tự, danh sách nhóm và tiêu đề cột đang hiện; rồi (a) bấm 'Tất cả căn' rồi bấm mục góc nhìn, (b) tải lại trang, (c) mở địa chỉ góc nhìn trong một browser context mới đăng nhập cùng người A — ở cả ba đường (hằng 3) mã căn theo thứ tự, nhóm, cột và chữ ô tìm BẰNG bản ghi lại; tập mã căn cũng BẰNG tập tính độc lập trong bài từ dữ liệu mẫu theo luật lọc; ca phá mở góc nhìn với cách xem bị bỏ phần nhóm (sửa dòng trong cơ sở dữ liệu) và khẳng định 'reopened view differs: groups'; ca 'phone sheet' ở 360: mở ngăn trượt, mục góc nhìn có trong cột thứ hai của ngăn ngay lần vẽ đầu, bấm vào thì mã căn theo thứ tự BẰNG bản ghi lại ở 1440 và ngăn đóng"
