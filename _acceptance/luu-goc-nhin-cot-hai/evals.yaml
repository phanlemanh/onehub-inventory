    executor: script
    cmd: config:executors.script.goc_nhin_db
    layer: backend-effect
    paths: [src/modules/listings/**, "src/app/api/v1/saved-views/**", db/migrations/**, tests/db/goc-nhin.db.test.ts]
    expected: "exit 0; tests/db/goc-nhin.db.test.ts khối 'save': gửi POST /api/v1/saved-views qua route handler thật với phiên của người A (sàn 1) và một cách xem viết trước đủ năm thứ (ô tìm 'S1', lọc Toà [S1.01] + Trạng thái [Active], sắp Giá chào giảm, nhóm bật, ẩn Dự án và Xác nhận lúc); đọc lại dòng saved_view bằng vai quản trị của bài: company_id = sàn 1, người lưu = A, tên đúng, cách xem BẰNG đối tượng gửi (so sâu từng trong năm khoá, hằng 5); ca phá gửi cách xem thiếu khoá sắp xếp và khẳng định thông điệp 'saved view lost part: sort'; ca phá thứ hai ghi bằng company_id của phiên khác và khẳng định 'saved view stored under wrong company'"
