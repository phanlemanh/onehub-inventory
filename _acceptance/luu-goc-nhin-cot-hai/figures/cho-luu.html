<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc nhìn lưu ở đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · Cổng Phạm vi · Lưu góc nhìn</p>
    <h1>Góc nhìn lưu ở đâu: trên máy chủ hay trên trình duyệt</h1>

    <svg viewBox="0 0 1000 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane bands -->
      <rect x="272" y="48" width="688" height="160" rx="8" fill="rgba(235,108,54,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="292" y="76" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">A · LƯU TRÊN MÁY CHỦ · MÁY KHUYÊN</text>

      <rect x="272" y="248" width="688" height="160" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="292" y="276" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">B · LƯU TRÊN TRÌNH DUYỆT</text>

      <!-- Connectors (drawn before boxes) -->
      <!-- Start → A: server (focal path) -->
      <path d="M240 216 H288 Q296 216 296 208 V140 Q296 132 304 132 H360" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Start → B: browser -->
      <path d="M240 240 H304 Q312 240 312 248 V316 Q312 324 320 324 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A: server → outcome -->
      <line x1="584" y1="132" x2="688" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B: browser → outcome -->
      <line x1="584" y1="324" x2="688" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px above the line) -->
      <rect x="588" y="108" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="636" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỌC TỪ MÁY CHỦ</text>
      <rect x="588" y="300" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="636" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHỈ Ở MÁY NÀY</text>

      <!-- Start: the inventory table -->
      <rect x="40" y="184" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="184" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng hàng</text>
      <text x="140" y="232" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lọc, sắp, nhóm, ẩn cột</text>
      <text x="140" y="248" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">rồi bấm «Lưu góc nhìn»</text>

      <!-- A1: company's server (focal) -->
      <rect x="360" y="96" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="96" width="224" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="472" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ của sàn</text>
      <text x="472" y="148" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mỗi sàn một ngăn riêng, sàn khác không thấy</text>

      <!-- A2: outcome -->
      <rect x="688" y="96" width="248" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="96" width="248" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="812" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở ở máy khác, tải lại trang</text>
      <text x="812" y="148" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">góc nhìn vẫn còn</text>

      <!-- B1: this browser -->
      <rect x="360" y="288" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="288" width="224" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trình duyệt của máy này</text>
      <text x="472" y="336" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dữ liệu của sàn nằm trên máy</text>
      <text x="472" y="350" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trái luật của kho</text>

      <!-- B2: outcome -->
      <rect x="688" y="288" width="248" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="288" width="248" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="812" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đổi máy: mất góc nhìn</text>
      <text x="812" y="340" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đăng xuất: phải xoá khỏi máy</text>

      <!-- Legend -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ THÍCH</text>

      <line x1="40" y1="484" x2="68" y2="484" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="80" y="488" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Đường máy khuyên</text>

      <line x1="220" y1="484" x2="248" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="260" y="488" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Lối khác</text>

      <rect x="360" y="476" width="24" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="396" y="488" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Nơi góc nhìn được cất</text>

      <text x="960" y="488" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="end">Tiêu chí liên quan: AC-1 · AC-2 · AC-7</text>
    </svg>
  </div>
</body>
</html>
