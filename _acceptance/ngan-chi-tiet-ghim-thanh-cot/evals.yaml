    cmd: config:executors.script.ghim_ngan_e2e
    paths: [src/components/candidate/record-panel.tsx, src/components/candidate/grid-copy.ts, tests/e2e/ghim-ngan.spec.ts]
    expected: "exit 0; trong tests/e2e/ghim-ngan.spec.ts ở khổ 1440 và 1024, trên /inventory và /sent với hồ sơ dòng đầu đang mở: dòng hai của đầu hồ sơ ([data-slot=record-panel-actions]) có đúng một nút tên 'Ghim thành cột', thứ tự các nút trong dòng là [nút của bản ghi…, Ghim thành cột, Trước, Sau, Đóng] (so theo vị trí trái sang phải); ở khổ 360 và 414 hồ sơ có data-record-layout=screen và không có nút tên 'Ghim thành cột' hay 'Bỏ ghim'; ở khổ 1024 với cột thứ hai App Shell mở (vùng dữ liệu dưới 800 px) không có nút ghim và hồ sơ là float; gập cột thứ hai (vùng dữ liệu từ 800 px) thì có nút và sau khi ghim cột ≥ 320 px, vùng dữ liệu ≥ 480 px; ở 768 không có nút dù cột thứ hai mở hay gập; ca đối chứng trên bản dựng mà nút đặt sau 'Đóng' cho 'pin button out of place: after Đóng'"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

