    expected: "exit 0; ở 1440 và 1024, trên /inventory và trên /sent (cùng các vế): đếm số đầu cột đang hiện của lưới trước khi mở hồ sơ (n); bấm Ghim thì hồ sơ có data-record-layout=pinned, không có box-shadow, mép phải cột = mép phải vùng làm việc App Shell (lệch ≤ 1 px), mép phải [data-slot=data-region] ≤ mép trái cột + 1 px, bề rộng [data-slot=data-region] ≥ 480 px, số đầu cột đang hiện vẫn là n, nút mang tên 'Bỏ ghim' và aria-pressed=true; bấm 'Bỏ ghim' thì cùng data-record-id, data-record-layout=float, bề rộng vùng dữ liệu bằng bề rộng đo lúc chưa mở hồ sơ (lệch ≤ 1 px); trước khi ghim cuộn thân hồ sơ ([data-slot=record-panel-body]) xuống 120 px, sau khi ghim và sau khi bỏ ghim scrollTop vẫn là 120 ± 1 và document.activeElement là nút ghim (tên mới); ca đối chứng bản dựng gắn lại cây khi đổi dáng cho 'record remounted on pin: scroll 0', ca đối chứng bản dựng giấu cột khi ghim cho 'columns hidden on pin: n → n-1', bản dựng không co vùng cho 'region under pinned column', bản dựng để vùng dữ liệu dưới 480 px khi ghim cho 'grid under 480 px when pinned'"
