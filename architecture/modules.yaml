# Business modules (bounded contexts) and who may depend on whom.
# Enforced by tools/boundaries.py in `make check`. Changing this file is a design decision:
# record it in wiki/decisions/.
#
# MVP scope. leads, exports and notifications return when their release comes; sync (offline mode) only after the MVP
# (docs/design-standard-proposal.md).
# Dependencies are left empty and are added as each module is built.
modules:
  - name: identity
    description: Accounts, sessions, companies, members and roles
    owns: [Company]
    depends_on: []
  - name: company-config
    description: Per-company settings, labels, custom statuses and fields, value aliases, templates
    owns: []
    depends_on: []
  - name: agreements
    description: Connection kinds and agreements
    owns: [Agreement]
    depends_on: []
  - name: catalog
    description: Shared catalog of subdivisions, buildings and units
    owns: [Subdivision, Complex, Building, Stack, Unit, CatalogAlias, CompanyCatalogAlias]
    depends_on: []
  - name: listings
    description: Listings, status, pricing and fees, freshness, events, photos
    owns: [Listing, ListingUnit, SavedView]
    depends_on: [identity] # saved views (row 2c): the shared action door and withCompany, decision 0025
  - name: contacts
    description: Contacts, phones and duplicate detection
    owns: [Contact, ListingOwner]
    depends_on: []
  - name: sharing
    description: Share links, the public customer page and redaction
    owns: []
    depends_on: []
  - name: imports
    description: Data import, including the AI-assisted planning call
    owns: []
    depends_on: []
  - name: workspace
    description: Today queues, navigation and team views
    owns: []
    depends_on: []
