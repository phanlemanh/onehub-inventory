# Install once per clone: pre-commit install   (Python projects: uv run pre-commit install)
# Update hook versions:   pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # For CI (.github/workflows/security.yml). The hook above reads staged changes, and CI
      # stages nothing: this one reads every commit of the branch being checked.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in every commit of this branch
        entry: gitleaks git --redact --verbose --log-opts=HEAD
        stages: [manual]

  - repo: local
    hooks:
      - id: lint
        name: eslint + prettier
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|mjs|cjs|json|md|ya?ml)$

  - repo: local
    hooks:
      - id: commit-message
        name: Commit message
        entry: python3 tools/commit_msg.py
        language: system
        stages: [commit-msg]
