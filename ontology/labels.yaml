# Display labels of the product, one entry per concept. Model: SKOS (one preferred label, many alternatives).
# Rules and how to change them: design/language.md. Checked by tests/language.test.ts.
#
#   kind   entity | role | side | party | status | surface | action | field
#   reso   RESO Data Dictionary 2.1 name. A concept with no RESO name sets `own: true` instead.
#   pref   preferred label, the default everywhere
#   lease  label used when the listing is for lease, for labels that say "bán"
#   alt    alternative labels: searchable, and a company may choose one
#   en     English display label
#   avoid  words that must not be used for this concept
version: 1
