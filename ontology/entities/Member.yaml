name: Member
description: A person who works in one company, with the roles that company gave them and the name it knows them by.
reso: Member (RESO 2.1 resource for a person who belongs to an office)

properties:
  companyId: { type: uuid, required: true }
  userId: { type: uuid, required: true }
  name: { type: string, required: true, pii: true, display: person }
  roles: { type: string, required: true }
  invitedBy: { type: uuid }
  invitedAt: { type: datetime }

rules:
  - id: roles-from-register
    description: Roles are a non-empty set taken from ontology/roles.yaml, without repeats.
    implemented_in: db/migrations/003_moi_nguoi_gan_vai.sql
  - id: company-admin-manages-people
    description: Who lists, invites and changes the roles of the members of the current company is the permission table (ontology/actions.yaml rows listMembers, inviteMember, changeMemberRoles; today CompanyAdmin only); a person reads their own row.
    implemented_in: db/migrations/006_bang_quyen_theo_vai.sql
  - id: one-admin-left
    description: A company always keeps at least one CompanyAdmin.
    implemented_in: db/migrations/003_moi_nguoi_gan_vai.sql
  - id: name-per-company
    description: Each company keeps its own name for the person; another company never sees it.
    implemented_in: db/migrations/003_moi_nguoi_gan_vai.sql

code:
  model: src/modules/identity/
  tests: tests/db/
wiki: wiki/entities/member.md

# Lifecycle of this entity on the screens that show it (roadmap row 1t, tools/coverage_matrix/lifecycle.py). Each cell:
# co = an action of ontology/actions.yaml (a planned one names the row that opens it), hang = a roadmap row will do it,
# khong = deliberately absent, with the owner's gate line in duyet. Cells as approved at the 1t scope gate.
vong_doi:
  them: { co: inviteMember }
  xem: { co: listMembers }
  sua: { co: changeMemberRoles }
  go:
    hang: "18a"
    ly_do: "Locking a person who left and removing a person from the company; no draft permission yet."
