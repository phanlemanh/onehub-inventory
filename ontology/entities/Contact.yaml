name: Contact
description: One person a company works with; owner, buyer, tenant and landlord are types of contact, not separate records.
reso: Contacts (ContactKey, FullName, ContactType, OwnerMemberKey); DD 2.1 keeps the plural resource name

properties:
  id: { type: uuid, required: true, unique: true }
  companyId: { type: ref, target: Company, required: true }
  fullName: { type: string, pii: true, display: person, reso: FullName }
  contactTypes: { type: string, required: true, display: select, reso: ContactType }
  phones: { type: string, pii: true, display: phone, reso: "MobilePhone, HomePhone, OtherPhone" }
  ownerMemberKey: { type: string }

code:
  model: src/modules/contacts/
  tests: tests/
wiki: wiki/entities/contact.md
