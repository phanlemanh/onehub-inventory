name: Listing
description: One offer by a company to sell or lease one unit.
reso: Property (StandardStatus, ListPrice, ClosePrice, CloseDate, Furnished, OccupantType, OriginalEntryTimestamp)

properties:
  id: { type: uuid, required: true, unique: true }
  companyId: { type: ref, target: Company, required: true }
  subdivisionName: { type: string, display: text, reso: SubdivisionName }
  buildingName: { type: string, required: true, display: text, reso: BuildingName }
  unitNumber: { type: string, display: text, reso: UnitNumber }
  standardStatus:
    {
      type: enum,
      values: [Incomplete, Active, Pending, Closed, Hold, Withdrawn],
      required: true,
      display: status,
      reso: StandardStatus,
    }
  listPrice: { type: integer, min: 1, display: money, reso: ListPrice }
  closePrice: { type: integer, min: 1, display: money, reso: ClosePrice }
  closeDate: { type: date, display: date, reso: CloseDate }
  withdrawnReason:
    { type: enum, values: [sold_elsewhere, owner_changed_mind, unreachable], display: select }
  lastConfirmedAt: { type: datetime, display: datetime }
  originalEntryTimestamp: { type: datetime, display: datetime, reso: OriginalEntryTimestamp }
  furnished:
    { type: enum, values: [Furnished, Partially, Unfurnished], display: select, reso: Furnished }
  occupantType: { type: enum, values: [Owner, Tenant, Vacant], display: select, reso: OccupantType }
  # Whether the list price already holds the company's fee items (row 19, thue-phi): Included (Bao phí) or Excluded
  # (Không bao phí). Our own; RESO 2.1 has no such field. Stored on the listings table from row 10.
  feeInclusion: { type: enum, values: [Included, Excluded], display: select }
  legalStatus: { type: string, display: text }
  financing: { type: string, display: text }
  version: { type: integer, min: 1, required: true, display: none }
  # The company's own columns (row 7e), keyed by CustomField code; each value fits its field's kind. Stored on the
  # listings table from row 10.
  customFields: { type: json, display: none }

rules:
  - id: closed-needs-price-and-date
    description: A Closed listing must have closePrice and closeDate.
  - id: withdrawn-needs-reason
    description: A Withdrawn listing must have withdrawnReason.
  - id: one-open-listing-per-unit
    description: Within one company a unit has at most one open listing (Incomplete, Active, Pending or Hold); Closed and Withdrawn listings stay as earlier listings of the unit.
    implemented_in: src/modules/listings/sample.ts
  - id: no-seventh-status
    description: Companies add labels anchored to the six standard values; they never add a seventh value.

code:
  model: src/modules/listings/
  tests: tests/
wiki: wiki/entities/listing.md
