# Relations between entities.
# from / to must be names of files in ontology/entities/.
# cardinality: one-to-one | one-to-many | many-to-one | many-to-many
relations:
  - from: Company
    name: employs
    to: Member
    cardinality: one-to-many
    description: A company holds its own members; the same person at two companies is two members.
  - from: Company
    name: offers
    to: Listing
    cardinality: one-to-many
    description: A company holds its own listings.
  - from: Unit
    name: offered_as
    to: Listing
    cardinality: one-to-many
    description: One unit can be offered by several companies, or several times.
  - from: Company
    name: works_with
    to: Contact
    cardinality: one-to-many
    description: A contact belongs to one company; the same person at two companies is two contacts.
  - from: Contact
    name: owns
    to: Listing
    cardinality: many-to-many
    description: RESO ContactListings links contacts and listings.
  - from: Company
    name: signs
    to: Agreement
    cardinality: one-to-many
    description: Every connection a company enables is one agreement.
  - from: Company
    name: holds_owner_link
    to: ListingOwner
    cardinality: one-to-many
    description: A company holds the owner links of its own listings.
  - from: Contact
    name: owns_through
    to: ListingOwner
    cardinality: one-to-many
    description: A contact owns listings through owner links; this is how Contact owns Listing is stored.
  - from: Listing
    name: owned_through
    to: ListingOwner
    cardinality: one-to-many
    description: A listing has zero or more owner links.
  - from: Company
    name: holds_unit_link
    to: ListingUnit
    cardinality: one-to-many
    description: A company holds the unit links of its own listings.
  - from: Listing
    name: placed_on
    to: ListingUnit
    cardinality: one-to-one
    description: Each listing points at exactly one catalog unit.
  - from: Unit
    name: offered_through
    to: ListingUnit
    cardinality: one-to-many
    description: One unit can be offered by several listings; this is how Unit offered_as Listing is stored.
