# Relations between entities.
# from / to must be names of files in ontology/entities/.
# cardinality: one-to-one | one-to-many | many-to-one | many-to-many
relations:
  - from: Company
    name: employs
    to: Member
    cardinality: one-to-many
    description: A company holds its own members; the same person at two companies is two members.
  - from: Company
    name: offers
    to: Listing
    cardinality: one-to-many
    description: A company holds its own listings.
  - from: Unit
    name: offered_as
    to: Listing
    cardinality: one-to-many
    description: One unit can be offered by several companies, or several times.
  - from: Company
    name: works_with
    to: Contact
    cardinality: one-to-many
    description: A contact belongs to one company; the same person at two companies is two contacts.
  - from: Contact
    name: owns
    to: Listing
    cardinality: many-to-many
    description: RESO ContactListings links contacts and listings.
  - from: Company
    name: signs
    to: Agreement
    cardinality: one-to-many
    description: Every connection a company enables is one agreement.
  - from: Company
    name: holds_owner_link
    to: ListingOwner
    cardinality: one-to-many
    description: A company holds the owner links of its own listings.
  - from: Contact
    name: owns_through
    to: ListingOwner
    cardinality: one-to-many
    description: A contact owns listings through owner links; this is how Contact owns Listing is stored.
  - from: Listing
    name: owned_through
    to: ListingOwner
    cardinality: one-to-many
    description: A listing has zero or more owner links.
  - from: Company
    name: holds_unit_link
    to: ListingUnit
    cardinality: one-to-many
    description: A company holds the unit links of its own listings.
  - from: Listing
    name: placed_on
    to: ListingUnit
    cardinality: one-to-one
    description: Each listing points at exactly one catalog unit.
  - from: Unit
    name: offered_through
    to: ListingUnit
    cardinality: one-to-many
    description: One unit can be offered by several listings; this is how Unit offered_as Listing is stored.
  - from: Subdivision
    name: divided_into
    to: Complex
    cardinality: one-to-many
    description: A project holds its complexes; a complex belongs to exactly one project.
  - from: Subdivision
    name: holds_building
    to: Building
    cardinality: one-to-many
    description: Every tower belongs to one project, through a complex when one is known.
  - from: Building
    name: has_stack
    to: Stack
    cardinality: one-to-many
    description: A stack belongs to one tower.
  - from: Building
    name: contains
    to: Unit
    cardinality: one-to-many
    description: A unit belongs to one tower, and to one of its stacks when the stack is known.
  - from: Company
    name: names_in_catalog
    to: CompanyCatalogAlias
    cardinality: one-to-many
    description: A company holds its own codes and names for catalog towers and units.
  - from: Company
    name: keeps_views_of
    to: SavedView
    cardinality: one-to-many
    description: A company holds the saved views of its members; each view belongs to the one member who saved it.
  - from: Company
    name: labels_concepts_with
    to: CompanyLabel
    cardinality: one-to-many
    description: A company holds its own words for standard concepts; one in use per concept.
  - from: Company
    name: sets_fees_with
    to: FeeItem
    cardinality: one-to-many
    description: A company holds the fee items it changed or added; an item with no row is at its default.
  - from: Company
    name: keeps_custom_fields
    to: CustomField
    cardinality: one-to-many
    description: A company holds its own columns; at most 20 in use.
  - from: Company
    name: spells_values_as
    to: CompanyValueAlias
    cardinality: one-to-many
    description: A company holds the texts it writes for standard values.
  - from: Company
    name: holds_pending_units
    to: PendingUnit
    cardinality: one-to-many
    description: A company holds the units it has that the shared catalog does not have yet.
  - from: PendingUnit
    name: matched_to
    to: Unit
    cardinality: many-to-one
    description: A pending unit points to the catalog unit it was matched with, once the catalog has it.
  - from: Company
    name: remembers_templates
    to: ImportTemplate
    cardinality: one-to-many
    description: A company holds the sheet shapes it imported and where each column went.
  - from: Company
    name: holds_share_link
    to: ShareLink
    cardinality: one-to-many
    description: A company holds the links its members sent; no other company sees them.
  - from: ShareLink
    name: includes
    to: Listing
    cardinality: many-to-many
    description: A link carries one or more listings of its company; a listing can go out in several links.
